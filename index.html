/* Build 7: adaptive layout, accessible household overview */
html,body{max-width:100%;overflow-x:hidden}
.shell{width:100%;min-width:0}
main{min-width:0;max-width:none;overflow-wrap:anywhere}
#app{min-width:0;width:100%}
.headingline{align-items:flex-start}
.headingline .desc{max-width:65ch}
.directory-table{width:100%;overflow-x:auto;overscroll-behavior-x:contain}
.directory-table table{min-width:780px}
.member-cards{display:none}
.household-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px;margin:16px 0}
.household-card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:20px;min-width:0}
.household-card h3{font:22px Georgia,serif;margin:0 0 7px}
.household-card .house-meta{color:var(--muted);font-size:12px;margin-bottom:14px}
.household-card .house-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}
.household-detail{padding:0;overflow:hidden;margin-bottom:22px;border-color:#bd9c86}
.household-detail-head{background:linear-gradient(115deg,#710014,#4d0712);padding:24px;color:#fff;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.household-detail-head h2{font:28px Georgia,serif;margin:5px 0}
.household-detail-head p{color:#f4dfe0;margin:0;font-size:12px}
.household-detail-head .btn{background:#fff9}
.household-detail-body{padding:20px}
.household-member-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:11px;margin:14px 0}
.household-member{padding:14px;border:1px solid var(--line);border-radius:10px;background:#fdfaf6;min-width:0}
.household-member strong{display:block;font-size:13px;overflow-wrap:anywhere}
.household-member .member-meta{font-size:11px;color:var(--muted);margin:5px 0 11px}
.household-member .btn{max-width:100%}
.household-detail .kpirow{margin:0 0 10px}
.mobile-nav-toggle{display:none}

 main{padding:16px 14px 50px;width:100%;margin:0}

 .headingline{align-items:flex-start}.headingline>.btn{flex:0 0 auto}
 .directory-table{display:none}.member-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:10px}

/* Build 9: implemented redesigned family member editor, desktop and mobile */
dialog.member-editor-dialog{width:min(1080px,calc(100vw - 32px));max-width:1080px;max-height:min(94vh,1000px);padding:0;border:1px solid #e1d2c4;border-radius:19px;box-shadow:0 32px 95px #311a1936;overflow:auto;background:#faf7f2}
.member-editor{color:#28211f;font-family:Arial,Helvetica,sans-serif}

.member-editor-head h2{font:35px/1.14 Georgia,serif;color:#710014;margin:9px 0 6px}
.member-editor-head p{margin:0;color:#736963;font-size:13px}
.editor-close{border:1px solid #e4d8ce;background:#fffdf9;color:#710014;border-radius:10px;width:35px;height:35px;font-size:25px;line-height:1;cursor:pointer}
.editor-layout{display:grid;grid-template-columns:minmax(0,1fr) 238px;gap:19px;padding:8px 32px 10px;align-items:start}
.editor-main{min-width:0;display:flex;flex-direction:column;gap:12px}
.member-panel{border:1px solid #e8d9ce;background:#fffdfa;border-radius:13px;overflow:hidden;box-shadow:0 2px 9px #6e39200a}
.member-panel summary{list-style:none;display:flex;align-items:center;gap:11px;cursor:pointer;padding:17px 18px;user-select:none}
.member-panel summary::-webkit-details-marker{display:none}
.member-panel .mp-icon{width:35px;height:35px;border-radius:10px;background:#f8e9e5;color:#810f24;display:grid;place-items:center;font-size:21px;flex:none}
.mp-heading{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.mp-heading strong{font:20px/1.13 Georgia,serif;color:#710014}

.mp-chevron{color:#896d64;font-size:23px;transform:rotate(0deg);transition:transform .15s}
.member-panel[open] .mp-chevron{transform:rotate(180deg)}
.mp-inner{padding:0 18px 19px}
.member-editor .formgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 16px}
.member-editor .formgrid label:not(.member-switch){font:600 12px/1.3 Arial,Helvetica,sans-serif;color:#574740;gap:6px;min-width:0}
.member-editor .formgrid label:not(.member-switch) span{display:block}
.member-editor .formgrid input:not([type=checkbox]):not([type=file]),.member-editor .formgrid select,.member-editor .formgrid textarea{background:#fff;color:#272322;border:1px solid #d8cdc4;border-radius:7px;padding:11px 12px;min-height:41px;font:13px Arial,Helvetica,sans-serif;outline-offset:2px}
.member-editor .formgrid input:focus,.member-editor .formgrid select:focus,.member-editor .formgrid textarea:focus{border-color:#9d5461;outline:2px solid #f4e2e5}
.member-switches{display:flex;flex-wrap:wrap;gap:12px 28px;border-top:1px solid #f1e6de;padding-top:15px;margin-top:2px}
.member-editor .member-switch{display:inline-flex!important;flex-direction:row!important;align-items:center!important;gap:9px!important;color:#463b37!important;cursor:pointer;min-height:28px;position:relative;font-size:12px!important}
.member-switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch-track{display:block;width:37px;height:21px;border-radius:22px;background:#d7cbc4;position:relative;transition:background .15s}
.switch-track:after{content:'';display:block;width:15px;height:15px;border-radius:50%;background:white;position:absolute;top:3px;left:3px;box-shadow:0 1px 3px #0002;transition:left .15s}
.member-switch input:checked+.switch-track{background:#710014}
.member-switch input:checked+.switch-track:after{left:19px}
.member-switch input:focus-visible+.switch-track{outline:3px solid #d8a6ac;outline-offset:2px}
.member-switch small{font-size:10px;color:#956c70}

}
function saveExistingMemberAssignment(hid,form){

function deleteEmptyHousehold(hid){if(!fbUser||!cloudReady){notice('Cloud not ready');return}const h=db.households.find(x=>x.id===hid);if(!h)return;const count=memberCount(h);if(count){alert('This household has '+count+' member(s). Reassign them before deleting.');return}if(db.dues.some(d=>d.householdId===hid)){alert('This household has membership payment history and cannot be deleted as empty.');return}if(!confirm('Delete empty household “'+h.name+'”? This cannot be undone without a backup.'))return;db.households=db.households.filter(x=>x.id!==hid);if(selectedHousehold===hid)selectedHousehold='';save();notice('Empty household deleted · saving to cloud…')}
function deleteAllEmptyHouseholds(){const empty=db.households.filter(h=>memberCount(h)===0&&!db.dues.some(d=>d.householdId===h.id));if(!empty.length){notice('No removable empty households');return}if(!confirm('Delete '+empty.length+' empty household(s) without payment history? Existing people and paid households will be kept.'))return;const ids=new Set(empty.map(h=>h.id));db.households=db.households.filter(h=>!ids.has(h.id));if(ids.has(selectedHousehold))selectedHousehold='';save();notice(empty.length+' empty households deleted · saving to cloud…')}

let eventSearch='',eventFilter='all';
function isFounderMember(p){return Number(p.generation)===1&&(String(p.nickname||'').toLowerCase()==='daddy lolo'||String(p.nickname||'').toLowerCase()==='mama t'||/jeremias sahagun torres|estelita baluyot torres/i.test(displayName(p)))}
const eventMeta=()=>db.eventDetails?.[year]||{};
function eventGiftEligible(p){if(p.deceased||!isPHMember(p)||(p.household&&!isPHHousehold(db.households.find(h=>h.id===p.household)||{})))return false;const a=age(p.dob,eventMeta().date||year+'-12-01');return !!p.pwd||(a!==null&&a>=0&&a<=db.settings.childAge)}
function setEventMeta(field,value){if(!cloudReady)return;db.eventDetails ||= {};db.eventDetails[year] ||= {};db.eventDetails[year][field]=value;saveEventInline()}
function eventRecord(personId){return db.rsvps.find(r=>String(r.year)===String(year)&&r.personId===personId)}
function eventHouseholdRecord(hid){return (db.householdGifts||[]).find(r=>String(r.year)===String(year)&&r.householdId===hid)}
function eventMemberUpdate(pid,field,value){if(!cloudReady)return;let r=eventRecord(pid);if(!r){r={id:id(),year,personId:pid,status:'No response'};db.rsvps.push(r)}r[field]=value;if(field==='status'&&value==='Not attending'&&r.actualAttended){r.actualAttended=false}saveEventInline()}
function eventHouseholdUpdate(hid,field,value){if(!cloudReady)return;db.householdGifts ||= [];let r=eventHouseholdRecord(hid);if(!r){r={id:id(),year,householdId:hid};db.householdGifts.push(r)}r[field]=value;saveEventInline()}
function saveEventInline(){try{localStorage.setItem(KEY,JSON.stringify(db));const top=window.scrollY;const positions=[...document.querySelectorAll('.event-scroll')].map(e=>({top:e.scrollTop,left:e.scrollLeft}));render();window.scrollTo(0,top);document.querySelectorAll('.event-scroll').forEach((e,i)=>{if(positions[i]){e.scrollTop=positions[i].top;e.scrollLeft=positions[i].left}});queueCloudSave()}catch(e){alert('Could not save changes: '+e.message)}}
function setEventSearch(value){eventSearch=value;const top=window.scrollY;const positions=[...document.querySelectorAll('.event-scroll')].map(e=>({top:e.scrollTop,left:e.scrollLeft}));render();window.scrollTo(0,top);document.querySelectorAll('.event-scroll').forEach((e,i)=>{if(positions[i]){e.scrollTop=positions[i].top;e.scrollLeft=positions[i].left}});const inp=el('eventMemberSearch');if(inp){inp.focus();inp.setSelectionRange(value.length,value.length)}}
function setEventFilter(value){eventFilter=value;render()}
function eventDateString(){const m=eventMeta();return m.date||''}
function eventCheck(value,label,onchange,disabled=false){return `<label class="event-check ${disabled?'disabled':''}"><input type="checkbox" ${value?'checked':''} ${disabled?'disabled':''} onchange="${onchange}" aria-label="${esc(label)}"><span class="event-check-label">${esc(label)}</span></label>`}
function event(){
 const rs=db.rsvps.filter(x=>String(x.year)===String(year));
 const responseCount=rs.filter(x=>['Attending','Maybe','Not attending'].includes(x.status)).length;
 const planned=rs.filter(x=>x.status==='Attending').length;
 const actual=rs.filter(x=>x.actualAttended).length;
 const gifts=db.people.filter(eventGiftEligible);
 const payouts=rs.filter(r=>r.cashReceived&&db.people.some(p=>p.id===r.personId&&eventGiftEligible(p))).length;
 const phHouses=eligibleHouseholds();
 const searchTerm=eventSearch.trim().toLocaleLowerCase();
 let people=[...db.people].filter(p=>(!p.deceased&&!isFounderMember(p))||eventRecord(p.id));
 // Living relatives are listed by default; historical entries remain available for people who have since died.
 people=people.filter(p=>!searchTerm||[displayName(p),p.nickname,hname(p.household)].some(t=>String(t||'').toLowerCase().includes(searchTerm)))
   .filter(p=>eventFilter==='all'||(eventFilter==='attending'&&eventRecord(p.id)?.status==='Attending')||(eventFilter==='checked'&&eventRecord(p.id)?.actualAttended)||(eventFilter==='pending'&&!['Attending','Maybe','Not attending'].includes(eventRecord(p.id)?.status)))
   .sort((a,b)=>(hname(a.household)==='Unassigned'?'zzzz':hname(a.household)).localeCompare(hname(b.household)==='Unassigned'?'zzzz':hname(b.household),undefined,{sensitivity:'base'})||(a.nickname||displayName(a)).localeCompare(b.nickname||displayName(b),undefined,{sensitivity:'base'}));
 const dataRows=people.map(p=>{
  const r=eventRecord(p.id)||{},canGift=eventGiftEligible(p),rstatus=r.status||'No response',n=p.nickname||displayName(p);
  return `<tr><td><strong>${esc(n)}</strong>${n!==displayName(p)?`<small class="event-fullname">${esc(displayName(p))}</small>`:''}</td><td>${esc(hname(p.household))}</td><td><select class="event-rsvp" aria-label="RSVP for ${esc(n)}" onchange="eventMemberUpdate('${p.id}','status',this.value)">${['No response','Attending','Maybe','Not attending'].map(st=>`<option value="${st}" ${st===rstatus?'selected':''}>${st}</option>`).join('')}</select></td><td>${eventCheck(r.actualAttended,'Checked in',`eventMemberUpdate('${p.id}','actualAttended',this.checked)`)}</td><td>${canGift?eventCheck(r.cashReceived,'Cash received',`eventMemberUpdate('${p.id}','cashReceived',this.checked)`):'<span class="event-na">Not eligible</span>'}</td><td>${eventCheck(r.raffleWon,'Raffle winner',`eventMemberUpdate('${p.id}','raffleWon',this.checked)`)}</td><td>${eventCheck(r.gameWon,'Game winner',`eventMemberUpdate('${p.id}','gameWon',this.checked)`)}</td></tr>`;
 }).join('');
 const householdRows=sortHouses(phHouses).map(h=>{
  const r=eventHouseholdRecord(h.id)||{};return `<tr><td><button class="household-name-link" onclick="openHousehold('${h.id}')"><strong>${esc(h.name)}</strong></button><small class="event-fullname">${memberCount(h)} family members</small></td><td>${esc(h.gift||'Undecided')}</td><td>${eventCheck(r.groceryReceived,'Grocery received',`eventHouseholdUpdate('${h.id}','groceryReceived',this.checked)`)}</td><td>${eventCheck(r.cashReceived,'Cash received',`eventHouseholdUpdate('${h.id}','cashReceived',this.checked)`)}</td></tr>`
 }).join('');
 const m=eventMeta();
 return `${title('Annual Family Day','Manage invitations, check-ins, gift distribution and winners for each annual celebration.',`<button class="btn primary" onclick="rsvpForm()">+ Record RSVP</button>`)}
 <div class="toolbar event-years">${yeartool()}<span class="muted">Each year keeps its own attendance and distribution history.</span></div>
 <section class="card event-info" aria-label="Family Day event details"><div class="cardheader"><h3>Event details · ${year}</h3><span class="pill muted">Annual celebration</span></div><div class="event-fields"><label>Party date<input type="date" value="${esc(m.date||'')}" onchange="setEventMeta('date',this.value)"></label><label>Venue / location<input type="text" value="${esc(m.venue||'')}" placeholder="e.g. Jollibee Greenmeadows" onchange="setEventMeta('venue',this.value)"></label><label>Event notes<input type="text" value="${esc(m.notes||'')}" placeholder="Optional planning notes" onchange="setEventMeta('notes',this.value)"></label></div></section>
 <div class="stats event-stats">${stat('Will attend',planned,'Confirmed RSVPs')}${stat('Actually attended',actual,'Checked in at the event')}${stat('Responses',responseCount,db.people.length+' family records')}${stat('Maybe',rs.filter(r=>r.status==='Maybe').length,'Still deciding')}</div>
 <div class="stats event-stats">${stat('Eligible child / PWD gifts',gifts.length,'Confirmed PH-based eligibility')}${stat('Cash gifts distributed',payouts+' / '+gifts.length,'Individual gifts marked received')}${stat('Raffle winners',rs.filter(r=>r.raffleWon).length,'Marked in the tracker')}${stat('Game winners',rs.filter(r=>r.gameWon).length,'Marked in the tracker')}</div>
 <section class="card event-roster"><div class="cardheader"><div><h3>Family attendance & individual gifts</h3><p class="muted">The list comes from your Family Directory; no need to add each person again. RSVP and actual attendance are separate. Eligibility uses the event date.</p></div><span class="pill muted">${people.length} shown</span></div>
 <div class="event-roster-tools"><input id="eventMemberSearch" type="search" placeholder="Search member or household" value="${esc(eventSearch)}" oninput="setEventSearch(this.value)" aria-label="Search family attendance"><select aria-label="Filter attendance" onchange="setEventFilter(this.value)"><option value="all" ${eventFilter==='all'?'selected':''}>All family members</option><option value="attending" ${eventFilter==='attending'?'selected':''}>Will attend</option><option value="checked" ${eventFilter==='checked'?'selected':''}>Actually attended</option><option value="pending" ${eventFilter==='pending'?'selected':''}>No response</option></select></div>
 <div class="tablewrap event-scroll"><table class="event-table"><thead><tr><th>Member</th><th>Household</th><th>RSVP</th><th>Attended</th><th>Child / PWD cash</th><th>Raffle</th><th>Game</th></tr></thead><tbody>${dataRows||'<tr><td colspan="7" class="empty">No members match this filter.</td></tr>'}</tbody></table></div>
 </section>
 <section class="card event-roster"><div class="cardheader"><div><h3>Household gift distribution</h3><p class="muted">Track grocery and household cash gift handover once per Philippine household, separately from each child’s cash gift.</p></div><span class="pill muted">${phHouses.length} eligible households</span></div><div class="tablewrap event-scroll"><table class="event-table"><thead><tr><th>Household</th><th>Gift preference</th><th>Grocery received</th><th>Household cash received</th></tr></thead><tbody>${householdRows||'<tr><td colspan="4" class="empty">No confirmed Philippine households.</td></tr>'}</tbody></table></div>
 <p class="tips">Only confirmed Philippine households appear here. Overseas and unknown-location households are excluded from household gifts; individual cash gifts also require Philippine residence and the age/PWD rules. These are tracking checkboxes, not payment transactions.</p></section>`;
}

span="5" class="empty">No budget items yet.</td></tr>'}</tbody></table></div><div class="minirow"><strong>Total planned</strong><strong>${money(budgetTotal())}</strong></div></div><div class="card"><div class="cardheader"><h3>Family fund ledger</h3><button class="btn tiny" onclick="ledgerForm()">+ Transaction</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Detail</th><th>Type</th><th>Amount</th><th></th></tr></thead><tbody>${t.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.note)}</td><td><span class="pill ${x.kind==='Income'?'':'warn'}">${esc(x.kind)}</span></td><td>${money(x.amount)}</td><td><button class="btn tiny" onclick="ledgerForm('${x.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No transactions recorded.</td></tr>'}</tbody></table></div></div></div>`}
function awards(){let arr=db.awards.filter(a=>a.schoolYear===awardYear);return `${title('Student recognition','Celebrate every milestone—from graduation and honors to creative and non-academic awards.',`<button class="btn primary" onclick="awardForm()">+ Add recognition</button>`)}<div class="toolbar"><input type="text" style="max-width:160px" aria-label="School year" value="${esc(awardYear)}" onchange="awardYear=this.value;render()"><span class="muted">School year</span></div><div class="stats">${stat('Recognition entries',arr.length,'For '+esc(awardYear))}${stat('Unique students',new Set(arr.map(a=>a.personId)).size,'Recognized children')}${stat('Awards budget',money(sum(arr,'amount')),'Approved cash incentives')}${stat('Transferred',money(sum(arr.filter(a=>a.transferred),'amount')),'Marked as disbursed')}</div><div class="card tablewrap"><table><thead><tr><th>Student</th><th>Level</th><th>Recognition</th><th>Award details</th><th>Cash incentive</th><th>Transferred</th><th></th></tr></thead><tbody>${arr.map(a=>`<tr><td><b>${esc(pname(a.personId))}</b></td><td>${esc(a.level||'—')}</td><td>${esc(a.type)}</td><td style="white-space:normal;min-width:170px">${esc(a.details||'—')}</td><td>${money(a.amount)}</td><td><span class="pill ${a.transferred?'':'warn'}">${a.transferred?'Yes':'Pending'}</span></td><td><button class="btn tiny" onclick="awardForm('${a.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No recognition records for this school year.</td></tr>'}</tbody></table></div>`}
function games(){let a=db.games.filter(g=>g.year===year);return `${title('Games & prizes','Collect game ideas, shopping quantities, supplies, prizes, and useful links.',`<button class="btn primary" onclick="gameForm()">+ Add game or prize</button>`)}<div class="toolbar">${yeartool()}</div><div class="stats">${stat('Planned items',a.length,'Games and prizes')}${stat('Games',a.filter(x=>x.type==='Game').length,'Activities')}${stat('Prizes',a.filter(x=>x.type==='Prize').length,'Raffle and game prizes')}${stat('Est. shopping',money(a.reduce((s,x)=>s+Number(x.qty||0)*Number(x.price||0),0)),'Quantity × unit price')}</div><div class="card tablewrap"><table><thead><tr><th>Type</th><th>Item / game</th><th>Qty</th><th>Unit cost</th><th>Details / supplies</th><th>Source</th><th></th></tr></thead><tbody>${a.map(g=>`<tr><td><span class="pill muted">${esc(g.type)}</span></td><td><b>${esc(g.name)}</b></td><td>${g.qty}</td><td>${money(g.price)}</td><td style="white-space:normal;min-width:160px">${esc(g.details||'—')}</td><td>${g.link&&/^https?:\/\//i.test(g.link)?`<a href="${esc(g.link)}" target="_blank" rel="noopener noreferrer">Open ↗</a>`:'—'}</td><td><button class="btn tiny" onclick="gameForm('${g.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Add games, prizes, and shopping plans.</td></tr>'}</tbody></table></div>`}
function data(){return `${title('Data & exports','Your records, under your control. Save a backup and bring in existing family names.') }${cloudPanel()}<div class="grid2"><div class="card"><h3>Backup & restore</h3><p class="muted">A JSON backup preserves people, households, RSVP history, budgets, recognition, dues, and all records.</p><div class="toolbar"><button class="btn primary" onclick="exportJSON()">↓ Download full backup</button><label class="btn" for="jsonfile">↑ Restore JSON</label><input type="file" id="jsonfile" accept=".json,application/json" style="display:none" onchange="importJSON(this.files[0]);this.value=''" /></div><p class="tips">Restoring a backup replaces the current data in this browser. Make a backup first.</p></div><div class="card"><h3>Spreadsheet compatibility</h3><button class="btn primary" style="margin-bottom:12px" onclick="quickNamesForm()">+ Quick add multiple names</button> <p class="muted">Bulk import names from Google Sheets or Excel using CSV. Preview new records and match parents by unique names. Your saved records will not be replaced.</p><div class="toolbar"><button class="btn" onclick="exportCSV()">↓ Export directory CSV</button><button class="btn" onclick="templateCSV()">↓ Download import template</button><label class="btn" for="csvfile">↑ Import directory CSV</label><input type="file" id="csvfile" accept=".csv,text/csv" style="display:none" onchange="importCSV(this.files[0]);this.value=''" /></div><p class="tips">Headers can include Name, First Names, Birth Middle Name, Birth Surname, Current Middle Name, Current Surname, Suffix, Nickname, Birthday, Generation, Household, Parent 1, Parent 2, Spouse, Location, PWD, Deceased. Use YYYY-MM-DD dates. Unmatched family links are flagged for review.</p></div></div><div class="grid2" style="margin-top:16px"><div class="card"><h3>Family rules</h3><p class="muted">These defaults reflect what you described. Edit them if your family changes its rules.</p><form class="formgrid" onsubmit="event.preventDefault();settingsSave(this)"><label>Membership dues / household (₱)<input name="annualDues" type="number" min="0" step=".01" value="${db.settings.annualDues}"></label><label>Child gift / recipient (₱)<input name="childGift" type="number" min="0" step=".01" value="${db.settings.childGift}"></label><label>Maximum child age (inclusive)<input name="childAge" type="number" min="0" max="30" value="${db.settings.childAge}"></label><label>Grocery gift estimate (₱)<input name="groceries" type="number" min="0" value="${db.settings.groceries}"></label><label>Ham gift estimate (₱)<input name="ham" type="number" min="0" value="${db.settings.ham}"></label><div class="full"><button class="btn primary" type="submit">Save family rules</button></div></form></div><div class="card"><h3>Privacy & storage</h3><p class="muted">Your browser keeps a local copy. When you connect and sign in to Firebase, changes are also saved to your private Firestore document. Cloud syncing requires an internet connection and suitable Firebase access rules.</p><div class="boxnote">Family records include birthdays and potentially sensitive PWD information. Do not publish JSON backups, personal information, or authentication credentials in your public GitHub repository. Cloud access is restricted by your Firestore rules, not by hiding the site.</div><button class="btn danger" onclick="clearData()">Clear all browser data</button></div></div>`}
function openModal(html){el('modalbody').innerHTML=html;el('modal').showModal()}function closeModal(){el('modal').close()}function formHeader(h,sub){return `<h2>${h}</h2><p>${sub}</p>`}function buttons(type,id){return `<div class="foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button>${id?`<button type="button" class="btn danger" onclick="removeRecord('${type}','${id}')">Delete</button>`:''}<button class="btn primary" type="submit">Save changes</button></div>`}function record(type,id,form,extra={}){const o=Object.fromEntries(new FormData(form).entries());for(let k of Object.keys(o))if(['amount','qty','price','generation'].includes(k)&&o[k]!=='' )o[k]=Number(o[k]);Object.assign(o,extra);if(id){const i=db[type].findIndex(x=>x.id===id);if(i<0)return;db[type][i]={...db[type][i],...o}}else db[type].push({id:window.crypto?.randomUUID?.()||'r'+Date.now()+Math.random(),...o});closeModal();save();notice('Saved successfully')}function removeRecord(type,i){if(type==='households'){deleteEmptyHousehold(i);return}if(!confirm('Delete this record? This cannot be undone unless you have a backup.'))return;db[type]=db[type].filter(x=>x.id!==i);closeModal();save();notice('Record deleted')}function notice(s){const e=el('toast');e.textContent=s;e.hidden=false;clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>e.hidden=true,3000)}function nameParts(p){return [p.firstNames,p.currentMiddleName||p.birthMiddleName,p.currentSurname||p.birthSurname,p.suffix].map(v=>(v||'').trim()).filter(Boolean).join(' ')}
function birthName(p){return [p.firstNames,p.birthMiddleName,p.birthSurname,p.suffix].map(v=>(v||'').trim()).filter(Boolean).join(' ')}
function displayName(p){return (p.firstNames?nameParts(p):'')||p.name||'Unnamed relative'}
function isStructured(p){return !!(p.firstNames||p.birthMiddleName||p.birthSurname||p.currentMiddleName||p.currentSurname)}
function memberSection(title,subtitle='',open=true){return `<div class="full member-section-title"><strong>${title}</strong>${subtitle?`<small>${subtitle}</small>`:''}</div>`}
function paymentRow(pm={}){let n=Math.random().toString(36).slice(2,10);return `<div class="payment-entry full" data-payment-row="${n}"><div class="payment-head"><b>Bank / e-wallet account</b><button type="button" class="btn tiny danger" onclick="this.closest('.payment-entry').remove()">Remove</button></div><div class="formgrid"><label>Type<select data-pm="type"><option value="Bank" ${pm.type==='Bank'?'selected':''}>Bank account</option><option value="E-wallet" ${pm.type==='E-wallet'?'selected':''}>E-wallet</option></select></label><label>Bank or service name<input data-pm="provider" placeholder="BPI, BDO, GCash, Maya…" value="${esc(pm.provider||'')}"></label><label>Account holder / registered name<input data-pm="holder" value="${esc(pm.holder||'')}"></label><label>Account number or registered mobile<input data-pm="number" value="${esc(pm.number||'')}"></label><div class="full qr-area"><label>Payment QR code (optional)<input type="file" accept="image/png,image/jpeg,image/webp" onchange="setPaymentQr(this)"></label><input type="hidden" data-pm="qr" value="${esc(pm.qr||'')}"><div class="qr-preview">${pm.qr?`<img src="${esc(pm.qr)}" alt="Saved payment QR code">`:'<span class="muted">No QR image attached</span>'}</div><button type="button" class="btn tiny" onclick="clearPaymentQr(this)">Remove QR</button><div class="muted" style="font-size:11px">Stored privately with this family profile. Large images may exceed Firestore limits; this tool compresses the image.</div></div></div></div>`}
function addPaymentRow(){el('paymentRows').insertAdjacentHTML('beforeend',paymentRow())}
function clearPaymentQr(b){let row=b.closest('.payment-entry');row.querySelector('[data-pm="qr"]').value='';row.querySelector('.qr-preview').innerHTML='<span class="muted">No QR image attached</span>';row.querySelector('input[type=file]').value=''}
async function setPaymentQr(input){let file=input.files?.[0];if(!file)return;let row=input.closest('.payment-entry');try{if(file.size>4*1024*1024)throw Error('Please choose an image under 4 MB.');let im=new Image(),objectUrl=URL.createObjectURL(file);try{await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=objectUrl});let canvas=document.createElement('canvas');let scale=Math.min(1,360/Math.max(im.width,im.height));canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);let output=canvas.toDataURL('image/png');if(output.length>65000)throw Error('QR is too detailed for the current small-image limit. Please use a simpler or smaller QR screenshot.');let current=[...document.querySelectorAll('[data-pm="qr"]')].filter(x=>x!==row.querySelector('[data-pm="qr"]')).reduce((n,x)=>n+x.value.length,0);if(current+output.length>450000)throw Error('QR attachment storage limit reached. Contact data can still be saved without another image.');row.querySelector('[data-pm="qr"]').value=output;row.querySelector('.qr-preview').innerHTML='<img alt="Uploaded payment QR preview" src="'+output+'">';}finally{URL.revokeObjectURL(objectUrl)}}catch(e){alert('QR image not attached: '+e.message);input.value=''}}

 const existingKids=db.people.filter(x=>x.parent1===i||x.parent2===i).sort((a,b)=>displayName(a).localeCompare(displayName(b)));
 const relatives=`<label><span>Parent 1</span><select name="parent1">${opts(p.parent1)}</select></label><label><span>Parent 2</span><select name="parent2">${opts(p.parent2)}</select></label><label><span>Relationship to parent(s)</span><select name="parentRelationship">${choose(['Biological child','Adopted child','Foster child','Stepchild','Other / not specified'],p.parentRelationship||'Biological child')}</select></label><div class="full relationship-partners"><div class="relationship-heading"><strong>Spouses & partners</strong><span>Add more than one. Each child can have a different co-parent.</span></div><div id="partnerLinkRows">${[...new Set([...partnerIdsOf(p),linkSpouse].filter(Boolean))].map(pid=>`<div class="partner-link-row"><select class="partner-link-select" aria-label="Linked spouse or partner">${opts(pid)}</select><button type="button" class="btn tiny" onclick="this.closest('.partner-link-row').remove()">Remove</button></div>`).join('')}</div><button type="button" class="btn" onclick="addPartnerLinkRow()">+ Link existing partner</button><button type="button" class="btn" onclick="addPendingPartnerRow()">+ Add new partner</button><div id="newPartnerRows"></div><small>Partner records do not automatically share a household or become parents of every child.</small></div>${p.foundingRole?`<div class="full boxnote">Founding ancestors are not assigned to an administrative household.</div><input type="hidden" name="household" value="">`:`<label><span>Household</span><select name="household">${houseOptions(p.household,'No household assigned')}</select><button type="button" class="btn tiny create-house-btn" onclick="toggleMemberNewHousehold()">+ Create new household</button><div id="newHouseholdFields" class="new-household-fields" hidden><label><span>New household name *</span><input name="newHouseholdName" placeholder="e.g., Mel & Sed"></label><label><span>Country / eligibility *</span><select name="newHouseholdCountry"><option value="">Not confirmed</option><option value="Philippines">Philippines</option><option value="Outside Philippines">Outside Philippines</option></select></label><label><span>City / location (optional)</span><input name="newHouseholdLocation" placeholder="e.g., Pasig"></label><small>Created together with this member when you save. You can edit it later.</small></div></label>`}<label><span>Relationship status</span><select name="relationshipStatus">${choose(['','Single','Married','Partnered','Separated','Divorced','Widowed','Other'],p.relationshipStatus)}</select></label><div class="full relation-children"><div class="relationship-heading"><strong>Children</strong><span>Parent-child links do not set a child's household.</span></div><div id="childLinkRows">${existingKids.map(k=>`<div class="child-link-row"><select class="child-link-select" aria-label="Linked child">${opts(k.id)}</select><select class="child-coparent-select" aria-label="Child's other parent"><option value="">Other parent unchanged</option>${opts(k.parent1===i?k.parent2:k.parent1)}</select><button type="button" class="btn tiny" onclick="this.closest('.child-link-row').remove()">Remove</button></div>`).join('')}</div><button type="button" class="btn" onclick="addChildLinkRow()">+ Link existing child</button><button type="button" class="btn" onclick="addPendingChildRow()">+ Add new child</button><div id="newChildRows"></div><small>Children can belong to their own households, or have no household yet.</small></div>`;

pan><div class="member-aside-note">You can add relatives with just their first name(s). Complete the remaining information whenever you're ready.</div></div></aside></div><footer class="member-editor-footer"><span>Only first name(s) required</span><div class="member-editor-buttons"><button type="button" class="btn" onclick="closeModal()">Cancel</button>${i?`<button type="button" class="btn danger" onclick="removeRecord('people','${i}')">Delete</button>`:''}<button type="submit" class="btn primary">Save family member</button></div></footer></form></div>`;

function reconcileGenerations(){
 const map=new Map(db.people.map(p=>[p.id,p]));let cache=new Map();
 function gen(p,seen=new Set()){
  if(!p)return null;if(p.foundingRole)return 1;
  if(cache.has(p.id))return cache.get(p.id);if(seen.has(p.id))return null;
  const parents=[p.parent1,p.parent2].map(id=>map.get(id)).filter(Boolean);
  if(!parents.length)return Number(p.generation)||null;
  let next=new Set(seen);next.add(p.id);
  let gg=parents.map(x=>gen(x,next)).filter(x=>Number.isFinite(x));
  if(!gg.length)return Number(p.generation)||null;
  if(new Set(gg).size>1){p.generationConflict=true;return Number(p.generation)||null}
  p.generationConflict=false;let v=gg[0]+1;cache.set(p.id,v);return v;
 }
 for(const p of db.people){let v=gen(p);if((p.parent1||p.parent2||p.foundingRole)&&v!=null){if(v!=null)p.generation=v}}
}

 if(newKids.some(k=>!k.firstNames||!k.birthSurname)){alert('Enter first name(s) and surname for each new child.');return}
 if(new Set(linkedChildRows.map(x=>x.id)).size!==linkedChildRows.length){alert('A child is listed more than once.');return}
 o.pwd=f.elements.pwd.checked;o.deceased=f.elements.deceased.checked;o.student=f.elements.student.checked;
 o.paymentMethods=[...f.querySelectorAll('.payment-entry')].map(row=>Object.fromEntries(['type','provider','holder','number','qr'].map(k=>[k,row.querySelector(`[data-pm="${k}"]`)?.value?.trim()||'']))).filter(v=>v.provider||v.number||v.qr);

function splitQuickName(line, commonSurname){
 let value=String(line||'').trim().replace(/\s+/g,' ');
 if(!value)return null;
 let surname=String(commonSurname||'').trim();
 if(value.includes('|')){let parts=value.split('|');value=(parts[0]||'').trim();surname=(parts.slice(1).join('|')||surname).trim();}
 else if(value.includes(',')){let parts=value.split(',');value=(parts.slice(1).join(',')||'').trim();surname=(parts[0]||surname).trim();}
 else if(!surname){let parts=value.split(' ');if(parts.length<2)return {error:'Enter a surname for '+value+' (or use First names | Surname)'};surname=parts.pop();value=parts.join(' ')}
 if(!value||!surname)return {error:'A first name and surname are required: '+line};
 return {firstNames:value,birthSurname:surname,name:value+' '+surname};
}

function csvDateInfo(raw){
 const value=String(raw||'').trim();if(!value)return {iso:'',partial:'',warning:''};
 const mk=(y,m,d)=>{const dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d?`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:''};
 let m=value.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
 if(m){const iso=mk(+m[1],+m[2],+m[3]);return {iso,partial:'',warning:iso?'':'Invalid calendar date: '+value}}
 m=value.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
 if(m){const iso=mk(+m[3],+m[2],+m[1]);return {iso,partial:'',warning:iso?'':'Invalid calendar date: '+value}}
 const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
 m=value.match(/^([a-zA-Z]+)\.?\s+(\d{1,2}),?\s+(\d{2}|\d{4})$/);
 if(m&&months[m[1].toLowerCase().slice(0,3)]){
  let y=Number(m[3]);if(m[3].length===2)y+=y<=26?2000:1900;
  const iso=mk(y,months[m[1].toLowerCase().slice(0,3)],Number(m[2]));
  return {iso,partial:'',warning:iso?'':'Invalid calendar date: '+value};
 }
 m=value.match(/^(\d{4})$/);
 if(m)return {iso:'',partial:value,warning:'Only birth year supplied: '+value+' (birthday left blank)'};
 return {iso:'',partial:value,warning:'Unrecognized date: '+value+' (birthday left blank)'};
}
function csvDate(raw){return csvDateInfo(raw).iso}
async function importCSV(file){if(!file)return;try{
 const rows=parseCSV((await file.text()).replace(/^\ufeff/,''));if(rows.length<2)throw Error('CSV has no records');
 const head=rows.shift().map(x=>x.trim().toLowerCase());
 const idx=n=>head.indexOf(n.toLowerCase());
 const col=(r,...names)=>{for(const n of names){const j=idx(n);if(j>=0)return String(r[j]||'').trim()}return ''};
 if(idx('Name')<0&&idx('First Names')<0&&idx('First Name')<0)throw Error('Missing Name, First Names or First Name header');
 const key=v=>String(v||'').trim().toLocaleLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
 const identity=p=>key([p.firstNames,p.birthMiddleName,p.birthSurname,p.suffix].filter(Boolean).join(' '))||key(p.name);
 const identities=new Set(db.people.map(identity));
 const exactNames=new Set(db.people.map(p=>key(p.name)));
 let candidates=[],duplicates=[],warnings=[],blankRows=0;
 for(const [index,r] of rows.entries()){
  const rowNum=index+2;
  const firstNames=col(r,'First Names','First Name')||col(r,'Name','Full Name');
  const birthMiddleName=col(r,'Birth Middle Name','Middle Name at Birth');
  const birthSurname=col(r,'Birth Surname','Surname','Last Name');
  const currentMiddleName=col(r,'Current Middle Name');
  const currentSurname=col(r,'Current Surname');
  const suffix=col(r,'Suffix');
  const birthOrderRaw=col(r,'Birth Order','BirthOrder');
  const birthOrder=Number(birthOrderRaw);
  const sourceName=col(r,'Name','Full Name');
  if(!firstNames){blankRows++;warnings.push(`Row ${rowNum}: missing name`);continue}
  const fullBirthName=[firstNames,birthMiddleName,birthSurname,suffix].filter(Boolean).join(' ');
  const exactId=key(fullBirthName)||key(sourceName)||key(firstNames);
  // Use the structured name to avoid conflating cousins with the same given names.
  if(identities.has(exactId)||(!birthSurname&&exactNames.has(key(sourceName||firstNames)))){duplicates.push(`Row ${rowNum}: ${fullBirthName}`);continue}
  identities.add(exactId);
  const date=csvDateInfo(col(r,'Birthday','Date of Birth'));
  if(date.warning)warnings.push(`Row ${rowNum} (${firstNames}): ${date.warning}`);
  const deathRaw=col(r,'Deceased');
  const deathYear=/^(18|19|20)\d{2}$/.test(deathRaw)?deathRaw:'';
  if(deathYear)warnings.push(`Row ${rowNum} (${firstNames}): deceased year ${deathYear} recorded, exact death date unknown`);
  const p={id:id(),name:sourceName||fullBirthName,firstNames,birthMiddleName,birthSurname,currentMiddleName,currentSurname,suffix,
    nickname:col(r,'Nickname'),birthOrder:Number.isInteger(birthOrder)&&birthOrder>0?birthOrder:'',dob:date.iso,location:col(r,'Location'),generation:Number(col(r,'Generation'))||'',
    _household:col(r,'Household'),_parent1:col(r,'Parent 1','Father'),_parent2:col(r,'Parent 2','Mother'),_spouse:col(r,'Spouse','Spouse / Partner'),
    pwd:/^(yes|true|1)$/i.test(col(r,'PWD')),deceased:!!deathYear||/^(yes|true|1)$/i.test(deathRaw)};
  if(date.partial)p.birthDateOriginal=date.partial;
  if(deathYear)p.deathYear=deathYear;
  candidates.push(p);
 }
 const preview=`CSV rows: ${rows.length}\nNew people to add: ${candidates.length}\nExisting / repeated names skipped: ${duplicates.length}\nRows without a name: ${blankRows}\nDate or data warnings (people retained): ${warnings.length}\n\n${warnings.length?'Examples to review:\n'+warnings.slice(0,8).join('\n')+(warnings.length>8?'\n...and '+(warnings.length-8)+' more':'')+'\n\n':''}No family member will be omitted solely because their birthday is missing or unclear.\n\nImport these ${candidates.length} people?`;
 if(!candidates.length){alert(preview);return}if(!confirm(preview))return;
 const all=db.people.concat(candidates),unresolved=[];
 const resolve=(v,person,kind)=>{
  if(!v)return '';
  const matches=all.filter(p=>[p.name,p.firstNames,p.nickname,displayName(p),birthName(p)].some(x=>key(x)===key(v)));
  const unique=[...new Set(matches.map(p=>p.id))];
  if(unique.length===1&&unique[0]!==person.id)return unique[0];
  unresolved.push(`${displayName(person)}: ${kind} "${v}" (${unique.length?'ambiguous':'not found'})`);return '';
 };
 for(const person of candidates){
  if(person._household){let h=db.households.find(x=>key(x.name)===key(person._household));if(!h){h={id:id(),name:person._household,gift:'Undecided'};db.households.push(h)}person.household=h.id}
  person.parent1=resolve(person._parent1,person,'Parent 1');person.parent2=resolve(person._parent2,person,'Parent 2');person.spouse=resolve(person._spouse,person,'Spouse');
  delete person._household;delete person._parent1;delete person._parent2;delete person._spouse;
 }
 db.people.push(...candidates);save();
 alert(`Added ${candidates.length} family members.\nSkipped ${duplicates.length} repeated names and ${blankRows} nameless rows.\nDate/data warnings: ${warnings.length} (no members discarded for date problems).\nUnresolved parent/spouse links: ${unresolved.length}.\n\nDownload a JSON backup and review your records.`);
 if(warnings.length||unresolved.length)console.warn('TorresFam import review:',{warnings,unresolved,duplicates});
 }catch(e){alert('Could not import CSV: '+e.message)}
}

async function cloudPushConfirm(){if(!fbUser)return;if(!confirm('Overwrite the Firebase snapshot using records currently in this browser? Download a backup first.'))return;cloudReady=true;queueCloudSave()}
function queueCloudSave(){if(!cloudReady||!fbUser)return;const uid=fbUser.uid,payload=JSON.parse(JSON.stringify(db)),version=++cloudRevision;setCloudState('Saving…');cloudWriteQueue=cloudWriteQueue.catch(()=>{}).then(async()=>{if(!fbUser||fbUser.uid!==uid||!cloudReady)return;try{await cloudDoc().set({payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),schemaVersion:4});if(version===cloudRevision){setCloudState('Cloud saved');notice('✓ Saved to cloud successfully')}}catch(e){cloudError=e.message;setCloudState('Cloud save failed');alert('Cloud save failed. Your browser still has a local copy; export a JSON backup. '+e.message)}})}
function initCloud(){if(typeof firebase==='undefined'){authPending=false;cloudError='Firebase SDK could not load. Check internet connection and refresh.';setCloudState('Offline');render();return}try{fbApp=firebase.apps.find(a=>a.name==='torresFamily')||firebase.initializeApp(FIREBASE_CONFIG,'torresFamily');fbAuth=fbApp.auth();fbStore=fbApp.firestore();fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);fbAuth.onAuthStateChanged(async user=>{fbUser=user;cloudReady=false;authPending=false;cloudError='';if(!user){db=initial();setCloudState('Sign in');render();return}await syncOnLogin(user)},e=>{authPending=false;cloudError=e.message;setCloudState('Authentication failed');render()});}catch(e){authPending=false;cloudError=e.message;setCloudState('Firebase initialization failed');render()}}
window.addEventListener('load',initCloud);

render();
</script></body></html>
