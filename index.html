/* Build 7: adaptive layout, accessible household overview */

  if(!spouses.length&&person.foundingRole==='patriarch'&&founderMatches().mother)spouses=[founderMatches().mother];
  for(const sp of spouses)if(!visited.has(sp.id))visited.add(sp.id);
  let kids=db.people.filter(p=>!visited.has(p.id)&&(p.parent1===person.id||p.parent2===person.id)).sort((a,b)=>(a.dob||'9999').localeCompare(b.dob||'9999')||displayName(a).localeCompare(displayName(b)));

function treeMarkup(){

    <text x="${x+46}" y="${n.y+25}" class="gene-name">${esc(short)}</text><text x="${x+11}" y="${n.y+51}" class="gene-sub">${esc((p.nickname|| (p.dob?'Born '+String(p.dob).slice(0,4):'Birthday not recorded')+(p.deceased?' · In memoriam':'')).slice(0,32))}</text>

  n.children.forEach(draw);

}
function tree(){const f=treeDescendants();let unlinked=db.people.filter(p=>!f.visited.has(p.id));let actual=f.visited.size;
 return `${title('Family tree','A real, connected genealogy. Parent–child relationships determine the branches.')}<div class="tree-toolbar"><div class="tree-view-switch"><button class="btn primary" aria-current="page">Connected tree</button><button class="btn" onclick="treeShowUnlinked=!treeShowUnlinked;render()">Unlinked relatives (${unlinked.length}) ${treeShowUnlinked?'▴':'▾'}</button></div><div class="tree-controls"><input id="treeSearch" list="treePersons" placeholder="Find family member..." aria-label="Find family member"><datalist id="treePersons">${db.people.map(p=>`<option value="${esc(displayName(p))}"></option>`).join('')}</datalist><button class="btn" onclick="treeFind()">Find</button><button class="btn" onclick="treeZoom(.8)" aria-label="Zoom out">−</button><button class="btn" onclick="treeZoom(1.25)" aria-label="Zoom in">+</button><button class="btn" onclick="treeFit()">Fit</button><button class="btn" onclick="treeExpandAll()">Expand all</button><button class="btn" onclick="treeExportSVG()">↓ SVG</button><button class="btn" onclick="treePrint()">Print / PDF</button></div></div><p class="tree-hint">Drag to pan · scroll horizontally · use +/− to zoom · click a member to edit · use the circle below a branch to expand/collapse. Spouses are shown alongside descendants.</p>${treeMarkup()}<p class="tree-hint">${actual} linked relative${actual===1?'':'s'} shown · ${unlinked.length} awaiting parent links. The complete tree depends on confirmed parent connections.</p>${treeShowUnlinked?`<section class="card"><div class="cardheader"><h3>Relatives awaiting tree connections</h3><span class="muted">These records are saved; no relationships have been invented.</span></div><div class="unlinked-list">${unlinked.map(p=>`<button class="btn" onclick="personForm('${p.id}')">${esc(displayName(p))} <small>· Generation ${esc(p.generation||'?')}</small> ↗</button>`).join('')||'<p>All relatives are connected.</p>'}</div></section>`:''}`

const AWARD_BASE={graduated:1000,completed:500,moved:0,deans:1000,none:0};
const AWARD_CAP={graduated:2250,completed:1750,moved:1250,deans:1000,none:0};

function recognitionAmount(flags){
 const f=awardFlags(flags);
 const components=[{label:AWARD_LABEL[f.milestone],amount:AWARD_BASE[f.milestone]||0}];
 if(f.honors)components.push({label:'With Honors',amount:500});
 if(f.academic)components.push({label:'Academic award',amount:500});
 if(f.nonAcademic)components.push({label:'Non-academic award',amount:250});
 const special=[['Neurodiverse grandchild',f.neuro],['Postgraduate achievement',f.postgrad],['Represented school / country',f.representative]];
 const base=components.reduce((a,x)=>a+x.amount,0);
 const capped=Math.min(base,AWARD_CAP[f.milestone]||0);
 const specials=special.filter(x=>x[1]).map(x=>({label:x[0],amount:500}));
 // All three special awards are separate recognitions; neurodiverse support is once per school year.
 return {amount:capped+specials.reduce((a,x)=>a+x.amount,0),base:capped,cap:AWARD_CAP[f.milestone],components:[...components,...specials],capped:base>capped};
}

function openModal(html){el('modalbody').innerHTML=html;el('modal').showModal()}function closeModal(){el('modal').close()}function formHeader(h,sub){return `<h2>${h}</h2><p>${sub}</p>`}function buttons(type,id){return `<div class="foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button>${id?`<button type="button" class="btn danger" onclick="removeRecord('${type}','${id}')">Delete</button>`:''}<button class="btn primary" type="submit">Save changes</button></div>`}function record(type,id,form,extra={}){const o=Object.fromEntries(new FormData(form).entries());for(let k of Object.keys(o))if(['amount','qty','price','generation'].includes(k)&&o[k]!=='' )o[k]=Number(o[k]);Object.assign(o,extra);if(id){const i=db[type].findIndex(x=>x.id===id);if(i<0)return;db[type][i]={...db[type][i],...o}}else db[type].push({id:window.crypto?.randomUUID?.()||'r'+Date.now()+Math.random(),...o});closeModal();save();notice('Saved successfully')}function removeRecord(type,i){if(type==='households'){deleteEmptyHousehold(i);return}if(!confirm('Delete this record? This cannot be undone unless you have a backup.'))return;db[type]=db[type].filter(x=>x.id!==i);closeModal();save();notice('Record deleted')}function notice(s){const e=el('toast');e.textContent=s;e.hidden=false;clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>e.hidden=true,3000)}function nameParts(p){return [p.firstNames,p.currentMiddleName||p.birthMiddleName,p.currentSurname||p.birthSurname,p.suffix].map(v=>(v||'').trim()).filter(Boolean).join(' ')}

async function setPaymentQr(input){let file=input.files?.[0];if(!file)return;let row=input.closest('.payment-entry');try{if(file.size>4*1024*1024)throw Error('Please choose an image under 4 MB.');let im=new Image(),objectUrl=URL.createObjectURL(file);try{await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=objectUrl});let canvas=document.createElement('canvas');let scale=Math.min(1,360/Math.max(im.width,im.height));canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);let output=canvas.toDataURL('image/png');if(output.length>65000)throw Error('QR is too detailed for the current small-image limit. Please use a simpler or smaller QR screenshot.');let current=[...document.querySelectorAll('[data-pm="qr"]')].filter(x=>x!==row.querySelector('[data-pm="qr"]')).reduce((n,x)=>n+x.value.length,0);if(current+output.length>450000)throw Error('QR attachment storage limit reached. Contact data can still be saved without another image.');row.querySelector('[data-pm="qr"]').value=output;row.querySelector('.qr-preview').innerHTML='<img alt="Uploaded payment QR preview" src="'+output+'">';}finally{URL.revokeObjectURL(objectUrl)}}catch(e){alert('QR image not attached: '+e.message);input.value=''}}
// Parent 1 represents the Torres ancestral line; Parent 2 is a different-gender co-parent.
// Older imported members with an explicit generation but incomplete links remain selectable
// for genealogy reconciliation. No unknown gender is inferred.
function torresLineCandidate(p){
 if(!p||!p.id)return false;
 if(p.foundingRole)return /patriarch/i.test(String(p.foundingRole));
 const seen=new Set(),queue=[p];
 while(queue.length){const cur=queue.shift();if(!cur||seen.has(cur.id))continue;seen.add(cur.id);
  for(const pid of [cur.parent1,cur.parent2]){const parent=db.people.find(x=>x.id===pid);if(!parent)continue;
   if(parent.foundingRole&&/patriarch/i.test(String(parent.foundingRole)))return true;
   queue.push(parent);
  }
 }
 // Imported Torres descendants can have missing links; allow their recorded generation as provisional.
 return Number(p.generation)>=2&&!p.foundingRole;
}
function parentOptionMarkup(selected='',kind='first',personId=''){
 const people=db.people.filter(x=>x.id!==personId && (kind!=='first'||torresLineCandidate(x)||x.id===selected))
 .sort((a,b)=>displayName(a).localeCompare(displayName(b),undefined,{sensitivity:'base',numeric:true}));
 return '<option value="">Not linked</option>'+people.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(displayName(x))}${kind==='first'&&!torresLineCandidate(x)?' (existing link)':''}</option>`).join('');
}
function updateSecondParentChoices(){
 const form=document.querySelector('.member-editor form');if(!form)return;
 const p1=form.elements.parent1,p2=form.elements.parent2,hint=document.getElementById('parentPairHint');if(!p1||!p2)return;
 const first=db.people.find(p=>p.id===p1.value),previous=p2.value;
 const opposite=first?.gender==='Male'?'Female':first?.gender==='Female'?'Male':'';
 const candidates=opposite?db.people.filter(p=>p.id!==p1.value&&p.gender===opposite):[];
 candidates.sort((a,b)=>displayName(a).localeCompare(displayName(b),undefined,{sensitivity:'base',numeric:true}));
 p2.innerHTML='<option value="">Not linked</option>'+candidates.map(p=>`<option value="${esc(p.id)}">${esc(displayName(p))}</option>`).join('');
 if(candidates.some(p=>p.id===previous))p2.value=previous;
 if(hint){hint.textContent=!first?'Select Parent 1 to filter Parent 2.':!opposite?'Set Parent 1’s gender to Male or Female in their profile before selecting Parent 2.':`Showing ${opposite.toLowerCase()} family members only for Parent 2.`;}
}
function validateParentPair(form,personId=''){
 const p1id=form.elements.parent1?.value||'',p2id=form.elements.parent2?.value||'';
 if(!p1id&&!p2id)return true;
 if(p2id&&!p1id){alert('Select Parent 1 (the Torres descendant) before assigning Parent 2.');return false;}
 const p1=db.people.find(p=>p.id===p1id);
 if(p1id===personId||p2id===personId||p1id===p2id&&p1id){alert('A family member cannot be their own parent, and parents must be different people.');return false;}
 if(p1&&!torresLineCandidate(p1)){alert('Parent 1 must be on the Torres descendant line. Please verify their ancestry or generation first.');return false;}
 if(p2id){const p2=db.people.find(p=>p.id===p2id);
  if(!p1||!p2||!['Male','Female'].includes(p1.gender)||!['Male','Female'].includes(p2.gender)){alert('Set both parents’ genders to Male or Female before linking them together.');return false;}
  if(p1.gender===p2.gender){alert('Parent 1 and Parent 2 must have different genders under the Torres family rule.');return false;}
 }
 return true;
}

function reconcileGenerations(){
 const map=new Map(db.people.map(p=>[p.id,p]));let cache=new Map();
 function gen(p,seen=new Set()){
  if(!p)return null;if(p.foundingRole)return 1;
  if(cache.has(p.id))return cache.get(p.id);if(seen.has(p.id))return null;
  const parents=[p.parent1,p.parent2].map(id=>map.get(id)).filter(Boolean);
  if(!parents.length)return Number(p.generation)||null;
  let next=new Set(seen);next.add(p.id);
  let gg=parents.map(x=>gen(x,next)).filter(x=>Number.isFinite(x));
  if(!gg.length)return Number(p.generation)||null;
  if(new Set(gg).size>1){p.generationConflict=true;return Number(p.generation)||null}
  p.generationConflict=false;let v=gg[0]+1;cache.set(p.id,v);return v;
 }
 for(const p of db.people){let v=gen(p);if((p.parent1||p.parent2||p.foundingRole)&&v!=null){if(v!=null)p.generation=v}}
}

async function handleMemberPhoto(input){const file=input.files?.[0];if(!file)return;if(file.size>8*1024*1024){alert('Please select a photo under 8 MB.');return}try{const img=new Image(),url=URL.createObjectURL(file);await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const c=document.createElement('canvas'),scale=Math.min(1,240/img.width,240/img.height);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);let encoded=c.toDataURL('image/jpeg',.68);if(encoded.length>40000){alert('This photo is too large after compression. Please choose a smaller image.');return}const form=document.querySelector('.member-editor form');form.elements.photo.value=encoded;document.getElementById('memberAvatar').innerHTML='<img src="'+encoded+'" alt="Member portrait">'}catch(e){alert('Could not read that image.')}}

function openBulkEdit(){let people=[...selectedMemberIds].filter(i=>db.people.some(p=>p.id===i));if(!people.length){alert('Select family members using the checkboxes in the directory first.');return}openModal(`<div class="bulk-editor"><h2>Bulk edit ${people.length} family members</h2><p>Only the fields you enable will be changed. Names, birthdays, links and financial details stay untouched.</p><form onsubmit="event.preventDefault();applyBulkEdit(this)"><div class="bulk-field"><label><input type="checkbox" name="useLocation"> Change city/location</label><input name="location" placeholder="City"></div><div class="bulk-field"><label><input type="checkbox" name="useCountry"> Change country</label><input name="country" placeholder="e.g., Philippines"></div><div class="bulk-field"><label><input type="checkbox" name="useHousehold"> Change household</label><select name="household">${houseOptions('','No household')}</select></div><div class="bulk-field"><label><input type="checkbox" name="useStudent"> Change student status</label><select name="student"><option value="true">Student</option><option value="false">Not a student</option></select></div><div class="bulk-field"><label><input type="checkbox" name="usePwd"> Change PWD eligibility (private)</label><select name="pwd"><option value="true">Eligible</option><option value="false">Not eligible</option></select></div><div class="member-editor-buttons"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Apply to ${people.length} members</button></div></form></div>`)}
function applyBulkEdit(form){const d=Object.fromEntries(new FormData(form).entries());const ids=[...selectedMemberIds],changes={};if(d.useLocation)changes.location=d.location.trim();if(d.useCountry)changes.country=d.country.trim();if(d.useHousehold)changes.household=d.household;if(d.useStudent)changes.student=d.student==='true';if(d.usePwd)changes.pwd=d.pwd==='true';if(!Object.keys(changes).length){alert('Select at least one field to edit.');return}if(!confirm('Apply selected changes to '+ids.length+' members?'))return;for(const p of db.people){if(!selectedMemberIds.has(p.id))continue;normalizeMemberLocation(p);Object.assign(p,changes);normalizeMemberLocation(p);if(p.foundingRole)p.household=''}selectedMemberIds.clear();closeModal();save();notice('Bulk changes saved')}
function suggestMarriedMiddleName(){const f=document.querySelector('.member-editor form');if(!f)return;const birth=f.elements.birthSurname?.value?.trim()||'';if(!birth){notice('Enter the birth surname first');return}if(f.elements.currentMiddleName.value.trim()){notice('Current legal middle name already entered; unchanged');return}f.elements.currentMiddleName.value=birth;f.elements.currentMiddleName.dispatchEvent(new Event('input',{bubbles:true}));notice('Suggested middle name filled. Please verify against legal records.')}

function personSave(i,f){
 if(!validateParentPair(f,i))return;
 const o=Object.fromEntries(new FormData(f).entries());
 // Keep legacy country values if the user edits other fields without changing location.
 normalizeMemberLocation(o);
 for(const k of ['firstNames','birthMiddleName','birthSurname','currentMiddleName','currentSurname','suffix'])o[k]=(o[k]||'').trim();
  o.birthOrder=o.birthOrder?Number(o.birthOrder):'';
  o.birthYear=o.dob?Number(o.dob.slice(0,4)):(o.birthYear?Number(o.birthYear):'');
  if(o.birthYear&&(!Number.isInteger(o.birthYear)||o.birthYear<1850||o.birthYear>2100)){alert('Enter a valid four-digit birth year.');return}
  if(o.birthOrder&&(!Number.isInteger(o.birthOrder)||o.birthOrder<1)){alert('Birth order must be a positive whole number.');return}
 const existing=db.people.find(p=>p.id===i);
  const newHouseSection=f.querySelector('#newHouseholdFields');
  const newHouseOpen=!!newHouseSection&&!newHouseSection.hidden;
  const newHouseName=(o.newHouseholdName||'').trim();
  let newHouse=null;
  if(newHouseOpen){
    if(existing?.foundingRole){alert('Founders cannot belong to a household.');return}
    if(!newHouseName){alert('Enter a household name or close the Create household section.');return}
    if(db.households.some(h=>h.name.trim().toLowerCase()===newHouseName.toLowerCase())){alert('That household already exists. Select it from the Household dropdown instead.');return}
    newHouse={id:id(),name:newHouseName,country:o.newHouseholdCountry||'',location:(o.newHouseholdLocation||'').trim(),gift:'Undecided',notes:''};
    o.household=newHouse.id;
  }
  delete o.newHouseholdName;delete o.newHouseholdCountry;delete o.newHouseholdLocation;
 if(!o.firstNames&&!existing?.name){alert('Please enter first name(s).');return}
 const linkedPartners=[...new Set([...f.querySelectorAll('.partner-link-select')].map(x=>x.value).filter(Boolean))];
 const newPartners=[...f.querySelectorAll('.new-partner-row')].map(row=>({firstNames:row.querySelector('[data-partner-first]')?.value.trim(),birthSurname:row.querySelector('[data-partner-surname]')?.value.trim()})).filter(p=>p.firstNames||p.birthSurname);
 if(newPartners.some(p=>!p.firstNames||!p.birthSurname)){alert('Enter both first name(s) and surname for each new partner.');return}
 const linkedChildRows=[...f.querySelectorAll('.child-link-row')].map(row=>({id:row.querySelector('.child-link-select')?.value,coParent:row.querySelector('.child-coparent-select')?.value})).filter(x=>x.id);
 const newKids=[...f.querySelectorAll('.new-child-row')].map(row=>({firstNames:row.querySelector('[data-new-child-first]')?.value?.trim(),birthSurname:row.querySelector('[data-new-child-surname]')?.value?.trim(),coParent:row.querySelector('.new-child-coparent')?.value||''})).filter(k=>k.firstNames||k.birthSurname);
 if(newKids.some(k=>!k.firstNames||!k.birthSurname)){alert('Enter first name(s) and surname for each new child.');return}
 if(new Set(linkedChildRows.map(x=>x.id)).size!==linkedChildRows.length){alert('A child is listed more than once.');return}
 o.pwd=f.elements.pwd.checked;o.deceased=f.elements.deceased.checked;o.student=f.elements.student.checked;
 o.paymentMethods=[...f.querySelectorAll('.payment-entry')].map(row=>Object.fromEntries(['type','provider','holder','number','qr'].map(k=>[k,row.querySelector(`[data-pm="${k}"]`)?.value?.trim()||'']))).filter(v=>v.provider||v.number||v.qr);
 if(existing?.foundingRole)o.household='';
 if(o.firstNames)o.name=displayName(o);else if(existing)o.name=existing.name;
 delete o.spouse;delete o.pendingSpouseFirst;delete o.pendingSpouseSurname;
 const personId=i||id();
 const oldPartnerIds=new Set(existing?partnerIdsOf(existing):[]);
 const newPartnerRecords=newPartners.map(np=>({id:id(),...np,name:np.firstNames+' '+np.birthSurname,partnerIds:[personId],spouse:'',household:'',generation:o.generation||''}));
 o.partnerIds=[...new Set([...linkedPartners,...newPartnerRecords.map(p=>p.id)])].filter(pid=>pid!==personId);
 o.spouse=o.partnerIds[0]||''; // legacy single-partner compatibility; the full list is partnerIds
 const candidate={...existing,...o,id:personId};
 const check={...db,households:newHouse?[...db.households,newHouse]:db.households,people:[...db.people.filter(p=>p.id!==personId),candidate,...newPartnerRecords]};
 if(JSON.stringify(check).length>750000){alert('This database is approaching Firestore’s document size limit. Please reduce embedded QR or portrait images before saving.');return}
 if(newHouse)db.households.push(newHouse);
  if(i){const k=db.people.findIndex(p=>p.id===i);if(k<0)return;db.people[k]={...db.people[k],...o}}
 else db.people.push(candidate);
 db.people.push(...newPartnerRecords);
 // Sync both sides while preserving unrelated relationships; unlink deleted partners on both sides.
 for(const oldId of oldPartnerIds){if(o.partnerIds.includes(oldId))continue;const partner=db.people.find(p=>p.id===oldId);if(!partner)continue;partner.partnerIds=(Array.isArray(partner.partnerIds)?partner.partnerIds:[partner.spouse].filter(Boolean)).filter(x=>x!==personId);if(partner.spouse===personId)partner.spouse=partner.partnerIds[0]||''}
 for(const partnerId of o.partnerIds){const partner=db.people.find(p=>p.id===partnerId);if(!partner)continue;partner.partnerIds=[...new Set([...(Array.isArray(partner.partnerIds)?partner.partnerIds:[partner.spouse].filter(Boolean)),personId])];if(!partner.spouse)partner.spouse=personId}
 for(const {id:kidId,coParent} of linkedChildRows){const child=db.people.find(p=>p.id===kidId);if(!child||kidId===personId)continue;
  if(child.parent1!==personId&&child.parent2!==personId){if(!child.parent1)child.parent1=personId;else if(!child.parent2)child.parent2=personId;else{alert('Child '+displayName(child)+' already has two parents; review their record.');continue}}
  if(coParent&&coParent!==personId){if(child.parent1===coParent||child.parent2===coParent)continue;if(!child.parent1)child.parent1=coParent;else if(!child.parent2)child.parent2=coParent;else alert('Both parent positions are already used for '+displayName(child)+'. No co-parent was changed.')}
 }
 for(const kid of newKids)db.people.push({id:id(),firstNames:kid.firstNames,birthSurname:kid.birthSurname,name:kid.firstNames+' '+kid.birthSurname,parent1:personId,parent2:kid.coParent&&kid.coParent!==personId?kid.coParent:'',household:'',generation:o.generation?Number(o.generation)+1:''});
 reconcileGenerations();closeModal();save();notice('Saving family member to cloud…');
}
function houseForm(i=''){let h=db.households.find(x=>x.id===i)||{};openModal(`${formHeader(i?'Edit household':'Add household','Family units are used for dues, groceries, and cash gift distribution.')}<form onsubmit="event.preventDefault();record('households','${i}',this)"><div class="formgrid"><label class="full">Household / family name *<input name="name" required value="${esc(h.name||'')}"></label><label>Gift preference<select name="gift">${['Grocery','Cash','Undecided','None'].map(x=>`<option ${h.gift===x?'selected':''}>${x}</option>`).join('')}</select></label><label>City / location (optional)<input name="location" value="${esc(h.location||'')}" placeholder="e.g. Pasig City"></label><label>Country / eligibility *<select name="country">${[['','Not confirmed — exclude from gifts / dues'],['Philippines','Philippines'],['Outside Philippines','Outside Philippines']].map(([val,label])=>`<option value="${val}" ${String(h.country||(!h.country&&countryClass(h.location)==='PH'?'Philippines':!h.country&&countryClass(h.location)==='abroad'?'Outside Philippines':''))===val?'selected':''}>${label}</option>`).join('')}</select></label><label class="full">Notes<textarea name="notes" rows="2">${esc(h.notes||'')}</textarea></label></div>${buttons('households',i)}</form>`)}function dueForm(h){if(!isPHHousehold(db.households.find(x=>x.id===h)||{})){alert('Membership is required only for confirmed Philippine households. Confirm the household country first.');return}openModal(`${formHeader('Record membership payment',esc(hname(h))+' · '+year)}<form onsubmit="event.preventDefault();record('dues','',this,{householdId:'${h}',year})"><div class="formgrid"><label>Amount paid (₱)<input type="number" step=".01" min="0" required name="amount" value="${db.settings.annualDues-paid(h)}"></label><label>Date paid<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="full">Notes<input name="notes" placeholder="GCash, cash, bank transfer, etc."></label></div>${buttons('dues','')}</form>`)}function rsvpForm(i=''){let r=db.rsvps.find(x=>x.id===i)||{};openModal(`${formHeader(i?'Edit RSVP':'Record RSVP','Attendance for Torres Family Day '+year)}<form onsubmit="event.preventDefault();saveEventRSVP('${i}',this)"><div class="formgrid"><label>Family member *<select name="personId" required><option value="">Select living family member</option>${db.people.filter(eventLocalMember).sort((a,b)=>displayName(a).localeCompare(displayName(b))).map(p=>`<option value="${esc(p.id)}" ${r.personId===p.id?'selected':''}>${esc(displayName(p))}</option>`).join('')}</select></label><label>Status<select name="status">${['Attending','Maybe','Not attending'].map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="full">Notes<input name="notes" value="${esc(r.notes||'')}" placeholder="Guest, special arrangements, etc."></label></div>${buttons('rsvps',i)}</form>`)}function saveEventRSVP(i,form){const vals=Object.fromEntries(new FormData(form).entries());if(!db.people.some(p=>p.id===vals.personId&&eventLocalMember(p))){alert('Select a living family member. Deceased relatives cannot be added to Family Day activities.');return;}const existing=db.rsvps.find(r=>r.id===i)||eventRecord(vals.personId);if(existing){existing.personId=vals.personId;existing.status=vals.status;existing.notes=vals.notes||''}else db.rsvps.push({id:id(),year,personId:vals.personId,status:vals.status,notes:vals.notes||''});closeModal();save();notice('RSVP updated')}function budgetForm(i=''){let b=db.budgets.find(x=>x.id===i)||{};openModal(`${formHeader(i?'Edit budget item':'New budget item','Plan Family Day '+year+' expenses.')}<form onsubmit="event.preventDefault();budgetSave('${i}',this)"><div class="formgrid"><label class="full">Budget item *<input required name="name" value="${esc(b.name||'')}" placeholder="Venue, grocery packs, cash gifts, games..."></label><label>Quantity<input name="qty" min="0" type="number" value="${b.qty??1}"></label><label>Unit cost (₱)<input name="price" step=".01" type="number" min="0" value="${b.price??0}"></label><label class="full">Notes<input name="notes" value="${esc(b.notes||'')}"></label></div>${buttons('budgets',i)}</form>`)}function budgetSave(i,f){let o=Object.fromEntries(new FormData(f).entries());o.qty=Number(o.qty);o.price=Number(o.price);record('budgets',i,f,{year,total:o.qty*o.price})}function ledgerForm(i=''){let x=db.ledger.find(x=>x.id===i)||{};openModal(`${formHeader(i?'Edit transaction':'Record transaction','Keep a running balance of the family fund.')}<form onsubmit="event.preventDefault();record('ledger','${i}',this,{year})"><div class="formgrid"><label>Date<input type="date" required name="date" value="${esc(x.date||new Date().toISOString().slice(0,10))}"></label><label>Type<select name="kind"><option ${x.kind==='Income'?'selected':''}>Income</option><option ${x.kind==='Expense'?'selected':''}>Expense</option></select></label><label class="full">Description *<input required name="note" value="${esc(x.note||'')}"></label><label>Amount (₱)<input required name="amount" type="number" min="0" step=".01" value="${x.amount??''}"></label><label>Paid by / received from<input name="source" value="${esc(x.source||'')}"></label></div>${buttons('ledger',i)}</form>`)}function awardForm(i=''){
 let a=db.awards.find(x=>x.id===i)||{},legacy=i&&!a.awardSchema,flags=awardFlags(a);
 const legacyNote=legacy?`<div class="award-legacy-note">This is an older award record. Its recorded cash amount will be preserved unless you choose to convert it to the automatic award calculator.</div>`:'';
 const select=(name,options,value)=>`<select name="${name}" onchange="awardLivePreview(this.form)">${options.map(([v,l])=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
 const check=(name,label,hint='')=>`<label class="award-check"><input type="checkbox" name="${name}" ${flags[name]?'checked':''} onchange="awardLivePreview(this.form)"><span><b>${label}</b>${hint?`<small>${hint}</small>`:''}</span></label>`;
 const studentOptions=[...db.people].filter(p=>!p.deceased&&p.student).sort((p,q)=>(p.nickname||displayName(p)).localeCompare(q.nickname||displayName(q),undefined,{sensitivity:'base',numeric:true})||displayName(p).localeCompare(displayName(q),undefined,{sensitivity:'base'})).map(p=>`<option value="${esc(p.id)}" ${a.personId===p.id?'selected':''}>${esc(p.nickname?`${p.nickname} — ${displayName(p)}`:displayName(p))}</option>`).join('');
 openModal(`<div class="award-form-head"><h2>${i?'Edit student recognition':'Add student recognition'}</h2><p>Only living family members marked Student in their profile can be selected. Names are alphabetical.</p></div>${legacyNote}${i&&a.personId&&!db.people.some(p=>p.id===a.personId&&p.student)?'<div class="boxnote">This existing awardee is not currently marked Student. Their historical award stays saved; mark them as Student in their family profile before editing or re-saving this award.</div>':''}
 <form id="awardEditor" onsubmit="event.preventDefault();awardSave('${esc(i)}',this)">
 <div class="award-form-section"><h3>01 · Student and school year</h3><div class="formgrid"><label>Student *<select name="personId" required><option value="">Choose student</option>${studentOptions}</select></label><label>School year *<input name="schoolYear" required pattern="[0-9]{4}-[0-9]{4}" placeholder="2025-2026" value="${esc(a.schoolYear||awardYear)}"></label><label class="full">School level / grade<input name="level" value="${esc(a.level||'')}" placeholder="e.g. Grade 6, Kinder, College, SPED"></label></div></div>
 <div class="award-form-section"><h3>02 · Milestone</h3><label class="award-milestone-label">School achievement ${select('milestone',Object.entries(AWARD_LABEL),flags.milestone)}</label><p class="muted">Graduated, completed Grade 10, moved up, Dean’s List, or special award only.</p></div>
 <div class="award-form-section"><h3>03 · Additional awards</h3><div class="award-checkbox-grid">${check('honors','With Honors','+₱500')}${check('academic','Academic award','+₱500')}${check('nonAcademic','Non-academic award','+₱250')}${check('neuro','Neurodiverse grandchild','Special award +₱500 per school year')}${check('postgrad','Postgraduate achievement','Special award +₱500')}${check('representative','Represented school or country','Special award +₱500')}</div></div>
 <div class="award-form-section"><h3>04 · Achievement details</h3><label>Names of honors, awards, certificates, accomplishments<textarea name="details" rows="4" placeholder="With Honors&#10;Best in Word Building&#10;Cheer Dance Competition Champion">${esc(a.details||'')}</textarea></label><label>Remarks<input name="notes" value="${esc(a.notes||'')}" placeholder="Optional notes about this recognition"></label></div>
 <div class="award-form-section award-payout"><h3>05 · Cash award & payment</h3><div class="award-prize-preview"><div><small>Calculated award</small><strong id="awardCalculated">₱0.00</strong></div><div id="awardBreakdown" class="muted">Choose a milestone and awards.</div></div>
 <label class="award-check"><input name="manualOverride" type="checkbox" ${legacy||a.manualOverride?'checked':''} onchange="awardLivePreview(this.form)"><span><b>Use a manually approved amount</b><small>For historical records or authorized exceptions only</small></span></label><div id="awardManualFields" style="display:${legacy||a.manualOverride?'block':'none'}"><div class="formgrid"><label>Approved amount (₱)<input name="approvedAmount" type="number" min="0" step=".01" value="${Number(a.amount||0)}"></label><label>Reason / approval notes<input name="overrideReason" value="${esc(a.overrideReason||'')}" placeholder="Required when overriding calculated amount"></label></div></div>
 <label class="award-check"><input name="transferred" type="checkbox" ${a.transferred?'checked':''}><span><b>Cash prize transferred / paid</b><small>Tick only when payment has actually been completed.</small></span></label></div>

 awardLivePreview(el('awardEditor'));

function awardLivePreview(f){if(!f)return;const flags={milestone:f.elements.milestone.value};for(const k of ['honors','academic','nonAcademic','neuro','postgrad','representative'])flags[k]=f.elements[k].checked;
 const r=recognitionAmount(flags);const e=el('awardCalculated'),b=el('awardBreakdown'),m=el('awardManualFields');if(e)e.textContent=money(r.amount);if(b)b.textContent=r.components.filter(x=>x.amount).map(x=>`${x.label}: ${money(x.amount)}`).join(' · ')||'No cash component selected';if(r.capped&&b)b.textContent+=` · milestone maximum applied: ${money(r.cap)}`;if(m)m.style.display=f.elements.manualOverride.checked?'block':'none';}
function awardSave(i,f){
 if(!fbUser||!cloudReady){alert('Cloud storage is not ready. Nothing was saved.');return;}
 const o=Object.fromEntries(new FormData(f).entries());const personId=o.personId; if(!personId||!db.people.some(p=>p.id===personId&&p.student&&!p.deceased)){alert('Select a living family member marked Student in their profile.');return;}
 const sy=String(o.schoolYear||'').trim();if(!/^\d{4}-\d{4}$/.test(sy)||Number(sy.slice(5))!==Number(sy.slice(0,4))+1){alert('Use a school year such as 2025-2026.');return;}
 const existing=db.awards.find(a=>a.id===i);
 const duplicate=db.awards.find(a=>a.id!==i&&a.personId===personId&&a.schoolYear===sy&&a.awardSchema===2);
 if(duplicate){alert('This student already has a structured recognition record for that school year. Please edit it instead of creating a duplicate.');return;}
 const flags={milestone:o.milestone};for(const k of ['honors','academic','nonAcademic','neuro','postgrad','representative'])flags[k]=f.elements[k].checked;
 const calc=recognitionAmount(flags),manual=f.elements.manualOverride.checked;
 const approved=Number(o.approvedAmount);if(manual&&(!Number.isFinite(approved)||approved<0)){alert('Enter a valid approved cash amount.');return;}
 if(manual&&(!o.overrideReason||!o.overrideReason.trim())&&!(existing&&!existing.awardSchema)){alert('Add a reason for using a manually approved amount.');return;}
 const amount=manual?approved:calc.amount;
 const updated={...existing,id:i||id(),awardSchema:2,personId,schoolYear:sy,level:o.level||'',type:AWARD_LABEL[flags.milestone],...flags,details:o.details||'',notes:o.notes||'',amount,manualOverride:manual,overrideReason:manual?(o.overrideReason||'Legacy historical amount'): '',transferred:f.elements.transferred.checked};
 if(i){db.awards=db.awards.map(a=>a.id===i?updated:a)}else db.awards.push(updated);

function splitQuickName(line, commonSurname){
 let value=String(line||'').trim().replace(/\s+/g,' ');
 if(!value)return null;
 let surname=String(commonSurname||'').trim();
 if(value.includes('|')){let parts=value.split('|');value=(parts[0]||'').trim();surname=(parts.slice(1).join('|')||surname).trim();}
 else if(value.includes(',')){let parts=value.split(',');value=(parts.slice(1).join(',')||'').trim();surname=(parts[0]||surname).trim();}
 else if(!surname){let parts=value.split(' ');if(parts.length<2)return {error:'Enter a surname for '+value+' (or use First names | Surname)'};surname=parts.pop();value=parts.join(' ')}
 if(!value||!surname)return {error:'A first name and surname are required: '+line};
 return {firstNames:value,birthSurname:surname,name:value+' '+surname};
}

function csvDateInfo(raw){
 const value=String(raw||'').trim();if(!value)return {iso:'',partial:'',warning:''};
 const mk=(y,m,d)=>{const dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d?`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:''};
 let m=value.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
 if(m){const iso=mk(+m[1],+m[2],+m[3]);return {iso,partial:'',warning:iso?'':'Invalid calendar date: '+value}}
 m=value.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
 if(m){const iso=mk(+m[3],+m[2],+m[1]);return {iso,partial:'',warning:iso?'':'Invalid calendar date: '+value}}
 const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
 m=value.match(/^([a-zA-Z]+)\.?\s+(\d{1,2}),?\s+(\d{2}|\d{4})$/);
 if(m&&months[m[1].toLowerCase().slice(0,3)]){
  let y=Number(m[3]);if(m[3].length===2)y+=y<=26?2000:1900;
  const iso=mk(y,months[m[1].toLowerCase().slice(0,3)],Number(m[2]));
  return {iso,partial:'',warning:iso?'':'Invalid calendar date: '+value};
 }
 m=value.match(/^(\d{4})$/);
 if(m)return {iso:'',partial:value,warning:'Only birth year supplied: '+value+' (birthday left blank)'};
 return {iso:'',partial:value,warning:'Unrecognized date: '+value+' (birthday left blank)'};
}

  const p={id:id(),name:sourceName||fullBirthName,firstNames,birthMiddleName,birthSurname,currentMiddleName,currentSurname,suffix,

function mergeCloudDb(d){if(!d||!Array.isArray(d.people)||!Array.isArray(d.households))throw Error('Invalid Firebase document');db={...initial(),...d,settings:{...initial().settings,...d.settings}};localStorage.setItem(KEY,JSON.stringify(db))}
async function readCloud(){const snap=await cloudDoc().get({source:'server'});return snap.exists?snap.data():null}
async function firstTimeMigration(user){
 if(!isSuperadmin(user)){
   cloudError='The shared family database has not been initialized. Ask the Superadmin to sign in and migrate the existing records first.';
   setCloudState('Awaiting shared setup');render();return false;
 }
 // Previous builds stored the owner's authoritative data here. Never erase it.
 let legacy=null;
 try{const snap=await legacyCloudDoc().get({source:'server'});if(snap.exists)legacy=snap.data()}catch(e){
   cloudError='Could not verify the original private records. No migration was performed: '+e.message;
   setCloudState('Migration blocked');render();return false;
 }
 const source=legacy?.payload;
 if(!source||!Array.isArray(source.people)||!Array.isArray(source.households)){
   cloudError='The original family database was not found at your account’s previous storage path. No new empty shared database has been created. Download a JSON backup and verify the original records before migration.';
   setCloudState('Migration blocked');render();return false;
 }
 cloudError=`Found ${source.people.length} members and ${source.households.length} households in your original Firebase record. Create a shared copy for you and Honey? The original will remain untouched. Download a JSON backup first if you have not already.`;
 setCloudState('Migration requires approval');render();
 if(!confirm(cloudError))return false;
 try{
   await fbStore.runTransaction(async transaction=>{
      const shared=await transaction.get(cloudDoc());
      if(shared.exists)throw Error('The shared record was initialized by another session; reload instead.');
      transaction.set(cloudDoc(),{payload:source,schemaVersion:18,version:1,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),migratedFrom:'owner-private-record'});
   });
 }catch(e){cloudError='Shared copy could not be created; your original records remain safe. '+e.message;setCloudState('Migration failed');render();return false}
 return true;
}
async function syncOnLogin(user){authPending=false;cloudReady=false;cloudError='';cloudVersion=0;setCloudState('Loading shared family records…');render();
 if(!adminRole(user)){cloudError='This Google account is not approved to access the Torres Family Hub.';setCloudState('Access denied');render();return}
 try{
   let record=await readCloud();if(fbUser?.uid!==user.uid)return;
   if(!record){if(!await firstTimeMigration(user))return;record=await readCloud();if(!record)throw Error('Shared migration completed but the database is missing. Reload and verify in Firebase Console.')}
   if(!record.payload)throw Error('The shared family record has no payload. No data was overwritten.');
   // Always use the authoritative shared copy; do not silently upload stale browser data.
   if(hasLocalRecords()&&JSON.stringify(db)!==JSON.stringify(record.payload)){
      if(!confirm('Shared TorresFam records are ready. Load the shared database from Firebase?\n\nOK = load the shared data (recommended). Cancel = preserve unsynced browser data until you export a JSON backup.')){
         cloudError='Local data kept; the shared database has NOT been replaced. Export a backup, then reload.';
         setCloudState('Local data needs review');render();return;
      }
   }
   mergeCloudDb(record.payload);cloudVersion=Number(record.version||0);cloudDocUpdated=record.updatedAt||null;
   cloudReady=true;cloudError='';setCloudState('Cloud saved · shared');render();
 }catch(e){cloudReady=false;cloudError='Unable to access the shared TorresFam records: '+e.message;setCloudState('Access denied / error');render()}
}
async function retryCloud(){if(fbUser)await syncOnLogin(fbUser)}
async function cloudPullConfirm(){if(!fbUser)return;if(!confirm('Replace browser records with the SHARED Firebase copy? Export a JSON backup first if you have unsynced changes.'))return;cloudReady=false;render();await retryCloud()}
async function cloudPushConfirm(){if(!fbUser||!cloudReady)return;if(!confirm('Save your current browser records to the shared Firebase database? A concurrent-edit check will prevent replacing a newer cloud version.'))return;queueCloudSave()}
function queueCloudSave(){if(!cloudReady||!fbUser)return;const uid=fbUser.uid,payload=JSON.parse(JSON.stringify(db)),version=++cloudRevision;
 setCloudState('Saving…');cloudWriteQueue=cloudWriteQueue.catch(()=>{}).then(async()=>{
    if(!fbUser||fbUser.uid!==uid||!cloudReady)return;
    try{
      await fbStore.runTransaction(async transaction=>{
         const ref=cloudDoc();const snap=await transaction.get(ref);
         if(!snap.exists)throw Error('The shared record is missing. Saving is disabled until the Superadmin restores it.');
         const remoteVersion=Number(snap.data().version||0);
         if(remoteVersion!==cloudVersion)throw Error('CONFLICT: Another admin saved newer changes. Export your unsynced JSON backup before reloading.');
         transaction.update(ref,{payload,version:remoteVersion+1,schemaVersion:18,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      });
      cloudVersion++;
      if(version===cloudRevision){setCloudState('Cloud saved · shared');notice('✓ Saved to shared cloud successfully')}
    }catch(e){cloudError=e.message;setCloudState(/CONFLICT/.test(e.message)?'Cloud conflict — unsaved':'Cloud save failed');alert('Cloud save failed. Your browser keeps the local changes. Export a JSON backup before reloading. '+e.message)}
 })
}
function initCloud(){if(typeof firebase==='undefined'){authPending=false;cloudError='Firebase SDK could not load. Check internet connection and refresh.';setCloudState('Offline');render();return}

 fbAuth.onAuthStateChanged(async user=>{fbUser=user;cloudReady=false;authPending=false;cloudError='';if(!user){db=initial();setCloudState('Sign in');render();return}await syncOnLogin(user)},e=>{authPending=false;cloudError=e.message;setCloudState('Authentication failed');render()});
 }catch(e){authPending=false;cloudError=e.message;setCloudState('Firebase initialization failed');render()}}

let procurementTab='overview',procurementDraftRows=0,procurementPromoDraft=null;
const procurementKinds=['Major Raffle','Regular Raffle','Game Prize','Unassigned'];
const procurementCents=v=>Math.round((Number(v)||0)*100);
const procurementPhp=c=>money((Number(c)||0)/100);
const procurementSafe=n=>Math.max(0,Math.floor(Number(n)||0));
function procurementStore(){
 if(!db.procurement||typeof db.procurement!=='object')db.procurement={};
 db.procurement.budgets ||= {};db.procurement.transactions ||= [];
 return db.procurement;
}
function procurementSettings(){const p=procurementStore();if(!p.budgets[year])p.budgets[year]={total:3000000,raffle:2000000,games:1000000};return p.budgets[year]}
function procurementTransactions(){return procurementStore().transactions.filter(t=>String(t.year)===String(year))}
function procurementLines(){return procurementTransactions().flatMap(t=>(t.lines||[]).map(l=>({...l,transactionId:t.id,store:t.store,date:t.date,receipt:t.receipt})));}
function procurementAllocation(line){const a=line.allocation||{};return {major:procurementSafe(a.major),regular:procurementSafe(a.regular),game:procurementSafe(a.game),distributedMajor:procurementSafe(a.distributedMajor),distributedRegular:procurementSafe(a.distributedRegular),distributedGame:procurementSafe(a.distributedGame)}}
function procurementLineCosts(line){const a=procurementAllocation(line),n=procurementSafe(line.paidQty)+procurementSafe(line.freeQty),total=Math.round(Number(line.costCents)||0);
 if(!n)return {major:0,regular:0,game:0,unassigned:total};
 // Use largest remainder allocation: exact cent reconciliation, no fractional cents are stored.
 const buckets=[a.major,a.regular,a.game,Math.max(0,n-a.major-a.regular-a.game)], keys=['major','regular','game','unassigned'];
 const parts=buckets.map((q,i)=>({key:keys[i],base:Math.floor(total*q/n),fraction:(total*q)%n,index:i}));
 let remaining=total-parts.reduce((s,x)=>s+x.base,0);
 [...parts].sort((x,y)=>y.fraction-x.fraction||x.index-y.index).slice(0,remaining).forEach(p=>p.base++);
 return Object.fromEntries(parts.map(p=>[p.key,p.base]));
}
function procurementSummary(){const lines=procurementLines(),b=procurementSettings();const totals={major:0,regular:0,game:0,unassigned:0},qty={major:0,regular:0,game:0,unassigned:0,distributed:0,acquired:0};
 for(const l of lines){const c=procurementLineCosts(l),a=procurementAllocation(l),n=procurementSafe(l.paidQty)+procurementSafe(l.freeQty);for(const k of Object.keys(totals))totals[k]+=c[k];qty.major+=a.major;qty.regular+=a.regular;qty.game+=a.game;qty.unassigned+=n-a.major-a.regular-a.game;qty.distributed+=a.distributedMajor+a.distributedRegular+a.distributedGame;qty.acquired+=n}
 const spent=lines.reduce((s,l)=>s+Number(l.costCents||0),0);return {lines,b,totals,qty,spent,remaining:b.total-spent};}
function procurementGo(tab){procurementTab=tab;render();document.getElementById('prize-manager')?.scrollIntoView({block:'start'});}
function procurementBudgetForm(){const b=procurementSettings();openModal(`${formHeader('Prize shopping budget · '+year,'Change allocations independently; the total budget only changes when explicitly edited.')}
 <form onsubmit="event.preventDefault();procurementBudgetSave(this)"><div class="formgrid"><label>Total budget (₱)<input type="number" name="total" min="0" step=".01" required value="${b.total/100}"></label><label>Raffle allocation (₱)<input type="number" name="raffle" min="0" step=".01" required value="${b.raffle/100}"></label><label>Games allocation (₱)<input type="number" name="games" min="0" step=".01" required value="${b.games/100}"></label></div><p class="tips">Changing the total requires confirmation. Allocations can exceed their individual targets, but the overall balance is based only on actual purchases.</p><div class="foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save budget</button></div></form>`)}
function procurementBudgetSave(f){if(!cloudReady)return alert('Cloud not ready');const d=new FormData(f),old=procurementSettings(),next={total:procurementCents(d.get('total')),raffle:procurementCents(d.get('raffle')),games:procurementCents(d.get('games'))};
 if(next.raffle+next.games!==next.total&&!confirm('Category allocations do not add up to the overall budget. Keep these flexible allocations?'))return;
 if(next.total!==old.total&&!confirm('Change the overall event shopping budget from '+procurementPhp(old.total)+' to '+procurementPhp(next.total)+'?'))return;
 procurementStore().budgets[year]={...next,updatedAt:new Date().toISOString(),updatedBy:fbUser?.uid||''};closeModal();save();notice('Shopping budget saved')}
function procurementTabBar(){return `<nav class="proc-tabs" aria-label="Prize manager views">${[['overview','Overview'],['purchases','Purchases'],['inventory','Prize inventory'],['reports','Reports']].map(([k,t])=>`<button type="button" class="btn ${k===procurementTab?'primary':''}" onclick="procurementGo('${k}')">${t}</button>`).join('')}</nav>`}
function procurementPanel(){const s=procurementSummary(),b=s.b,raffle=s.totals.major+s.totals.regular;const trend=s.remaining<0?'pr-negative':'';return `<section id="prize-manager" class="card procurement-root"><div class="cardheader proc-header"><div><p class="eyebrow">FAMILY DAY · ${year}</p><h3>Prize & expense manager</h3><p class="muted">Real purchases, promotions, prize allocation and reconciled reports.</p></div><button class="btn primary" onclick="procurementPurchaseForm()">+ Quick add purchase</button></div>${procurementTabBar()}

 <div class="proc-splits"><div class="proc-split"><h4>Raffle (major + regular)</h4><strong>${procurementPhp(raffle)}</strong><small>of ${procurementPhp(b.raffle)} allocated · ${procurementPhp(b.raffle-raffle)} balance</small></div><div class="proc-split"><h4>Games</h4><strong>${procurementPhp(s.totals.game)}</strong><small>of ${procurementPhp(b.games)} allocated · ${procurementPhp(b.games-s.totals.game)} balance</small></div><div class="proc-split"><h4>Unassigned</h4><strong>${procurementPhp(s.totals.unassigned)}</strong><small>Still counts against the total budget</small></div></div>
 <div class="toolbar"><button class="btn" onclick="procurementBudgetForm()">Edit budget & allocations</button><button class="btn" onclick="procurementPromotionForm()">Promotion calculator</button><button class="btn" onclick="procurementGo('purchases')">View purchases</button><button class="btn" onclick="procurementJsonForm()">Paste ChatGPT purchases / JSON</button></div>
 ${procurementHistoricalBenchmark()}`:procurementTab==='purchases'?procurementPurchaseList():procurementTab==='inventory'?procurementInventory():procurementReports()}

function procurementFinanceNote(){const n=procurementTransactions().reduce((s,t)=>s+(t.lines||[]).reduce((v,l)=>v+Number(l.costCents||0),0),0);return `<section class="card" style="margin:12px 0"><div class="cardheader"><div><h3>Family Day ${year} · Prize procurement</h3><p class="muted">Actual purchases in the event prize manager</p></div><strong>${procurementPhp(n)}</strong></div><p class="tips">This is a separate purchase register, not an additional family-fund ledger entry. If you record a payment in the fund ledger, do not count it twice when reconciling expenses.</p><button type="button" class="btn tiny" onclick="go('event');procurementGo('overview')">Open prizes & expenses</button></section>`}

function procurementPurchaseList(){const arr=procurementTransactions().slice().sort((a,b)=>String(b.date||'').localeCompare(a.date||''));return `<div class="proc-actions"><button class="btn primary" onclick="procurementPurchaseForm()">+ Add purchase</button><button class="btn" onclick="procurementPromotionForm()">Calculate a promotion</button><button class="btn" onclick="procurementJsonForm()">Import JSON purchases</button></div><div class="proc-purchase-list">${arr.map(t=>{const total=(t.lines||[]).reduce((n,l)=>n+Number(l.costCents||0),0);return `<article class="proc-purchase"><div class="cardheader"><div><b>${esc(t.store||'Unknown store')}</b><small>${esc(t.date||'')} · ${esc(t.receipt||'No receipt ref')}</small></div><strong>${procurementPhp(total)}</strong></div><div>${(t.lines||[]).map(l=>`<div class="proc-line"><span>${esc(l.name)} <small>· ${procurementSafe(l.paidQty)} paid + ${procurementSafe(l.freeQty)} free</small></span><b>${procurementPhp(l.costCents)}</b></div>`).join('')}</div><div class="proc-actions"><button class="btn tiny" onclick="procurementPurchaseForm('${esc(t.id)}')">Edit</button><button class="btn tiny danger" onclick="procurementDeletePurchase('${esc(t.id)}')">Delete</button></div></article>`}).join('')||'<p class="empty">No purchases recorded for this year. Use Quick add purchase to start.</p>'}</div>`}
function procurementInventory(){const lines=procurementLines();return `<p class="tips">Assign acquired units to a prize category; distributed units remain counted as acquired. Allocation never records another expense.</p><div class="proc-purchase-list">${lines.map(l=>{const a=procurementAllocation(l),n=procurementSafe(l.paidQty)+procurementSafe(l.freeQty),cost=procurementLineCosts(l),dist=a.distributedMajor+a.distributedRegular+a.distributedGame;return `<article class="proc-purchase"><div class="cardheader"><div><b>${esc(l.name)}</b><small>${esc(l.store)} · ${esc(l.date)}</small></div><strong>${procurementPhp(l.costCents)}</strong></div><div class="proc-line"><span>Acquired / unassigned / remaining</span><b>${n} / ${n-a.major-a.regular-a.game} / ${n-dist}</b></div><div class="proc-line"><span>Effective unit cost (display only)</span><b>${n?procurementPhp(l.costCents/n):'—'}</b></div><div class="proc-line"><span>Major / Regular / Games</span><b>${a.major} / ${a.regular} / ${a.game}</b></div><div class="proc-line"><span>Distributed</span><b>${dist}</b></div><div class="proc-line"><span>Allocated cost: raffle / games / unassigned</span><b>${procurementPhp(cost.major+cost.regular)} / ${procurementPhp(cost.game)} / ${procurementPhp(cost.unassigned)}</b></div><div class="proc-actions"><button class="btn tiny" onclick="procurementAllocationForm('${esc(l.transactionId)}','${esc(l.id)}')">Assign / distribute</button></div></article>`}).join('')||'<p class="empty">Inventory will appear when you save your first purchase.</p>'}</div>`}
function procurementAllocationForm(transactionId,lineId){const t=procurementTransactions().find(t=>t.id===transactionId),l=t?.lines?.find(l=>l.id===lineId);if(!l)return;const a=procurementAllocation(l),n=procurementSafe(l.paidQty)+procurementSafe(l.freeQty);openModal(`${formHeader('Assign & distribute · '+esc(l.name),n+' units acquired · '+procurementPhp(l.costCents)+' total actual purchase cost')}
 <form onsubmit="event.preventDefault();procurementSaveAllocation('${esc(transactionId)}','${esc(lineId)}',this)"><div class="formgrid">${[['major','Major raffle'],['regular','Regular raffle'],['game','Game prize']].map(([k,label])=>`<label>${label} allocated<input type="number" name="${k}" min="0" step="1" inputmode="numeric" value="${a[k]}"></label>`).join('')}${[['distributedMajor','Major raffle distributed'],['distributedRegular','Regular raffle distributed'],['distributedGame','Game prize distributed']].map(([k,label])=>`<label>${label}<input type="number" name="${k}" min="0" step="1" inputmode="numeric" value="${a[k]}"></label>`).join('')}</div><p class="tips">Allocation total cannot exceed ${n}. Distributed count must stay within its assigned category. Unassigned units are calculated automatically.</p><div class="foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Save allocation</button></div></form>`)}
function procurementSaveAllocation(tid,lid,f){const t=procurementTransactions().find(t=>t.id===tid),l=t?.lines?.find(l=>l.id===lid);if(!l)return;const d=new FormData(f),a={};for(const k of ['major','regular','game','distributedMajor','distributedRegular','distributedGame']){let n=Number(d.get(k));if(!Number.isInteger(n)||n<0)return alert('Use nonnegative whole-number quantities only.');a[k]=n}

 let known=new Set(procurementTransactions().map(procurementImportFingerprint)),fresh=[],skipped=[];

function procurementJsonPreview(){try{const draft=procurementJsonParse(el('procJsonText')?.value||'');procurementPendingImport={...draft,text:el('procJsonText').value,year};const spent=draft.fresh.reduce((n,t)=>n+t.lines.reduce((v,l)=>v+l.costCents,0),0);el('procJsonPreview').innerHTML=`<strong>${draft.fresh.length} new transaction(s) · ${draft.skipped.length} skipped as duplicates</strong><p>New spending: <b>${procurementPhp(spent)}</b> · ${draft.fresh.reduce((s,t)=>s+t.lines.reduce((n,l)=>n+l.paidQty+l.freeQty,0),0)} units received. Budget impact: ${procurementPhp(spent)}.</p><ul>${draft.fresh.slice(0,20).map(t=>`<li><strong>${esc(t.store)}</strong> · ${esc(t.date)} · ${t.lines.length} items · ${procurementPhp(t.lines.reduce((s,l)=>s+l.costCents,0))}<br><small>${esc(t.lines.map(l=>l.name+' ('+(l.paidQty+l.freeQty)+')').join(', '))}</small></li>`).join('')}</ul>${draft.skipped.length?'<p>Possible duplicates are skipped based on date, store, receipt and product quantities/costs. Review before importing if you actually bought identical items twice.</p>':''}<p class="tips">Nothing has been saved yet. All imported units begin unassigned.</p>`;el('procJsonConfirm').disabled=draft.fresh.length===0;}catch(e){procurementPendingImport=null;el('procJsonPreview').textContent='Cannot import: '+e.message;el('procJsonConfirm').disabled=true}}
function procurementJsonCommit(){const pending=procurementPendingImport;if(!pending||pending.year!==year||el('procJsonText')?.value!==pending.text)return alert('Please review the JSON again.');if(!fbUser||!cloudReady)return alert('Sign in and connect to Firebase before importing.');let known=new Set(procurementTransactions().map(procurementImportFingerprint));const rows=pending.fresh.filter(t=>!known.has(procurementImportFingerprint(t)));if(!rows.length)return alert('These transactions have already been imported.');const amount=rows.reduce((n,t)=>n+t.lines.reduce((sum,l)=>sum+l.costCents,0),0);if(!confirm(`Import ${rows.length} purchase transaction(s) costing ${procurementPhp(amount)} into Family Day ${year}? Existing purchases will be preserved. This is a real expense.`))return;procurementStore().transactions.push(...rows);procurementPendingImport=null;closeModal();procurementTab='purchases';save();notice(`${rows.length} purchase(s) added to cloud save queue`)}
function procurementExportJson(){const ts=procurementTransactions().map(t=>({date:t.date,store:t.store,receipt:t.receipt||'',paymentMethod:t.paymentMethod||'',paidBy:t.paidBy||'',notes:t.notes||'',...(t.bundlePriceCents!=null?{bundleTotal:t.bundlePriceCents/100,allocationMethod:t.bundleMethod||'manual'}:{}),lines:(t.lines||[]).map(l=>({name:l.name,brand:l.brand||'',productCategory:l.productCategory||'',paidQty:l.paidQty,freeQty:l.freeQty,actualPaid:Number((l.costCents/100).toFixed(2)),...(l.regularPriceCents!=null?{regularUnitPrice:l.regularPriceCents/100}:{}),discount:(l.discountCents||0)/100,...(l.referenceCents!=null?{referencePrice:l.referenceCents/100}:{}),promotion:l.promo||'',notes:l.notes||''}))}));download(`torres-family-day-${year}-purchases.json`,JSON.stringify({format:'torresfam-procurement-v1',eventYear:year,transactions:ts},null,2),'application/json')}



/* Build 36 — printable, downloadable Family Day status and expense reports.
 * Reports derive from the same shared app records; no duplicate financial ledger.
 * No personal contact, PWD, bank, or authentication details are exported.
 */
function familyReportStrip(){
 return `<section class="family-report-strip" aria-label="Family Day downloadable status report"><div><h3>Family Day status report</h3><p>Share preparation progress, purchases, prize inventory and remaining budget for ${year}.</p></div><div class="family-report-actions"><button type="button" class="btn" onclick="familyReportNoteForm()">Update status note</button><button type="button" class="btn" onclick="familyReportPreview('admin')">Admin details</button><button type="button" class="btn primary" onclick="familyReportPreview('family')">Preview / Print family update</button><button type="button" class="btn" onclick="familyReportDownload('family')">Download report</button><button type="button" class="btn" onclick="familyReportCsv()">Export CSV</button></div></section>`;
}
function familyReportNoteForm(){
 const m=eventMeta();openModal(`${formHeader('Family Day '+year+' · status update','A short preparation update that appears in downloaded family-facing and admin reports.')}
 <form onsubmit="event.preventDefault();familyReportNoteSave(this)"><label>Preparation update<textarea name="update" rows="6" maxlength="1500" placeholder="Example: Raffle prizes purchased; grocery packages being finalized; RSVPs still open.">${esc(m.reportUpdate||'')}</textarea></label>
 <div class="foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Save update</button></div></form>`)
}
function familyReportNoteSave(form){
 if(!fbUser||!cloudReady)return alert('Please sign in and connect to Firebase first.');
 db.eventDetails||={};db.eventDetails[year]||={};db.eventDetails[year].reportUpdate=String(new FormData(form).get('update')||'').trim().slice(0,1500);closeModal();save();notice('Family Day status note saved');
}
function familyReportSource(){
 const m=eventMeta(),pr=procurementSummary(),active=db.people.filter(eventLocalMember),households=eligibleHouseholds(),txs=procurementTransactions().slice().sort((a,b)=>String(a.date||'').localeCompare(b.date||''));
 const count=(test)=>active.filter(test).length;
 const attendance={eligibleRoster:active.length,confirmed:count(p=>eventEffectiveStatus(p)==='Attending'),maybe:count(p=>eventEffectiveStatus(p)==='Maybe'),declined:count(p=>eventEffectiveStatus(p)==='Not attending'),checked:count(p=>Boolean(eventRecord(p.id)?.actualAttended)),notResponded:count(p=>eventEffectiveStatus(p)==='No response')};
 const giftPeople=active.filter(eventGiftEligible),giftReceived=giftPeople.filter(p=>eventRecord(p.id)?.cashReceived).length;
 const householdGiftCount=households.filter(h=>h.gift==='Grocery'||h.gift==='Cash').length;
 const householdDistributed=households.filter(h=>{const r=eventHouseholdRecord(h.id);return h.gift==='Grocery'?!!r?.groceryReceived:h.gift==='Cash'?!!r?.cashReceived:false}).length;
 const allIncome=sum(db.ledger.filter(x=>x.kind==='Income'),'amount');
 const allExpenses=sum(db.ledger.filter(x=>x.kind==='Expense'),'amount');
 const fiscalIncome=sum(db.ledger.filter(x=>x.kind==='Income'&&Number(x.year)===Number(year)),'amount');
 const fiscalExpenses=sum(db.ledger.filter(x=>x.kind==='Expense'&&Number(x.year)===Number(year)),'amount');
 const rows=txs.flatMap(t=>(t.lines||[]).map(l=>({date:t.date||'',store:t.store||'',receipt:t.receipt||'',name:l.name||'',brand:l.brand||'',category:l.productCategory||'',paidQty:procurementSafe(l.paidQty),freeQty:procurementSafe(l.freeQty),received:procurementSafe(l.paidQty)+procurementSafe(l.freeQty),cents:Number(l.costCents)||0,promo:l.promo||'',allocation:procurementAllocation(l),note:l.notes||''})));
 const totalFromTransactions=txs.reduce((a,t)=>a+(t.lines||[]).reduce((b,l)=>b+(Number(l.costCents)||0),0),0);
 if(totalFromTransactions!==pr.spent)throw Error('Procurement report totals do not match the purchase ledger.');
 return {year:Number(year),meta:m,pr,attendance,households:households.length,householdGiftCount,householdDistributed,eligibleChildren:giftPeople.length,giftReceived,txs,rows,allIncome,allExpenses,fiscalIncome,fiscalExpenses,generatedAt:new Date().toISOString()};
}
function familyReportMarkup(mode='family'){
 const d=familyReportSource(),admin=mode==='admin',m=d.meta,pr=d.pr,fmt=procurementPhp;
 const date=m.date?new Date(m.date+'T12:00:00').toLocaleDateString('en-PH',{month:'long',day:'numeric',year:'numeric'}):'Date to be confirmed';
 const eventName=m.eventName||`Torres Family Day ${year}`;
 const kpi=(label,value,small='')=>`<div class="kpi"><span>${esc(label)}</span><b>${esc(value)}</b>${small?`<small>${esc(small)}</small>`:''}</div>`;
 const lineTable=`<table><thead><tr><th>Date / store</th><th>Item</th><th class="num">Paid + free</th><th class="num">Total acquired</th><th class="num">Actual cost</th></tr></thead><tbody>${d.rows.map(l=>`<tr><td>${esc(l.date)}<br><small>${esc(l.store)}</small></td><td>${esc(l.name)}${l.brand?' · '+esc(l.brand):''}${l.promo?`<br><small>Promo: ${esc(l.promo)}</small>`:''}</td><td class="num">${l.paidQty} + ${l.freeQty}</td><td class="num">${l.received}</td><td class="num">${fmt(l.cents)}</td></tr>`).join('')||'<tr><td colspan="5">No purchases recorded yet.</td></tr>'}</tbody><tfoot><tr><th colspan="4">Total itemized purchases</th><th class="num">${fmt(pr.spent)}</th></tr></tfoot></table>`;
 const goods=d.rows.reduce((map,l)=>{const k=[l.name.toLowerCase(),l.brand.toLowerCase()].join('|');if(!map.has(k))map.set(k,{name:l.name,qty:0});map.get(k).qty+=l.received;return map},new Map());
 const goodsTable=[...goods.values()].map(x=>`<li>${esc(x.name)} — <strong>${x.qty}</strong> received</li>`).join('')||'<li>No purchases recorded yet.</li>';
 const inventory=`<div class="metric-grid">${kpi('Items acquired',String(pr.qty.acquired))}${kpi('Unassigned units',String(pr.qty.unassigned))}${kpi('Units distributed',String(pr.qty.distributed))}${kpi('Units remaining',String(pr.qty.acquired-pr.qty.distributed))}</div><p class="fine">Assigned: ${pr.qty.major} major raffle · ${pr.qty.regular} regular raffle · ${pr.qty.game} game prizes. Assignments do not count as new expenses.</p>`;
 const fundOverview=`<section><h2>Family fund status</h2>${db.ledger.length?`<div class="metric-grid">${kpi('Recorded contributions / income',money(d.allIncome))}${kpi('Recorded fund expenses',money(d.allExpenses))}${kpi('Recorded fund balance',money(d.allIncome-d.allExpenses),'Subject to reconciliation')}</div>`:'<p class="fine">No family-fund transactions have been recorded yet. Available cash cannot be determined from the current ledger.</p>'}<p class="fine">This is the recorded family-fund balance, not independently verified cash on hand. Prize-shopping expenses may already be included in the family ledger; they are not subtracted twice.</p></section>`;
 const adminFinance=admin?`<section><h2>Administrator finance reconciliation</h2><div class="metric-grid">${kpi('All-time ledger income',money(d.allIncome))}${kpi('All-time ledger expenses',money(d.allExpenses))}${kpi('Recorded fund balance',money(d.allIncome-d.allExpenses),'Not independently verified cash on hand')}${kpi(year+' ledger net',money(d.fiscalIncome-d.fiscalExpenses))}</div><p class="fine">The family fund ledger and prize procurement register are separate records. Some purchases may already be entered as expenses in the family ledger. Do not subtract procurement purchases from the ledger balance again without reconciling those payments.</p><h3>Recorded ${year} family fund entries</h3><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th class="num">Amount</th></tr></thead><tbody>${db.ledger.filter(x=>Number(x.year)===Number(year)).sort((a,b)=>String(a.date).localeCompare(b.date)).map(x=>`<tr><td>${esc(x.date||'')}</td><td>${esc(x.kind)}</td><td>${esc(x.note||'')}</td><td class="num">${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="4">No entries.</td></tr>'}</tbody></table></section>`:'';
 const prep=String(m.reportUpdate||'').trim();
 const notes=prep?`<section><h2>Preparation update</h2><p class="note">${esc(prep).replace(/\n/g,'<br>')}</p></section>`:'';
 return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(eventName)} · ${admin?'Admin report':'Family update'}</title><style>
 :root{font-family:Arial,Helvetica,sans-serif;color:#242021;background:#f6f3ef}*{box-sizing:border-box}body{margin:0}main{max-width:950px;margin:0 auto;padding:24px 23px 70px;background:white;min-height:100vh}h1,h2{font-family:Georgia,serif;color:#710014}h1{font-size:clamp(25px,5vw,34px);margin:8px 0}h2{font-size:22px;border-bottom:1px solid #e9dfd7;padding-bottom:8px;margin:25px 0 14px}h3{font-size:15px}p{line-height:1.6}.eyebrow{color:#985e67;letter-spacing:.12em;text-transform:uppercase;font-size:11px;font-weight:700}.muted,.fine,small{color:#6e6261}.fine{font-size:12px;line-height:1.5}.meta{margin:10px 0 20px;padding:13px;background:#faf6f2;border-radius:9px}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.kpi{border:1px solid #e4dad1;border-radius:9px;padding:12px;min-width:0}.kpi span{display:block;color:#635b58;font-size:11px;line-height:1.35}.kpi b{font-size:19px;display:block;margin:6px 0;word-break:break-word}.kpi small{display:block;font-size:10px}table{width:100%;border-collapse:collapse;font-size:12px;margin:12px 0}td,th{border-bottom:1px solid #e7dfd7;padding:9px 7px;text-align:left;vertical-align:top}th{background:#f9f5f0;color:#710014}tfoot th{border-top:2px solid #710014}.num{text-align:right;white-space:nowrap}ul{columns:2;padding-left:23px}li{margin:6px 0;break-inside:avoid}.note{border-left:3px solid #710014;padding:13px;background:#fbf7f4;white-space:normal}.warning{color:#9c2e20;background:#fff0ee;border:1px solid #eec9bf;border-radius:8px;padding:12px}.toolbar{position:sticky;top:0;display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;background:white;z-index:3}.toolbar button{border:1px solid #710014;background:#710014;color:white;padding:11px 16px;border-radius:7px;cursor:pointer;font-size:14px;min-height:42px}.toolbar button.secondary{background:white;color:#710014}.section-intro{color:#695f5a;font-size:13px}.reportfooter{margin-top:30px;border-top:1px solid #ddd1c9;padding-top:10px;font-size:11px;color:#6b615e}@media(max-width:650px){main{padding:15px}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}ul{columns:1}table{font-size:11px}td,th{padding:6px 4px}.num{white-space:normal}}@media print{body{background:white}main{max-width:none;padding:0}.toolbar{display:none!important}h2,.kpi,tr{break-inside:avoid}section{break-inside:auto}@page{size:A4;margin:13mm}}
 </style></head><body><main><div class="toolbar"><button onclick="window.print()">Print / Save as PDF</button><button class="secondary" onclick="window.close()">Close preview</button></div><header><div class="eyebrow">Torres family · ${admin?'Confidential administrator report':'Family preparation update'} · ${year}</div><h1>${esc(eventName)}</h1><p class="meta"><strong>Date:</strong> ${esc(date)} ${m.time?' · '+esc(m.time):''}<br><strong>Location:</strong> ${esc(m.venue||'To be confirmed')}<br><strong>Report generated:</strong> ${new Date(d.generatedAt).toLocaleString('en-PH')}</p></header>
 ${notes}<section><h2>Attendance and family gifts</h2><div class="metric-grid">${kpi('Confirmed attendance',String(d.attendance.confirmed))}${kpi('Not attending',String(d.attendance.declined))}${kpi('Checked in',String(d.attendance.checked))}${kpi('Awaiting RSVP',String(d.attendance.notResponded))}${kpi('Eligible child / PWD cash gifts',String(d.eligibleChildren))}${kpi('Child cash gifts distributed',d.giftReceived+' / '+d.eligibleChildren)}${kpi('Eligible Philippine households',String(d.households))}${kpi('Household gifts distributed',d.householdDistributed+' / '+d.householdGiftCount)}</div><p class="fine">Attendance counts only living family members recorded as currently in the Philippines. Changes to RSVPs after this report was generated are not reflected in this saved copy.</p></section>
 <section><h2>Prize procurement budget</h2><div class="metric-grid">${kpi('Shopping budget',fmt(pr.b.total))}${kpi('Actual purchases',fmt(pr.spent))}${kpi('Remaining budget',fmt(pr.remaining))}${kpi('Unassigned spending',fmt(pr.totals.unassigned))}</div>${pr.remaining<0?'<p class="warning">Prize purchases exceed the overall shopping budget.</p>':''}<p class="fine">Raffle allocation ${fmt(pr.b.raffle)} · raffle-assigned cost ${fmt(pr.totals.major+pr.totals.regular)} · Games allocation ${fmt(pr.b.games)} · game-assigned cost ${fmt(pr.totals.game)}. Unassigned purchases count toward spending even before category assignment.</p></section>
 <section><h2>What we have purchased</h2><p class="section-intro">${d.txs.length} purchase transaction(s) from ${new Set(d.txs.map(t=>t.store).filter(Boolean)).size} merchant(s). ${pr.qty.acquired} units received, including free promotional quantities.</p><ul>${goodsTable}</ul>${admin?lineTable:`<p class="fine">Total paid for recorded prize purchases: <strong>${fmt(pr.spent)}</strong>. For itemized costs and receipt references, consult the administrator report.</p>`}</section>
 <section><h2>Prize inventory status</h2>${inventory}</section>${fundOverview}${adminFinance}<footer class="reportfooter">Prepared from TorresFam records on ${new Date(d.generatedAt).toLocaleString('en-PH')}. Figures are only as complete as purchases, contributions and gift deliveries entered in the system. Prize budget remaining is not the same as confirmed cash on hand. No private family bank details are included.</footer></main></body></html>`;
}
function familyReportPreview(mode='family'){
 try{const html=familyReportMarkup(mode),popup=window.open('','_blank');if(!popup){familyReportDownload(mode);alert('Your browser blocked the report preview. An HTML report was downloaded instead; open it and choose Print / Save as PDF.');return}popup.document.open();popup.document.write(html);popup.document.close();}catch(e){alert('Could not generate report: '+e.message)}
}
function familyReportDownload(mode='family'){
 try{const html=familyReportMarkup(mode);download(`TorresFam_Family_Day_${year}_${mode==='admin'?'Admin_Report':'Family_Update'}.html`,html,'text/html;charset=utf-8');notice('Report downloaded. Open it to print or save as PDF.')}catch(e){alert('Could not download report: '+e.message)}
}
function familyReportCsv(){
 try{const d=familyReportSource(),p=d.pr,summary=[['Torres Family Day '+year,'Status Report'],['Report generated',d.generatedAt],['Event name',d.meta.eventName||'Torres Family Day '+year],['Date',d.meta.date||''],['Time',d.meta.time||''],['Location',d.meta.venue||''],['Confirmed attendance',d.attendance.confirmed],['Not attending',d.attendance.declined],['Checked in',d.attendance.checked],['Child gifts eligible',d.eligibleChildren],['Child gifts distributed',d.giftReceived],['Eligible PH households',d.households],['Household gifts distributed',d.householdDistributed],['Prize shopping budget PHP',(p.b.total/100).toFixed(2)],['Prize spending PHP',(p.spent/100).toFixed(2)],['Remaining shopping budget PHP',(p.remaining/100).toFixed(2)],[],['Date','Store','Receipt','Product','Brand','Paid Qty','Free Qty','Total Acquired','Total Cost PHP','Major Raffle Qty','Regular Raffle Qty','Game Qty','Unassigned Qty']];
 for(const l of d.rows)summary.push([l.date,l.store,l.receipt,l.name,l.brand,l.paidQty,l.freeQty,l.received,(l.cents/100).toFixed(2),l.allocation.major,l.allocation.regular,l.allocation.game,l.received-l.allocation.major-l.allocation.regular-l.allocation.game]);
 summary.push(['TOTAL','','','','','','','',(p.spent/100).toFixed(2)]);
 download(`TorresFam_Family_Day_${year}_Status_and_Expenses.csv`,procurementCsv(summary),'text/csv;charset=utf-8');notice('Family Day report CSV downloaded');}catch(e){alert('Could not export CSV: '+e.message)}
}
