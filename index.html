+'-12-01')<=db.settings.childAge)),eligiblePeople=()=>db.people.filter(eligible),eventRSVP=i=>db.rsvps.find(r=>r.personId===i&&r.year===year)?.status||'Not invited / no response',paid=h=>db.dues.filter(d=>d.householdId===h&&d.year===year).reduce((x,d)=>x+Number(d.amount),0),sum=(arr,key)=>arr.reduce((s,x)=>s+Number(x[key]||0),0),fy=()=>db.ledger.filter(x=>x.year===year),balance=()=>sum(fy().filter(x=>x.kind==='Income'),'amount')-sum(fy().filter(x=>x.kind==='Expense'),'amount'),getBudget=()=>db.budgets.filter(x=>x.year===year),budgetTotal=()=>sum(getBudget(),'total'),countStatus=s=>db.rsvps.filter(r=>r.year===year&&r.status===s).length,peopleOptions=(selected='',blank='Select person')=>`<option value="">${blank}</option>`+db.people.map(p=>`<option value="${esc(p.id)}" ${selected===p.id?'selected':''}>${esc(displayName(p))}</option>`).join(''),houseOptions=(selected='',blank='Select household')=>`<option value="">${blank}</option>`+db.households.map(h=>`<option value="${esc(h.id)}" ${selected===h.id?'selected':''}>${esc(h.name)}</option>`).join('');function render(){if(typeof fbUser!=='undefined'&&(!fbUser||!cloudReady)){renderLocked();return}document.body.classList.add('signed-in');el('nav').innerHTML=navItems.map(([k,i,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span class="ico">${i}</span>${t}</button>`).join('');el('crumb').textContent=navItems.find(x=>x[0]===page)[2];el('app').innerHTML=({overview,people,tree,households,event,finance,awards,games,data})[page]();refreshCloudIndicator();}function toggleMobileNav(btn){let side=document.querySelector('.sidebar');let open=side.classList.toggle('nav-open');btn.setAttribute('aria-expanded',String(open));btn.textContent=open?'✕ Close':'☰ Menu'}function go(p){if(!fbUser||!cloudReady)return;page=p;search='';selectedHousehold='';document.querySelector('.sidebar')?.classList.remove('nav-open');let toggle=document.querySelector('.mobile-nav-toggle');if(toggle){toggle.setAttribute('aria-expanded','false');toggle.textContent='☰ Menu'}render();window.scrollTo(0,0)}function yeartool(){return `<select class="yearselect" aria-label="Event year" onchange="year=Number(this.value);render()">${Array.from({length:12},(_,i)=>2023+i).map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select>`}function title(h,sub,button=''){return `<div class="headingline"><div><p class="eyebrow">Torres family hub</p><h1 class="heading">${h}</h1><p class="desc">${sub}</p></div>${button}</div>`}function stat(k,v,f){return `<div class="card"><div class="statlabel">${k}</div><div class="statnum">${v}</div><div class="statfoot">${f}</div></div>`}function overview(){let due= db.households.filter(h=>paid(h.id)>=db.settings.annualDues).length,up=eligiblePeople().length;return `<section class="hero"><div class="herotext"><p class="eyebrow">Welcome home</p><h2>Our family, our story.</h2><p>A little space for generations, celebrations, and everything in between.</p></div><div class="heroart" aria-hidden="true"></div></section>${founderSpotlight()}<div class="headingline"><div><h1 class="heading" style="font-size:27px">Family overview</h1><p class="desc">Your family at a glance · ${year}</p></div>${yeartool()}</div><div class="stats">${stat('Family members',db.people.length,'Across all generations')}${stat('Households',db.households.length,'Family units')}${stat('Membership paid',due+' / '+db.households.length,money(sum(db.dues.filter(d=>d.year===year),'amount'))+' collected')}${stat('Child gift eligible',up,money(up*db.settings.childGift)+' estimated')}</div><div class="sections"><div class="card"><div class="cardheader"><h3>Family Day · ${year}</h3><button class="btn tiny" onclick="go('event')">Open event ↗</button></div><div class="kpirow"><div class="miniKpi"><span>Confirmed</span><b>${countStatus('Attending')}</b></div><div class="miniKpi"><span>Maybe</span><b>${countStatus('Maybe')}</b></div><div class="miniKpi"><span>Not attending</span><b>${countStatus('Not attending')}</b></div></div><div class="minirow"><span>Planned budget</span><strong>${money(budgetTotal())}</strong></div><div class="minirow"><span>Recorded fund balance</span><strong>${money(balance())}</strong></div><div class="minirow"><span>Student awards (${esc(awardYear)})</span><strong>${db.awards.filter(a=>a.schoolYear===awardYear).length} entries</strong></div></div><div class="card"><div class="cardheader"><h3>Upcoming birthdays</h3><button class="btn tiny" onclick="go('people')">Directory ↗</button></div>${birthdays()}</div></div><div class="sections" style="margin-top:16px"><div class="card"><div class="cardheader"><h3>Family households</h3><button class="btn tiny" onclick="go('households')">See all ↗</button></div>${db.households.length?db.households.slice(0,6).map(h=>`<div class="minirow"><span>${esc(h.name)} <small>· ${memberCount(h)} members</small></span><span class="pill ${paid(h.id)>=db.settings.annualDues?'':'warn'}">${paid(h.id)>=db.settings.annualDues?'Paid':'Pending'}</span></div>`).join(''):'<div class="empty">Add your first household to begin.</div>'}</div><div class="card"><h3>Quick start</h3><div class="minirow"><span>Add family members in batches</span><button class="btn tiny" onclick="quickNamesForm()">+ Multiple names</button></div><div class="minirow"><span>Import your existing family sheet</span><button class="btn tiny" onclick="spreadsheetImportForm()">↑ CSV</button></div><div class="minirow"><span>Register a household</span><button class="btn tiny" onclick="houseForm()">+ Household</button></div><div class="minirow"><span>Record an expense</span><button class="btn tiny" onclick="ledgerForm()">+ Transaction</button></div><div class="minirow"><span>Enter an award</span><button class="btn tiny" onclick="awardForm()">+ Award</button></div></div></div>`}function birthdays(){let now=new Date(),n=now.getMonth()*31+now.getDate(),rows=db.people.filter(p=>p.dob&&!p.deceased).map(p=>{let d=new Date(p.dob+'T12:00:00'),x=d.getMonth()*31+d.getDate();return {...p,days:(x-n+372)%372,dobLabel:d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}}).sort((a,b)=>a.days-b.days).slice(0,5);return rows.length?rows.map(p=>`<div class="minirow"><div class="personline"><span class="avatar">${esc(p.name[0]||'?')}</span><div><strong>${esc(displayName(p))}</strong><br><small>${p.dobLabel}</small></div></div><span class="pill muted">${todayAge(p.dob)??'—'} yrs</span></div>`).join(''):'<div class="empty">Birthdays will appear after you add family members.</div>'}function people(){let items=db.people.filter(p=>(displayName(p)+' '+birthName(p)+' '+(p.name||'')+' '+p.nickname+' '+p.location+' '+hname(p.household)).toLowerCase().includes(search.toLowerCase()));return `${title('Family directory','One person, one profile. Family ties, dates, and details stay connected.',`<button class="btn primary" onclick="personForm()">+ Add family member</button>`)}<div class="intake-actions"><button class="btn primary" onclick="quickNamesForm()">+ Quick add multiple names</button><button class="btn" onclick="spreadsheetImportForm()">↑ Import Google Sheets / CSV</button><button class="btn" onclick="templateCSV()">↓ CSV template</button></div><p class="intake-help">Start with names and surnames only. Birthdays, relationships, households and other details can be added later.</p><div class="toolbar"><input type="search" placeholder="Search names, nicknames, locations..." value="${esc(search)}" oninput="setSearch(this.value)"><span class="muted">${items.length} people</span></div><div class="card directory-table"><table><thead><tr><th>Member</th><th>Birthday</th><th>Age</th><th>Household</th><th>Location</th><th>Generation</th><th></th></tr></thead><tbody>${items.map(p=>`<tr><td><div class="personline"><span class="avatar">${esc((p.nickname||displayName(p))[0]||'?')}</span><div><b>${esc(displayName(p))}</b><div class="muted">${esc(p.nickname||'')}${isStructured(p)&&birthName(p)!==displayName(p)?' · Born '+esc(birthName(p)):''}${p.deceased?' · In memoriam':''}</div></div></div></td><td>${esc(p.dob||'—')}</td><td>${p.deceased?'—':todayAge(p.dob)??'—'}</td><td>${esc(hname(p.household))}</td><td>${esc(p.location||'—')}</td><td>${esc(p.generation||'—')}</td><td><button class="btn tiny" onclick="personForm('${p.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No family members yet. Add a person or import a CSV.</td></tr>'}</tbody></table></div><div class="member-cards">${items.map(p=>`<article class="directory-person-card"><div class="personline"><span class="avatar">${esc((p.nickname||displayName(p))[0]||'?')}</span><div><b>${esc(displayName(p))}</b><div class="muted">${esc(p.nickname||'')}${p.deceased?' · In memoriam':''}</div></div></div><div class="person-facts"><span>${esc(p.dob||'Birthday unknown')}</span><span>Generation ${esc(p.generation||'—')}</span><span>${esc(p.location||'City unknown')}</span></div><div class="muted" style="margin-bottom:10px">Household: ${esc(hname(p.household))}</div>${p.household?`<button class="btn tiny" onclick="openHousehold('${p.household}')">View household</button> `:''}<button class="btn tiny" onclick="personForm('${p.id}')">Edit member</button></article>`).join('')||'<div class="empty">No members found.</div>'}</div>`}function founderMatches(){
 const find=(first,birth)=>db.people.find(p=>p.foundingRole===first)||db.people.find(p=>{let n=(displayName(p)+' '+birthName(p)+' '+(p.name||'')).toLowerCase().replace(/[^a-z ]/g,' ');return n.includes(first==='patriarch'?'jeremias':'estelita')&&n.includes('torres')});
 return {father:find('patriarch'),mother:find('matriarch')};
}
function founderSpotlight(){let f=founderMatches(),father=f.father,mother=f.mother;return `<section class="card" style="margin:14px 0 22px;border-top:4px solid var(--deep)"><div class="cardheader"><div><p class="eyebrow">Our roots · Generation 1</p><h3>The founding couple</h3></div>${!father||!mother?'<button class="btn tiny" onclick="seedFounders()">+ Add founding couple</button>':'<button class="btn tiny" onclick="go(&quot;tree&quot;)">View family tree ↗</button>'}</div><div class="grid2"><div><strong>${esc(father?displayName(father):'Jeremias Sahagun Torres Sr.')}</strong><p class="muted">Daddy Lolo · Patriarch${father?' · Profile saved':' · Not yet added'}</p></div><div><strong>${esc(mother?displayName(mother):'Estelita Baluyot Torres')}</strong><p class="muted">Mama T · Matriarch${mother?' · Born Estelita Capulong Baluyot':' · Born Estelita Capulong Baluyot · Not yet added'}</p></div></div><p class="tips">Their ten children are Generation 2; grandchildren Generation 3; great-grandchildren Generation 4; and great-great-grandchildren Generation 5. Family links come from people records, not surnames.</p></section>`}
function seedFounders(){
 const matches=founderMatches();if(matches.father&&matches.mother){notice('Founding profiles already exist');return}
 if(!confirm('Add missing founding profiles for Daddy Lolo and Mama T? Existing matches will be used. You can edit their dates and details later.'))return;
 let father=matches.father,mother=matches.mother;
 if(!father){father={id:id(),name:'Jeremias Sahagun Torres Sr.',firstNames:'Jeremias',birthMiddleName:'Sahagun',birthSurname:'Torres',suffix:'Sr.',nickname:'Daddy Lolo',generation:1,foundingRole:'patriarch'};db.people.push(father)}
 if(!mother){mother={id:id(),name:'Estelita Baluyot Torres',firstNames:'Estelita',birthMiddleName:'Capulong',birthSurname:'Baluyot',currentMiddleName:'Baluyot',currentSurname:'Torres',nickname:'Mama T',generation:1,foundingRole:'matriarch'};db.people.push(mother)}
 father.foundingRole='patriarch';mother.foundingRole='matriarch';father.generation=1;mother.generation=1;
 father.spouse=mother.id;mother.spouse=father.id;save();notice('Founding couple added. Link their ten children in the directory.');
}
function tree(){let groups=[...new Set(db.people.map(p=>p.generation||'Unspecified'))].sort((a,b)=>Number(a)-Number(b));let labels={1:'Founding couple',2:'Their 10 children',3:'Grandchildren',4:'Great-grandchildren',5:'Great-great-grandchildren'};return `${title('Family tree','The Torres family begins with Daddy Lolo and Mama T. Every branch connects back to them.')}${founderSpotlight()}${!db.people.length?'<div class="boxnote">Add the founding couple, then link the ten children to them using the Parent fields.</div>':''}<div class="boxnote">This view groups family members by generation and shows their linked parents and partners. More visual tree connections can be added in a later build.</div>${groups.map(g=>`<div class="card" style="margin-bottom:14px"><h3>Generation ${esc(g)} ${labels[g]?'· '+labels[g]:''}</h3><div class="tree">${db.people.filter(p=>(p.generation||'Unspecified')===g).map(p=>`<div class="treeCard"><strong>${esc(displayName(p))}</strong>${p.foundingRole?'<small>Founding '+(p.foundingRole==='patriarch'?'patriarch':'matriarch')+'</small>':''}<small>${esc(p.nickname||p.dob||'')}${p.deceased?' · In memoriam':''}</small><small>Parents: ${[p.parent1,p.parent2].filter(Boolean).map(pname).map(esc).join(' & ')||'Not yet linked'}</small><small>Partner: ${p.spouse?esc(pname(p.spouse)):'Not linked'}</small><button class="btn tiny" style="margin-top:7px" onclick="personForm('${p.id}')">Edit connections</button></div>`).join('')}</div></div>`).join('')||'<div class="card empty">Your family tree will grow here.</div>'}`}
function openHousehold(hid){if(!db.households.some(h=>h.id===hid))return;selectedHousehold=hid;page='households';search='';render();window.scrollTo({top:0,behavior:'smooth'})}
function householdDetail(h){const members=db.people.filter(p=>p.household===h.id),payments=db.dues.filter(d=>d.householdId===h.id&&d.year===year),received=paid(h.id),due=db.settings.annualDues,remaining=Math.max(0,due-received);
return `<section class="card household-detail"><div class="household-detail-head"><div><div style="letter-spacing:1.8px;font-size:10px">TORRES FAMILY · HOUSEHOLD PROFILE</div><h2>${esc(h.name)}</h2><p>${esc(h.location||'City not provided')} · ${members.length} member${members.length===1?'':'s'}</p></div><button class="btn" onclick="selectedHousehold='';render()">← All households</button></div><div class="household-detail-body"><div class="kpirow"><div class="miniKpi"><span>Membership fee · ${year}</span><b>${money(due)}</b></div><div class="miniKpi"><span>Paid to date</span><b>${money(received)}</b></div><div class="miniKpi"><span>Outstanding</span><b>${money(remaining)}</b></div><div class="miniKpi"><span>Family Day gift</span><b style="font-size:17px">${esc(h.gift||'Undecided')}</b></div></div><div class="headingline"><h3 style="margin:12px 0">Household members</h3><div class="actions"><button class="btn tiny" onclick="personForm()">+ Add member</button><button class="btn tiny" onclick="houseForm('${h.id}')">Edit household</button><button class="btn tiny primary" onclick="dueForm('${h.id}')">+ Record payment</button></div></div><div class="household-member-grid">${members.map(p=>`<div class="household-member"><div class="personline"><div class="avatar">${esc((p.nickname||displayName(p))[0]||'?')}</div><div style="min-width:0"><strong>${esc(displayName(p))}</strong><div class="member-meta">${esc(p.nickname||'')}${p.deceased?' · In memoriam':''}</div></div></div><div class="member-meta">${esc(p.dob||'Birthday not recorded')} · ${p.deceased?'Deceased':todayAge(p.dob)!==null?todayAge(p.dob)+' years old':'Age unknown'}<br>${esc(p.location||'Location not recorded')}${p.generation?' · Gen '+esc(p.generation):''}</div><button class="btn tiny" onclick="personForm('${p.id}')">Edit details</button></div>`).join('')||'<div class="boxnote">No members assigned yet. Open a family member and select this household in their Family Relationships section.</div>'}</div>${h.notes?`<div class="boxnote">${esc(h.notes)}</div>`:''}<h3 style="margin-top:18px">Membership payments · ${year}</h3>${payments.length?payments.map(d=>`<div class="minirow"><span>${esc(d.date||'Date not specified')} ${esc(d.notes||d.note||'')}</span><strong>${money(d.amount)}</strong></div>`).join(''):'<p class="muted">No membership payments recorded for this year.</p>'}</div></section>`}
function households(){let selected=db.households.find(h=>h.id===selectedHousehold);return `${title('Households & membership','A family-at-a-glance view, grouped by household instead of individual profile pages.',`<button class="btn primary" onclick="houseForm()">+ Add household</button>`)}<div class="toolbar">${yeartool()}<span class="muted">Annual family membership · ${money(db.settings.annualDues)} per household</span></div><div class="stats">${stat('Total households',db.households.length,'Registered family units')}${stat('Paid in full',db.households.filter(h=>paid(h.id)>=db.settings.annualDues).length,'For '+year)}${stat('Fees collected',money(sum(db.dues.filter(d=>d.year===year),'amount')),'Membership records')}${stat('Outstanding',money(db.households.reduce((s,h)=>s+Math.max(0,db.settings.annualDues-paid(h.id)),0)),'Based on full dues')}</div>${selected?householdDetail(selected):''}<h2 class="subhead">All family households</h2><div class="household-cards">${db.households.map(h=>`<article class="household-card"><h3>${esc(h.name)}</h3><div class="house-meta">${esc(h.location||'City not provided')} · ${memberCount(h)} members</div><div class="minirow"><span>Membership ${year}</span><span class="pill ${paid(h.id)>=db.settings.annualDues?'':'warn'}">${paid(h.id)>=db.settings.annualDues?'Paid':'Pending'}</span></div><div class="minirow"><span>Paid / due</span><strong>${money(paid(h.id))} / ${money(db.settings.annualDues)}</strong></div><div class="minirow"><span>Gift</span><strong>${esc(h.gift||'Undecided')}</strong></div><div class="house-actions"><button class="btn primary" onclick="openHousehold('${h.id}')">View household</button><button class="btn" onclick="dueForm('${h.id}')">+ Payment</button><button class="btn" onclick="houseForm('${h.id}')">Edit</button></div></article>`).join('')||'<div class="card empty">Add your first household, then assign family members to it in the directory.</div>'}</div>`}
function event(){let r=db.rsvps.filter(x=>x.year===year),attend=r.filter(x=>x.status==='Attending'),gifts=eligiblePeople().filter(p=>eventRSVP(p.id)==='Attending');return `${title('Annual Family Day','RSVPs, household gifts, and children’s cash gifts in one place.',`<button class="btn primary" onclick="rsvpForm()">+ Record RSVP</button>`)}<div class="toolbar">${yeartool()}<span class="muted">Eligibility estimated as of December 1, ${year} · age ${db.settings.childAge} or under / PWD</span></div><div class="stats">${stat('Confirmed guests',attend.length,'Individual confirmed RSVPs')}${stat('Maybe',countStatus('Maybe'),'Awaiting final response')}${stat('Eligible recipients',eligiblePeople().length,'All eligible family members')}${stat('Cash gifts estimate',money(gifts.length*db.settings.childGift),'Confirmed eligible attendees only')}</div><div class="grid2"><div class="card"><div class="cardheader"><h3>RSVP tracker</h3><span class="muted">${r.length} responses</span></div><div class="tablewrap"><table><thead><tr><th>Person</th><th>Status</th><th>Gift eligible</th><th></th></tr></thead><tbody>${r.map(x=>{let p=db.people.find(t=>t.id===x.personId);return `<tr><td>${esc(p?.name||'Unknown')}</td><td><span class="pill ${x.status==='Attending'?'':x.status==='Maybe'?'warn':'muted'}">${esc(x.status)}</span></td><td>${p&&eligible(p)?'Yes':'No'}</td><td><button class="btn tiny" onclick="rsvpForm('${x.id}')">Edit</button></td></tr>`}).join('')||'<tr><td colspan="4" class="empty">No RSVPs recorded.</td></tr>'}</tbody></table></div></div><div class="card"><h3>Distribution planning</h3><div class="minirow"><span>Households · Grocery preference</span><b>${db.households.filter(h=>h.gift==='Grocery').length}</b></div><div class="minirow"><span>Households · Cash preference</span><b>${db.households.filter(h=>h.gift==='Cash').length}</b></div><div class="minirow"><span>Households · Undecided</span><b>${db.households.filter(h=>h.gift==='Undecided').length}</b></div><div class="minirow"><span>Children / PWD · All eligible</span><b>${eligiblePeople().length}</b></div><div class="minirow"><span>Children / PWD · Confirmed attendees</span><b>${gifts.length}</b></div><div class="tabhint">Eligibility is a planning estimate, not automatic approval. Check family relationship, special exceptions, event-specific rules, and whether gifts go to non-attendees before finalizing distribution.</div></div></div>`}
function finance(){let rows=getBudget(),t=fy();return `${title('Budget & finances','Plan your event, record contributions and expenses, and monitor the family fund.',`<button class="btn primary" onclick="budgetForm()">+ Budget item</button>`)}<div class="toolbar">${yeartool()}<button class="btn" onclick="ledgerForm()">+ Record transaction</button></div><div class="stats">${stat('Planned budget',money(budgetTotal()),rows.length+' line items')}${stat('Funds received',money(sum(t.filter(x=>x.kind==='Income'),'amount')),'Recorded contributions')}${stat('Expenses',money(sum(t.filter(x=>x.kind==='Expense'),'amount')),'Recorded disbursements')}${stat('Net balance',money(balance()),'Income less expenses')}</div><div class="card" style="margin-bottom:16px"><div class="cardheader"><h3>Suggested gift allocation</h3><button class="btn tiny" onclick="addGiftEstimates()">+ Add estimates to budget</button></div><div class="kpirow"><div class="miniKpi"><span>Child / PWD gifts · all eligible</span><b>${money(eligiblePeople().length*db.settings.childGift)}</b></div><div class="miniKpi"><span>Grocery family packages</span><b>${money(db.households.filter(h=>h.gift==='Grocery').length*db.settings.groceries)}</b></div><div class="miniKpi"><span>Ham family packages</span><b>${money(db.households.filter(h=>h.gift==='Grocery').length*db.settings.ham)}</b></div></div><p class="tips">Planning estimates only; verify each recipient and household. Cash alternatives are not automatically priced.</p></div><div class="grid2"><div class="card"><div class="cardheader"><h3>Event budget</h3><button class="btn tiny" onclick="budgetForm()">+ Item</button></div><div class="tablewrap"><table><thead><tr><th>Item</th><th>Qty</th><th>Unit cost</th><th>Subtotal</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.total)}</td><td><button class="btn tiny" onclick="budgetForm('${x.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No budget items yet.</td></tr>'}</tbody></table></div><div class="minirow"><strong>Total planned</strong><strong>${money(budgetTotal())}</strong></div></div><div class="card"><div class="cardheader"><h3>Family fund ledger</h3><button class="btn tiny" onclick="ledgerForm()">+ Transaction</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Detail</th><th>Type</th><th>Amount</th><th></th></tr></thead><tbody>${t.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.note)}</td><td><span class="pill ${x.kind==='Income'?'':'warn'}">${esc(x.kind)}</span></td><td>${money(x.amount)}</td><td><button class="btn tiny" onclick="ledgerForm('${x.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No transactions recorded.</td></tr>'}</tbody></table></div></div></div>`}
function awards(){let arr=db.awards.filter(a=>a.schoolYear===awardYear);return `${title('Student recognition','Celebrate every milestone—from graduation and honors to creative and non-academic awards.',`<button class="btn primary" onclick="awardForm()">+ Add recognition</button>`)}<div class="toolbar"><input type="text" style="max-width:160px" aria-label="School year" value="${esc(awardYear)}" onchange="awardYear=this.value;render()"><span class="muted">School year</span></div><div class="stats">${stat('Recognition entries',arr.length,'For '+esc(awardYear))}${stat('Unique students',new Set(arr.map(a=>a.personId)).size,'Recognized children')}${stat('Awards budget',money(sum(arr,'amount')),'Approved cash incentives')}${stat('Transferred',money(sum(arr.filter(a=>a.transferred),'amount')),'Marked as disbursed')}</div><div class="card tablewrap"><table><thead><tr><th>Student</th><th>Level</th><th>Recognition</th><th>Award details</th><th>Cash incentive</th><th>Transferred</th><th></th></tr></thead><tbody>${arr.map(a=>`<tr><td><b>${esc(pname(a.personId))}</b></td><td>${esc(a.level||'—')}</td><td>${esc(a.type)}</td><td style="white-space:normal;min-width:170px">${esc(a.details||'—')}</td><td>${money(a.amount)}</td><td><span class="pill ${a.transferred?'':'warn'}">${a.transferred?'Yes':'Pending'}</span></td><td><button class="btn tiny" onclick="awardForm('${a.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No recognition records for this school year.</td></tr>'}</tbody></table></div>`}

function data(){return `${title('Data & exports','Your records, under your control. Save a backup and bring in existing family names.') }${cloudPanel()}<div class="grid2"><div class="card"><h3>Backup & restore</h3><p class="muted">A JSON backup preserves people, households, RSVP history, budgets, recognition, dues, and all records.</p><div class="toolbar"><button class="btn primary" onclick="exportJSON()">↓ Download full backup</button><label class="btn" for="jsonfile">↑ Restore JSON</label><input type="file" id="jsonfile" accept=".json,application/json" style="display:none" onchange="importJSON(this.files[0]);this.value=''" /></div><p class="tips">Restoring a backup replaces the current data in this browser. Make a backup first.</p></div><div class="card"><h3>Spreadsheet compatibility</h3><button class="btn primary" style="margin-bottom:12px" onclick="quickNamesForm()">+ Quick add multiple names</button> <p class="muted">Bulk import names from Google Sheets or Excel using CSV. Preview new records and match parents by unique names. Your saved records will not be replaced.</p><div class="toolbar"><button class="btn" onclick="exportCSV()">↓ Export directory CSV</button><button class="btn" onclick="templateCSV()">↓ Download import template</button><label class="btn" for="csvfile">↑ Import directory CSV</label><input type="file" id="csvfile" accept=".csv,text/csv" style="display:none" onchange="importCSV(this.files[0]);this.value=''" /></div><p class="tips">Headers can include Name, First Names, Birth Middle Name, Birth Surname, Current Middle Name, Current Surname, Suffix, Nickname, Birthday, Generation, Household, Parent 1, Parent 2, Spouse, Location, PWD, Deceased. Use YYYY-MM-DD dates. Unmatched family links are flagged for review.</p></div></div><div class="grid2" style="margin-top:16px"><div class="card"><h3>Family rules</h3><p class="muted">These defaults reflect what you described. Edit them if your family changes its rules.</p><form class="formgrid" onsubmit="event.preventDefault();settingsSave(this)"><label>Membership dues / household (₱)<input name="annualDues" type="number" min="0" step=".01" value="${db.settings.annualDues}"></label><label>Child gift / recipient (₱)<input name="childGift" type="number" min="0" step=".01" value="${db.settings.childGift}"></label><label>Maximum child age (inclusive)<input name="childAge" type="number" min="0" max="30" value="${db.settings.childAge}"></label><label>Grocery gift estimate (₱)<input name="groceries" type="number" min="0" value="${db.settings.groceries}"></label><label>Ham gift estimate (₱)<input name="ham" type="number" min="0" value="${db.settings.ham}"></label><div class="full"><button class="btn primary" type="submit">Save family rules</button></div></form></div><div class="card"><h3>Privacy & storage</h3><p class="muted">Your browser keeps a local copy. When you connect and sign in to Firebase, changes are also saved to your private Firestore document. Cloud syncing requires an internet connection and suitable Firebase access rules.</p><div class="boxnote">Family records include birthdays and potentially sensitive PWD information. Do not publish JSON backups, personal information, or authentication credentials in your public GitHub repository. Cloud access is restricted by your Firestore rules, not by hiding the site.</div><button class="btn danger" onclick="clearData()">Clear all browser data</button></div></div>`}
function openModal(html){el('modalbody').innerHTML=html;el('modal').showModal()}function closeModal(){el('modal').close()}function formHeader(h,sub){return `<h2>${h}</h2><p>${sub}</p>`}function buttons(type,id){return `<div class="foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button>${id?`<button type="button" class="btn danger" onclick="removeRecord('${type}','${id}')">Delete</button>`:''}<button class="btn primary" type="submit">Save changes</button></div>`}function record(type,id,form,extra={}){const o=Object.fromEntries(new FormData(form).entries());for(let k of Object.keys(o))if(['amount','qty','price','generation'].includes(k)&&o[k]!=='' )o[k]=Number(o[k]);Object.assign(o,extra);if(id){const i=db[type].findIndex(x=>x.id===id);if(i<0)return;db[type][i]={...db[type][i],...o}}else db[type].push({id:window.crypto?.randomUUID?.()||'r'+Date.now()+Math.random(),...o});closeModal();save();notice('Saved successfully')}function removeRecord(type,i){if(!confirm('Delete this record? This cannot be undone unless you have a backup.'))return;db[type]=db[type].filter(x=>x.id!==i);closeModal();save();notice('Record deleted')}function notice(s){const e=el('toast');e.textContent=s;e.hidden=false;clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>e.hidden=true,3000)}function nameParts(p){return [p.firstNames,p.currentMiddleName||p.birthMiddleName,p.currentSurname||p.birthSurname,p.suffix].map(v=>(v||'').trim()).filter(Boolean).join(' ')}
function birthName(p){return [p.firstNames,p.birthMiddleName,p.birthSurname,p.suffix].map(v=>(v||'').trim()).filter(Boolean).join(' ')}
function displayName(p){return (p.firstNames?nameParts(p):'')||p.name||'Unnamed relative'}
function isStructured(p){return !!(p.firstNames||p.birthMiddleName||p.birthSurname||p.currentMiddleName||p.currentSurname)}
function memberSection(title,subtitle='',open=true){return `<div class="full member-section-title"><strong>${title}</strong>${subtitle?`<small>${subtitle}</small>`:''}</div>`}
function paymentRow(pm={}){let n=Math.random().toString(36).slice(2,10);return `<div class="payment-entry full" data-payment-row="${n}"><div class="payment-head"><b>Bank / e-wallet account</b><button type="button" class="btn tiny danger" onclick="this.closest('.payment-entry').remove()">Remove</button></div><div class="formgrid"><label>Type<select data-pm="type"><option value="Bank" ${pm.type==='Bank'?'selected':''}>Bank account</option><option value="E-wallet" ${pm.type==='E-wallet'?'selected':''}>E-wallet</option></select></label><label>Bank or service name<input data-pm="provider" placeholder="BPI, BDO, GCash, Maya…" value="${esc(pm.provider||'')}"></label><label>Account holder / registered name<input data-pm="holder" value="${esc(pm.holder||'')}"></label><label>Account number or registered mobile<input data-pm="number" value="${esc(pm.number||'')}"></label><div class="full qr-area"><label>Payment QR code (optional)<input type="file" accept="image/png,image/jpeg,image/webp" onchange="setPaymentQr(this)"></label><input type="hidden" data-pm="qr" value="${esc(pm.qr||'')}"><div class="qr-preview">${pm.qr?`<img src="${esc(pm.qr)}" alt="Saved payment QR code">`:'<span class="muted">No QR image attached</span>'}</div><button type="button" class="btn tiny" onclick="clearPaymentQr(this)">Remove QR</button><div class="muted" style="font-size:11px">Stored privately with this family profile. Large images may exceed Firestore limits; this tool compresses the image.</div></div></div></div>`}
function addPaymentRow(){el('paymentRows').insertAdjacentHTML('beforeend',paymentRow())}
function clearPaymentQr(b){let row=b.closest('.payment-entry');row.querySelector('[data-pm="qr"]').value='';row.querySelector('.qr-preview').innerHTML='<span class="muted">No QR image attached</span>';row.querySelector('input[type=file]').value=''}
async function setPaymentQr(input){let file=input.files?.[0];if(!file)return;let row=input.closest('.payment-entry');try{if(file.size>4*1024*1024)throw Error('Please choose an image under 4 MB.');let im=new Image(),objectUrl=URL.createObjectURL(file);try{await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=objectUrl});let canvas=document.createElement('canvas');let scale=Math.min(1,360/Math.max(im.width,im.height));canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);let output=canvas.toDataURL('image/png');if(output.length>65000)throw Error('QR is too detailed for the current small-image limit. Please use a simpler or smaller QR screenshot.');let current=[...document.querySelectorAll('[data-pm="qr"]')].filter(x=>x!==row.querySelector('[data-pm="qr"]')).reduce((n,x)=>n+x.value.length,0);if(current+output.length>450000)throw Error('QR attachment storage limit reached. Contact data can still be saved without another image.');row.querySelector('[data-pm="qr"]').value=output;row.querySelector('.qr-preview').innerHTML='<img alt="Uploaded payment QR preview" src="'+output+'">';}finally{URL.revokeObjectURL(objectUrl)}}catch(e){alert('QR image not attached: '+e.message);input.value=''}}
function personForm(i=''){let p=db.people.find(x=>x.id===i)||{},opts=selected=>`<option value="">Not linked</option>`+db.people.filter(x=>x.id!==i).map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(displayName(x))}</option>`).join(''),choose=(list,val)=>list.map(x=>`<option value="${esc(x)}" ${x===(val||'')?'selected':''}>${esc(x)}</option>`).join('');openModal(`${formHeader(i?'Edit family member':'Add family member','Genealogy, contact information, and private payment details in one profile.')}<form onsubmit="event.preventDefault();personSave('${i}',this)"><div class="formgrid">${memberSection('01 · Identity & names','Birth names remain preserved even after marriage.')}${!isStructured(p)&&p.name?`<div class="full boxnote">Existing name: <b>${esc(displayName(p))}</b>. Add structured fields when ready.</div>`:''}<label class="full">First name(s) ${i?'':'*'}<input name="firstNames" ${i?'':'required'} value="${esc(p.firstNames||'')}" placeholder="Janis Christine"></label><label>Middle name at birth<input name="birthMiddleName" value="${esc(p.birthMiddleName||'')}" placeholder="Maternal birth surname"></label><label>Birth surname<input name="birthSurname" value="${esc(p.birthSurname||'')}" placeholder="Paternal surname"></label><label>Current legal middle name<input name="currentMiddleName" value="${esc(p.currentMiddleName||'')}" placeholder="Blank = birth middle name"></label><label>Current legal surname<input name="currentSurname" value="${esc(p.currentSurname||'')}" placeholder="Blank = birth surname"></label><label>Suffix<input name="suffix" placeholder="Sr., Jr., III…" value="${esc(p.suffix||'')}"></label><label>Nickname<input name="nickname" value="${esc(p.nickname||'')}"></label><label>Gender (optional)<select name="gender">${choose(['','Male','Female','Other','Unknown'],p.gender)}</select></label><label>Birth date<input type="date" name="dob" value="${esc(p.dob||'')}"></label><label>Birth city / place (optional)<input name="birthPlace" value="${esc(p.birthPlace||'')}"></label><label>Generation<input type="number" min="1" max="15" name="generation" value="${esc(p.generation||'')}"></label><label>Death date, if applicable<input type="date" name="deathDate" value="${esc(p.deathDate||'')}"></label><label class="check"><input type="checkbox" name="deceased" ${p.deceased?'checked':''}> Deceased</label><label class="check"><input type="checkbox" name="pwd" ${p.pwd?'checked':''}> PWD eligible · private</label>${memberSection('02 · Family relationships','Link existing relatives instead of typing their names again.')}<label>Parent 1<select name="parent1">${opts(p.parent1)}</select></label><label>Parent 2<select name="parent2">${opts(p.parent2)}</select></label><label>Relationship to parent(s)<select name="parentRelationship">${choose(['Biological child','Adopted child','Foster child','Stepchild','Other / not specified'],p.parentRelationship||'Biological child')}</select></label><label>Spouse / partner<select name="spouse">${opts(p.spouse)}</select></label><label>Household<select name="household">${houseOptions(p.household,'No household assigned')}</select></label><label>Relationship status<select name="relationshipStatus">${choose(['','Single','Married','Partnered','Separated','Divorced','Widowed','Other'],p.relationshipStatus)}</select></label>${memberSection('03 · Contact & location','City-level location only; street addresses are not required.')}<label>Current city <input name="location" placeholder="Quezon City" value="${esc(p.location||'')}"></label><label>Province / region (optional)<input name="region" placeholder="Metro Manila" value="${esc(p.region||'')}"></label><label>Country (optional)<input name="country" placeholder="Philippines" value="${esc(p.country||'')}"></label><label>Mobile number<input name="mobile" type="tel" value="${esc(p.mobile||'')}"></label><label>Email address<input name="contactEmail" type="email" value="${esc(p.contactEmail||'')}"></label><label>Facebook profile link<input name="facebook" type="url" placeholder="https://facebook.com/…" value="${esc(p.facebook||'')}"></label>${memberSection('04 · Bank & e-wallet details · PRIVATE','Visible to the administrator only. Never include these fields in a public family directory or CSV export.')}<div class="full" id="paymentRows">${(p.paymentMethods||[]).map(paymentRow).join('')}</div><div class="full"><button class="btn" type="button" onclick="addPaymentRow()">+ Add bank or e-wallet account</button></div>${memberSection('05 · Notes','Optional genealogy notes or useful reminders.')}<label class="full">Notes<textarea name="notes" rows="3">${esc(p.notes||'')}</textarea></label></div>${buttons('people',i)}</form>`)}
function personSave(i,f){const o=Object.fromEntries(new FormData(f).entries());for(const k of ['firstNames','birthMiddleName','birthSurname','currentMiddleName','currentSurname','suffix'])o[k]=(o[k]||'').trim();const existing=db.people.find(p=>p.id===i);if(!o.firstNames&&!existing?.name){alert('Please enter first name(s).');return}o.pwd=f.elements.pwd.checked;o.deceased=f.elements.deceased.checked;o.paymentMethods=[...f.querySelectorAll('.payment-entry')].map(row=>Object.fromEntries(['type','provider','holder','number','qr'].map(k=>[k,row.querySelector(`[data-pm="${k}"]`)?.value?.trim()||'']))).filter(v=>v.provider||v.number||v.qr);if(o.firstNames)o.name=displayName(o);else if(existing)o.name=existing.name;let check={...db,people:db.people.map(p=>p.id===i?{...p,...o}:p)};if(!i)check.people.push({...o,id:'temporary'});if(JSON.stringify(check).length>750000){alert('This data set is approaching Firestore’s document size limit. Please remove QR images or use a separate image-storage service before saving.');return}record('people',i,f,o)}

/* Build 8: simple multiple-name entry, without birthday or mandatory relationship details. */
function splitQuickName(line, commonSurname){
 let value=String(line||'').trim().replace(/\s+/g,' ');
 if(!value)return null;
 let surname=String(commonSurname||'').trim();
 if(value.includes('|')){let parts=value.split('|');value=(parts[0]||'').trim();surname=(parts.slice(1).join('|')||surname).trim();}
 else if(value.includes(',')){let parts=value.split(',');value=(parts.slice(1).join(',')||'').trim();surname=(parts[0]||surname).trim();}
 else if(!surname){let parts=value.split(' ');if(parts.length<2)return {error:'Enter a surname for '+value+' (or use First names | Surname)'};surname=parts.pop();value=parts.join(' ')}
 if(!value||!surname)return {error:'A first name and surname are required: '+line};
 return {firstNames:value,birthSurname:surname,name:value+' '+surname};
}
function getQuickNames(){return (el('quickNamesLines')?.value||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(s=>splitQuickName(s,el('quickCommonSurname')?.value))}
function quickNamePreview(){let entries=getQuickNames(),errors=entries.filter(x=>x.error),known=new Set(db.people.map(p=>normalizeMemberKey(displayName(p)))),distinct=new Set(),newRows=[];let dups=[];for(let e of entries){if(e.error)continue;const k=normalizeMemberKey(e.name);if(known.has(k)||distinct.has(k))dups.push(e.name);else{newRows.push(e);distinct.add(k)}}let box=el('quickPreview');if(box)box.innerHTML=`<div><b>${newRows.length} ready to add</b> · ${dups.length} duplicate(s) · ${errors.length} need attention</div>`+newRows.slice(0,15).map(e=>`<div>${esc(e.name)}</div>`).join('')+(newRows.length>15?`<div>…and ${newRows.length-15} more</div>`:'')+errors.slice(0,5).map(e=>`<div style="color:#a33">${esc(e.error)}</div>`).join('');return {newRows,dups,errors}}

function csvDate(raw){if(!raw)return '';let s=raw.trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s)){let d=new Date(s+'T12:00:00');return !isNaN(d)&&d.toISOString().slice(0,10)===s?s:''}let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);if(m){let d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));if(d.getDate()===Number(m[1])&&d.getMonth()===Number(m[2])-1)return [m[3],m[2].padStart(2,'0'),m[1].padStart(2,'0')].join('-')}return ''}
async function importCSV(file){if(!file)return;try{
 const rows=parseCSV((await file.text()).replace(/^\ufeff/,''));if(rows.length<2)throw Error('CSV has no records');const head=rows.shift().map(x=>x.trim().toLowerCase());const idx=n=>head.indexOf(n.toLowerCase());const col=(r,...names)=>{for(const n of names){let j=idx(n);if(j>=0)return (r[j]||'').trim()}return ''};if(idx('Name')<0&&idx('First Names')<0&&idx('First Name')<0)throw Error('Missing Name, First Names or First Name header');
 const key=s=>String(s||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,' ' ).trim();
 const known=new Set(db.people.map(p=>key(displayName(p))));let candidates=[],duplicate=[],invalid=[];
 for(const [index,r] of rows.entries()){
  const firstNames=col(r,'First Names','First Name'),birthMiddleName=col(r,'Birth Middle Name','Middle Name at Birth'),birthSurname=col(r,'Birth Surname','Surname','Last Name'),currentMiddleName=col(r,'Current Middle Name'),currentSurname=col(r,'Current Surname'),suffix=col(r,'Suffix');
  const name=col(r,'Name','Full Name')||[firstNames,currentMiddleName||birthMiddleName,currentSurname||birthSurname,suffix].filter(Boolean).join(' ');if(!name.trim())continue;
  if(known.has(key(name))){duplicate.push(name);continue}known.add(key(name));
  const rawDob=col(r,'Birthday','Date of Birth');let dob=csvDate(rawDob);if(rawDob&&!dob){invalid.push('Row '+(index+2)+': '+rawDob);continue}
  candidates.push({id:id(),name,firstNames,birthMiddleName,birthSurname,currentMiddleName,currentSurname,suffix,nickname:col(r,'Nickname'),dob,location:col(r,'Location'),generation:Number(col(r,'Generation'))||'',_household:col(r,'Household'),_parent1:col(r,'Parent 1','Father'),_parent2:col(r,'Parent 2','Mother'),_spouse:col(r,'Spouse','Spouse / Partner'),pwd:/^(yes|true|1)$/i.test(col(r,'PWD')),deceased:/^(yes|true|1)$/i.test(col(r,'Deceased'))});
 }
 let preview=`Ready to import ${candidates.length} new people.\nAlready existing / repeated names skipped: ${duplicate.length}.\nInvalid dates skipped: ${invalid.length}.\n\nThis adds records to your existing database. It does not overwrite anyone. Continue?`;
 if(!candidates.length){alert(preview);return}if(!confirm(preview))return;
 const all=db.people.concat(candidates);let ambiguous=[];const resolve=(v)=>{if(!v)return '';const m=all.filter(p=>key(displayName(p))===key(v)||key(birthName(p))===key(v)||key(p.name)===key(v));if(m.length===1)return m[0].id;ambiguous.push(v+(m.length?' (multiple matches)':' (not found)'));return ''};
 for(const p of candidates){if(p._household){let h=db.households.find(x=>key(x.name)===key(p._household));if(!h){h={id:id(),name:p._household,gift:'Undecided'};db.households.push(h)}p.household=h.id}p.parent1=resolve(p._parent1);p.parent2=resolve(p._parent2);p.spouse=resolve(p._spouse);delete p._household;delete p._parent1;delete p._parent2;delete p._spouse}
 db.people.push(...candidates);save();alert(`Imported ${candidates.length} people. Skipped ${duplicate.length} repeated names and ${invalid.length} invalid dates. ${ambiguous.length} family links require manual review.\n\nDownload a backup after checking your data.`);
 if(ambiguous.length)console.warn('Unresolved Torres family links:',ambiguous);
 }catch(e){alert('Could not import CSV: '+e.message)}}

async function syncOnLogin(user){authPending=false;cloudReady=false;cloudError='';setCloudState('Loading…');render();try{let d=await readCloud();if(fbUser?.uid!==user.uid)return;if(d){if(hasLocalRecords()){const replace=confirm('Firebase has saved records. Load the cloud copy?\n\nOK = use Firebase records (recommended). Cancel = keep local data temporarily.');if(!replace){cloudError='Cloud data exists, but local data was kept. Choose Reload or Upload in Data & exports after backing up.';setCloudState('Cloud not loaded');render();return}}mergeCloudDb(d.payload);cloudReady=true;setCloudState('Cloud saved');}else if(hasLocalRecords()) {cloudReady=false;cloudError='No existing Firebase data. Your browser still contains records. Back up first, then choose to upload them.';setCloudState('Migration needed');render();if(confirm('No cloud copy exists yet. Upload the records stored in this browser?\n\nCancel to leave them untouched.')){cloudReady=true;queueCloudSave();cloudError='';}else return;}else{db=initial();cloudReady=true;setCloudState('Connected');}render()}catch(e){cloudReady=false;cloudError='Unable to access your private Firestore records: '+e.message;setCloudState('Access denied / error');render()}}
async function retryCloud(){if(fbUser)await syncOnLogin(fbUser)}
async function cloudPullConfirm(){if(!fbUser)return;if(!confirm('Replace browser records with the cloud copy? Download a JSON backup first if you have unsynced changes.'))return;cloudReady=false;render();await retryCloud()}
async function cloudPushConfirm(){if(!fbUser)return;if(!confirm('Overwrite the Firebase snapshot using records currently in this browser? Download a backup first.'))return;cloudReady=true;queueCloudSave()}
function queueCloudSave(){if(!cloudReady||!fbUser)return;const uid=fbUser.uid,payload=JSON.parse(JSON.stringify(db)),version=++cloudRevision;setCloudState('Saving…');cloudWriteQueue=cloudWriteQueue.catch(()=>{}).then(async()=>{if(!fbUser||fbUser.uid!==uid||!cloudReady)return;try{await cloudDoc().set({payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),schemaVersion:4});if(version===cloudRevision)setCloudState('Cloud saved')}catch(e){cloudError=e.message;setCloudState('Cloud save failed');alert('Cloud save failed. Your browser still has a local copy; export a JSON backup. '+e.message)}})}
function initCloud(){if(typeof firebase==='undefined'){authPending=false;cloudError='Firebase SDK could not load. Check internet connection and refresh.';setCloudState('Offline');render();return}try{fbApp=firebase.apps.find(a=>a.name==='torresFamily')||firebase.initializeApp(FIREBASE_CONFIG,'torresFamily');fbAuth=fbApp.auth();fbStore=fbApp.firestore();fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);fbAuth.onAuthStateChanged(async user=>{fbUser=user;cloudReady=false;authPending=false;cloudError='';if(!user){db=initial();setCloudState('Sign in');render();return}await syncOnLogin(user)},e=>{authPending=false;cloudError=e.message;setCloudState('Authentication failed');render()});}catch(e){authPending=false;cloudError=e.message;setCloudState('Firebase initialization failed');render()}}
window.addEventListener('load',initCloud);

render();
</script></body></html>
