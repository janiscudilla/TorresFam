</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="monogram">T</div><div><strong>Torres Family</strong><small>Our family, our story</small></div></div><div class="navlabel">Family hub</div><div class="nav" id="nav"></div><div class="asidebottom">PRIVATE FAMILY WORKSPACE<br><b>Build 3 · Firebase-ready</b><br><span>Manage secure cloud sync in Data & exports.</span></div></aside><main><div class="topbar"><div class="breadcrumb">TORRES FAMILY <span style="color:#c7c8bd">/</span> <span id="crumb">Overview</span></div><div class="actions"><button class="sync-chip" id="syncChip" onclick="go('data')" title="Open cloud settings">Browser only</button><button class="btn" onclick="printReport()">↗ Print / PDF</button><button class="btn" onclick="exportJSON()">↓ Backup</button><button class="btn primary" onclick="quickAdd()">+ Add new</button></div></div><div id="app"></div></main></div><dialog id="modal"><div id="modalbody"></div></dialog><div id="toast" hidden class="notification"></div><script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

'use strict';const KEY='torres-family-hub-build1',navItems=[['overview','⌂','Overview'],['people','♧','Family directory'],['tree','♧','Family tree'],['households','▤','Households & dues'],['event','▣','Family Day'],['finance','₱','Budget & finances'],['awards','☆','Student recognition'],['games','◇','Games & prizes'],['data','⚙','Data & exports']];let page='overview',year=new Date().getFullYear(),awardYear='2025-2026',search='';const id=()=>globalThis.crypto?.randomUUID?.()||'id'+Date.now()+Math.random().toString(36).slice(2);const initial=()=>({people:[],households:[],dues:[],rsvps:[],budgets:[],ledger:[],awards:[],games:[],settings:{childGift:1000,childAge:17,annualDues:500,groceries:1500,ham:1500}});let db=load();function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.people))return {...initial(),...v,settings:{...initial().settings,...v.settings}}}catch(e){}return initial()}function save(){localStorage.setItem(KEY,JSON.stringify(db));render();queueCloudSave()}const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}),pname=i=>{let p=db.people.find(p=>p.id===i);return p?displayName(p):'Unknown'},hname=i=>db.households.find(h=>h.id===i)?.name||'Unassigned',age=(dob,at=year+'-12-01')=>{if(!dob)return null;const d=new Date(dob+'T12:00:00'),t=new Date(at+'T12:00:00');if(isNaN(d)||isNaN(t))return null;let a=t.getFullYear()-d.getFullYear();if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate()))a--;return a},todayAge=d=>age(d,new Date().toISOString().slice(0,10)),memberCount=h=>db.people.filter(p=>p.household===h.id).length,eligible=p=>!p.deceased&&(p.pwd|| (age(p.dob,year+'-12-01')!==null&&age(p.dob,year+'-12-01')<=db.settings.childAge)),eligiblePeople=()=>db.people.filter(eligible),eventRSVP=i=>db.rsvps.find(r=>r.personId===i&&r.year===year)?.status||'Not invited / no response',paid=h=>db.dues.filter(d=>d.householdId===h&&d.year===year).reduce((x,d)=>x+Number(d.amount),0),sum=(arr,key)=>arr.reduce((s,x)=>s+Number(x[key]||0),0),fy=()=>db.ledger.filter(x=>x.year===year),balance=()=>sum(fy().filter(x=>x.kind==='Income'),'amount')-sum(fy().filter(x=>x.kind==='Expense'),'amount'),getBudget=()=>db.budgets.filter(x=>x.year===year),budgetTotal=()=>sum(getBudget(),'total'),countStatus=s=>db.rsvps.filter(r=>r.year===year&&r.status===s).length,peopleOptions=(selected='',blank='Select person')=>`<option value="">${blank}</option>`+db.people.map(p=>`<option value="${esc(p.id)}" ${selected===p.id?'selected':''}>${esc(displayName(p))}</option>`).join(''),houseOptions=(selected='',blank='Select household')=>`<option value="">${blank}</option>`+db.households.map(h=>`<option value="${esc(h.id)}" ${selected===h.id?'selected':''}>${esc(h.name)}</option>`).join('');function render(){el('nav').innerHTML=navItems.map(([k,i,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span class="ico">${i}</span>${t}</button>`).join('');el('crumb').textContent=navItems.find(x=>x[0]===page)[2];el('app').innerHTML=({overview,people,tree,households,event,finance,awards,games,data})[page]();refreshCloudIndicator();}function go(p){page=p;search='';render();window.scrollTo(0,0)}function yeartool(){return `<select class="yearselect" aria-label="Event year" onchange="year=Number(this.value);render()">${Array.from({length:12},(_,i)=>2023+i).map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select>`}function title(h,sub,button=''){return `<div class="headingline"><div><p class="eyebrow">Torres family hub</p><h1 class="heading">${h}</h1><p class="desc">${sub}</p></div>${button}</div>`}function stat(k,v,f){return `<div class="card"><div class="statlabel">${k}</div><div class="statnum">${v}</div><div class="statfoot">${f}</div></div>`}function overview(){let due= db.households.filter(h=>paid(h.id)>=db.settings.annualDues).length,up=eligiblePeople().length;return `<section class="hero"><div class="herotext"><p class="eyebrow">Welcome home</p><h2>Our family, our story.</h2><p>A little space for generations, celebrations, and everything in between.</p></div><div class="heroart" aria-hidden="true"></div></section><div class="headingline"><div><h1 class="heading" style="font-size:27px">Family overview</h1><p class="desc">Your family at a glance · ${year}</p></div>${yeartool()}</div><div class="stats">${stat('Family members',db.people.length,'Across all generations')}${stat('Households',db.households.length,'Family units')}${stat('Membership paid',due+' / '+db.households.length,money(sum(db.dues.filter(d=>d.year===year),'amount'))+' collected')}${stat('Child gift eligible',up,money(up*db.settings.childGift)+' estimated')}</div><div class="sections"><div class="card"><div class="cardheader"><h3>Family Day · ${year}</h3><button class="btn tiny" onclick="go('event')">Open event ↗</button></div><div class="kpirow"><div class="miniKpi"><span>Confirmed</span><b>${countStatus('Attending')}</b></div><div class="miniKpi"><span>Maybe</span><b>${countStatus('Maybe')}</b></div><div class="miniKpi"><span>Not attending</span><b>${countStatus('Not attending')}</b></div></div><div class="minirow"><span>Planned budget</span><strong>${money(budgetTotal())}</strong></div><div class="minirow"><span>Recorded fund balance</span><strong>${money(balance())}</strong></div><div class="minirow"><span>Student awards (${esc(awardYear)})</span><strong>${db.awards.filter(a=>a.schoolYear===awardYear).length} entries</strong></div></div><div class="card"><div class="cardheader"><h3>Upcoming birthdays</h3><button class="btn tiny" onclick="go('people')">Directory ↗</button></div>${birthdays()}</div></div><div class="sections" style="margin-top:16px"><div class="card"><div class="cardheader"><h3>Family households</h3><button class="btn tiny" onclick="go('households')">See all ↗</button></div>${db.households.length?db.households.slice(0,6).map(h=>`<div class="minirow"><span>${esc(h.name)} <small>· ${memberCount(h)} members</small></span><span class="pill ${paid(h.id)>=db.settings.annualDues?'':'warn'}">${paid(h.id)>=db.settings.annualDues?'Paid':'Pending'}</span></div>`).join(''):'<div class="empty">Add your first household to begin.</div>'}</div><div class="card"><h3>Quick start</h3><div class="minirow"><span>Add a family member</span><button class="btn tiny" onclick="personForm()">+ Person</button></div><div class="minirow"><span>Register a household</span><button class="btn tiny" onclick="houseForm()">+ Household</button></div><div class="minirow"><span>Record an expense</span><button class="btn tiny" onclick="ledgerForm()">+ Transaction</button></div><div class="minirow"><span>Enter an award</span><button class="btn tiny" onclick="awardForm()">+ Award</button></div></div></div>`}function birthdays(){let now=new Date(),n=now.getMonth()*31+now.getDate(),rows=db.people.filter(p=>p.dob&&!p.deceased).map(p=>{let d=new Date(p.dob+'T12:00:00'),x=d.getMonth()*31+d.getDate();return {...p,days:(x-n+372)%372,dobLabel:d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}}).sort((a,b)=>a.days-b.days).slice(0,5);return rows.length?rows.map(p=>`<div class="minirow"><div class="personline"><span class="avatar">${esc(p.name[0]||'?')}</span><div><strong>${esc(displayName(p))}</strong><br><small>${p.dobLabel}</small></div></div><span class="pill muted">${todayAge(p.dob)??'—'} yrs</span></div>`).join(''):'<div class="empty">Birthdays will appear after you add family members.</div>'}function people(){let items=db.people.filter(p=>(displayName(p)+' '+birthName(p)+' '+(p.name||'')+' '+p.nickname+' '+p.location+' '+hname(p.household)).toLowerCase().includes(search.toLowerCase()));return `${title('Family directory','One person, one profile. Family ties, dates, and details stay connected.',`<button class="btn primary" onclick="personForm()">+ Add family member</button>`)}<div class="toolbar"><input type="search" placeholder="Search names, nicknames, locations..." value="${esc(search)}" oninput="setSearch(this.value)"><span class="muted">${items.length} people</span></div><div class="card tablewrap"><table><thead><tr><th>Member</th><th>Birthday</th><th>Age</th><th>Household</th><th>Location</th><th>Generation</th><th></th></tr></thead><tbody>${items.map(p=>`<tr><td><div class="personline"><span class="avatar">${esc((p.nickname||displayName(p))[0]||'?')}</span><div><b>${esc(displayName(p))}</b><div class="muted">${esc(p.nickname||'')}${isStructured(p)&&birthName(p)!==displayName(p)?' · Born '+esc(birthName(p)):''}${p.deceased?' · In memoriam':''}</div></div></div></td><td>${esc(p.dob||'—')}</td><td>${p.deceased?'—':todayAge(p.dob)??'—'}</td><td>${esc(hname(p.household))}</td><td>${esc(p.location||'—')}</td><td>${esc(p.generation||'—')}</td><td><button class="btn tiny" onclick="personForm('${p.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No family members yet. Add a person or import a CSV.</td></tr>'}</tbody></table></div>`}function tree(){let groups=[...new Set(db.people.map(p=>p.generation||'Unspecified'))].sort((a,b)=>Number(a)-Number(b));return `${title('Family tree','A living record of the people and connections that make up your family.')}${!db.people.length?'<div class="boxnote">Start by adding family members. Choose each person’s parents and partner to build their relationships.</div>':''}<div class="boxnote">Build 1 shows connected family cards grouped by generation. A fully connected visual tree with branches and lines is planned for the next iteration.</div>${groups.map(g=>`<div class="card" style="margin-bottom:14px"><h3>Generation ${esc(g)}</h3><div class="tree">${db.people.filter(p=>(p.generation||'Unspecified')===g).map(p=>`<div class="treeCard"><strong>${esc(displayName(p))}</strong><small>${esc(p.dob||'Date unknown')}${p.deceased?' · In memoriam':''}</small><small>Parents: ${[p.parent1,p.parent2].filter(Boolean).map(pname).map(esc).join(' & ')||'Not yet linked'}</small><small>Partner: ${p.spouse?esc(pname(p.spouse)):'Not linked'}</small><button class="btn tiny" style="margin-top:7px" onclick="personForm('${p.id}')">Edit connections</button></div>`).join('')}</div></div>`).join('')||'<div class="card empty">Your family tree will grow here.</div>'}`}
function households(){return `${title('Households & membership','Separate family units from genealogy. Manage annual dues and gift preferences.',`<button class="btn primary" onclick="houseForm()">+ Add household</button>`)}<div class="toolbar">${yeartool()}<span class="muted">Annual family membership · ${money(db.settings.annualDues)} per household</span></div><div class="stats">${stat('Total households',db.households.length,'Registered family units')}${stat('Paid in full',db.households.filter(h=>paid(h.id)>=db.settings.annualDues).length,'For '+year)}${stat('Fees collected',money(sum(db.dues.filter(d=>d.year===year),'amount')),'Membership records')}${stat('Outstanding',money(db.households.reduce((s,h)=>s+Math.max(0,db.settings.annualDues-paid(h.id)),0)),'Based on full dues')}</div><div class="card tablewrap"><table><thead><tr><th>Family unit</th><th>Members</th><th>Gift preference</th><th>Paid</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.households.map(h=>`<tr><td><b>${esc(h.name)}</b></td><td>${memberCount(h)}</td><td>${esc(h.gift||'Grocery')}</td><td>${money(paid(h.id))}</td><td><span class="pill ${paid(h.id)>=db.settings.annualDues?'':'warn'}">${paid(h.id)>=db.settings.annualDues?'Paid':'Pending'}</span></td><td><button class="btn tiny" onclick="dueForm('${h.id}')">+ Payment</button> <button class="btn tiny" onclick="houseForm('${h.id}')">Edit</button></td></tr>`).join('')||'<tr><td class="empty" colspan="6">Add households and assign members in the directory.</td></tr>'}</tbody></table></div>`}
function event(){let r=db.rsvps.filter(x=>x.year===year),attend=r.filter(x=>x.status==='Attending'),gifts=eligiblePeople().filter(p=>eventRSVP(p.id)==='Attending');return `${title('Annual Family Day','RSVPs, household gifts, and children’s cash gifts in one place.',`<button class="btn primary" onclick="rsvpForm()">+ Record RSVP</button>`)}<div class="toolbar">${yeartool()}<span class="muted">Eligibility estimated as of December 1, ${year} · age ${db.settings.childAge} or under / PWD</span></div><div class="stats">${stat('Confirmed guests',attend.length,'Individual confirmed RSVPs')}${stat('Maybe',countStatus('Maybe'),'Awaiting final response')}${stat('Eligible recipients',eligiblePeople().length,'All eligible family members')}${stat('Cash gifts estimate',money(gifts.length*db.settings.childGift),'Confirmed eligible attendees only')}</div><div class="grid2"><div class="card"><div class="cardheader"><h3>RSVP tracker</h3><span class="muted">${r.length} responses</span></div><div class="tablewrap"><table><thead><tr><th>Person</th><th>Status</th><th>Gift eligible</th><th></th></tr></thead><tbody>${r.map(x=>{let p=db.people.find(t=>t.id===x.personId);return `<tr><td>${esc(p?.name||'Unknown')}</td><td><span class="pill ${x.status==='Attending'?'':x.status==='Maybe'?'warn':'muted'}">${esc(x.status)}</span></td><td>${p&&eligible(p)?'Yes':'No'}</td><td><button class="btn tiny" onclick="rsvpForm('${x.id}')">Edit</button></td></tr>`}).join('')||'<tr><td colspan="4" class="empty">No RSVPs recorded.</td></tr>'}</tbody></table></div></div><div class="card"><h3>Distribution planning</h3><div class="minirow"><span>Households · Grocery preference</span><b>${db.households.filter(h=>h.gift==='Grocery').length}</b></div><div class="minirow"><span>Households · Cash preference</span><b>${db.households.filter(h=>h.gift==='Cash').length}</b></div><div class="minirow"><span>Households · Undecided</span><b>${db.households.filter(h=>h.gift==='Undecided').length}</b></div><div class="minirow">< span="5" class="empty">No budget items yet.</td></tr>'}</tbody></table></div><div class="minirow"><strong>Total planned</strong><strong>${money(budgetTotal())}</strong></div></div><div class="card"><div class="cardheader"><h3>Family fund ledger</h3><button class="btn tiny" onclick="ledgerForm()">+ Transaction</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Detail</th><th>Type</th><th>Amount</th><th></th></tr></thead><tbody>${t.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.note)}</td><td><span class="pill ${x.kind==='Income'?'':'warn'}">${esc(x.kind)}</span></td><td>${money(x.amount)}</td><td><button class="btn tiny" onclick="ledgerForm('${x.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No transactions recorded.</td></tr>'}</tbody></table></div></div></div>`}
function awards(){let arr=db.awards.filter(a=>a.schoolYear===awardYear);return `${title('Student recognition','Celebrate every milestone—from graduation and honors to creative and non-academic awards.',`<button class="btn primary" onclick="awardForm()">+ Add recognition</button>`)}<div class="toolbar"><input type="text" style="max-width:160px" aria-label="School year" value="${esc(awardYear)}" onchange="awardYear=this.value;render()"><span class="muted">School year</span></div><div class="stats">${stat('Recognition entries',arr.length,'For '+esc(awardYear))}${stat('Unique students',new Set(arr.map(a=>a.personId)).size,'Recognized children')}${stat('Awards budget',money(sum(arr,'amount')),'Approved cash incentives')}${stat('Transferred',money(sum(arr.filter(a=>a.transferred),'amount')),'Marked as disbursed')}</div><div class="card tablewrap"><table><thead><tr><th>Student</th><th>Level</th><th>Recognition</th><th>Award details</th><th>Cash incentive</th><th>Transferred</th><th></th></tr></thead><tbody>${arr.map(a=>`<tr><td><b>${esc(pname(a.personId))}</b></td><td>${esc(a.level||'—')}</td><td>${esc(a.type)}</td><td style="white-space:normal;min-width:170px">${esc(a.details||'—')}</td><td>${money(a.amount)}</td><td><span class="pill ${a.transferred?'':'warn'}">${a.transferred?'Yes':'Pending'}</span></td><td><button class="btn tiny" onclick="awardForm('${a.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No recognition records for this school year.</td></tr>'}</tbody></table></div>`}

function data(){return `${title('Data & exports','Your records, under your control. Save a backup and bring in existing family names.') }${cloudPanel()}<div class="grid2"><div class="card"><h3>Backup & restore</h3><p class="muted">A JSON backup preserves people, households, RSVP history, budgets, recognition, dues, and all records.</p><div class="toolbar"><button class="btn primary" onclick="exportJSON()">↓ Download full backup</button><label class="btn" for="jsonfile">↑ Restore JSON</label><input type="file" id="jsonfile" accept=".json,application/json" style="display:none" onchange="importJSON(this.files[0]);this.value=''" /></div><p class="tips">Restoring a backup replaces the current data in this browser. Make a backup first.</p></div><div class="card"><h3>Spreadsheet compatibility</h3><p class="muted">Export the family directory to CSV or import a basic names list using your existing spreadsheet.</p><div class="toolbar"><button class="btn" onclick="exportCSV()">↓ Export directory CSV</button><label class="btn" for="csvfile">↑ Import directory CSV</label><input type="file" id="csvfile" accept=".csv,text/csv" style="display:none" onchange="importCSV(this.files[0]);this.value=''" /></div><p class="tips">Supported headers: Name, Nickname, Birthday, Location, Generation, Household, PWD, Deceased. Parent and spouse links need to be connected afterward.</p></div></div><div class="grid2" style="margin-top:16px"><div class="card"><h3>Family rules</h3><p class="muted">These defaults reflect what you described. Edit them if your family changes its rules.</p><form class="formgrid" onsubmit="event.preventDefault();settingsSave(this)"><label>Membership dues / household (₱)<input name="annualDues" type="number" min="0" step=".01" value="${db.settings.annualDues}"></label><label>Child gift / recipient (₱)<input name="childGift" type="number" min="0" step=".01" value="${db.settings.childGift}"></label><label>Maximum child age (inclusive)<input name="childAge" type="number" min="0" max="30" value="${db.settings.childAge}"></label><label>Grocery gift estimate (₱)<input name="groceries" type="number" min="0" value="${db.settings.groceries}"></label><label>Ham gift estimate (₱)<input name="ham" type="number" min="0" value="${db.settings.ham}"></label><div class="full"><button class="btn primary" type="submit">Save family rules</button></div></form></div><div class="card"><h3>Privacy & storage</h3><p class="muted">Your browser keeps a local copy. When you connect and sign in to Firebase, changes are also saved to your private Firestore document. Cloud syncing requires an internet connection and suitable Firebase access rules.</p><div class="boxnote">Family records include birthdays and potentially sensitive PWD information. Do not publish JSON backups, personal information, or authentication credentials in your public GitHub repository. Cloud access is restricted by your Firestore rules, not by hiding the site.</div><button class="btn danger" onclick="clearData()">Clear all browser data</button></div></div>`}
function openModal(html){el('modalbody').innerHTML=html;el('modal').showModal()}function closeModal(){el('modal').close()}function formHeader(h,sub){return `<h2>${h}</h2><p>${sub}</p>`}function buttons(type,id){return `<div class="foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button>${id?`<button type="button" class="btn danger" onclick="removeRecord('${type}','${id}')">Delete</button>`:''}<button class="btn primary" type="submit">Save changes</button></div>`}function record(type,id,form,extra={}){const o=Object.fromEntries(new FormData(form).entries());for(let k of Object.keys(o))if(['amount','qty','price','generation'].includes(k)&&o[k]!=='' )o[k]=Number(o[k]);Object.assign(o,extra);if(id){const i=db[type].findIndex(x=>x.id===id);if(i<0)return;db[type][i]={...db[type][i],...o}}else db[type].push({id:window.crypto?.randomUUID?.()||'r'+Date.now()+Math.random(),...o});closeModal();save();notice('Saved successfully')}function removeRecord(type,i){if(!confirm('Delete this record? This cannot be undone unless you have a backup.'))return;db[type]=db[type].filter(x=>x.id!==i);closeModal();save();notice('Record deleted')}function notice(s){const e=el('toast');e.textContent=s;e.hidden=false;clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>e.hidden=true,3000)}function nameParts(p){return [p.firstNames,p.currentMiddleName||p.birthMiddleName,p.currentSurname||p.birthSurname,p.suffix].map(v=>(v||'').trim()).filter(Boolean).join(' ')}
function birthName(p){return [p.firstNames,p.birthMiddleName,p.birthSurname,p.suffix].map(v=>(v||'').trim()).filter(Boolean).join(' ')}
function displayName(p){return (p.firstNames?nameParts(p):'')||p.name||'Unnamed relative'}
function isStructured(p){return !!(p.firstNames||p.birthMiddleName||p.birthSurname||p.currentMiddleName||p.currentSurname)}
function personForm(i=''){let p=db.people.find(x=>x.id===i)||{},opts=(selected)=>`<option value="">Not linked</option>`+db.people.filter(x=>x.id!==i).map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(displayName(x))}</option>`).join('');openModal(`${formHeader(i?'Edit family member':'Add family member','Names at birth stay on record even when legal names change.')}<form onsubmit="event.preventDefault();personSave('${i}',this)"><div class="formgrid"><div class="full" style="border-bottom:1px solid var(--line);padding:4px 0 9px"><strong>Identity and names</strong><div class="muted" style="font-size:12px;margin-top:4px">Keep both middle and surname even when they match (e.g., Co Co or Torres Torres).</div></div>${!isStructured(p)&&p.name?`<div class="full" style="padding:11px 13px;background:var(--panel,#f7f3ed);border-radius:8px"><div class="muted" style="font-size:12px">Existing name (preserved until you fill in the structured fields)</div><strong>${esc(displayName(p))}</strong></div>`:''}<label class="full">First name(s) ${i?'':'*'}<input name="firstNames" ${i?'':'required'} placeholder="e.g. Janis Christine" value="${esc(p.firstNames||'')}"></label><label>Middle name at birth<input name="birthMiddleName" placeholder="Maternal surname at birth" value="${esc(p.birthMiddleName||'')}"></label><label>Birth surname<input name="birthSurname" placeholder="Paternal surname at birth" value="${esc(p.birthSurname||'')}"></label><label>Current legal middle name<input name="currentMiddleName" placeholder="Leave blank if unchanged" value="${esc(p.currentMiddleName||'')}"></label><label>Current legal surname<input name="currentSurname" placeholder="Leave blank if unchanged" value="${esc(p.currentSurname||'')}"></label><label>Suffix<input name="suffix" placeholder="Jr., Sr., III, etc." value="${esc(p.suffix||'')}"></label><label>Nickname<input name="nickname" value="${esc(p.nickname||'')}"></label><div class="full muted" style="font-size:12px">Leave current name fields blank to use the corresponding birth name. No automatic surname changes occur when marital status changes.</div><div class="full" style="border-top:1px solid var(--line);padding-top:12px"><strong>Family information</strong></div><label>Birthday<input name="dob" type="date" value="${esc(p.dob||'')}"></label><label>Generation<input type="number" name="generation" min="1" max="15" value="${esc(p.generation||'')}"></label><label>Location<input name="location" value="${esc(p.location||'')}"></label><label>Household<select name="household">${houseOptions(p.household,'No household assigned')}</select></label><label>Parent 1<select name="parent1">${opts(p.parent1)}</select></label><label>Parent 2<select name="parent2">${opts(p.parent2)}</select></label><label>Spouse / partner<select name="spouse">${opts(p.spouse)}</select></label><label>Death date (if applicable)<input type="date" name="deathDate" value="${esc(p.deathDate||'')}"></label><label class="check"><input type="checkbox" name="pwd" ${p.pwd?'checked':''}> PWD eligible (private)</label><label class="check"><input type="checkbox" name="deceased" ${p.deceased?'checked':''}> Deceased</label><label class="full">Notes<textarea name="notes" rows="2">${esc(p.notes||'')}</textarea></label></div>${buttons('people',i)}</form>`)}
function personSave(i,f){const o=Object.fromEntries(new FormData(f).entries());for(const k of ['firstNames','birthMiddleName','birthSurname','currentMiddleName','currentSurname','suffix'])o[k]=(o[k]||'').trim();const existing=db.people.find(p=>p.id===i);if(!o.firstNames&&!existing?.name){alert('Please enter first name(s).');return}o.pwd=f.elements.pwd.checked;o.deceased=f.elements.deceased.checked;if(o.firstNames){o.name=displayName(o)}else if(existing){o.name=existing.name}record('people',i,f,o)}
function houseForm(i=''){let h=db.households.find(x=>x.id===i)||{};openModal(`${formHeader(i?'Edit household':'Add household','Family units are used for dues, groceries, and cash gift distribution.')}<form onsubmit="event.preventDefault();record('households','${i}',this)"><div class="formgrid"><label class="full">Household / family name *<input name="name" required value="${esc(h.name||'')}"></label><label>Gift preference<select name="gift">${['Grocery','Cash','Undecided','None'].map(x=>`<option ${h.gift===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Location<input name="location" value="${esc(h.location||'')}"></label><label class="full">Notes<textarea name="notes" rows="2">${esc(h.notes||'')}</textarea></label></div>${buttons('households',i)}</form>`)}function dueForm(h){openModal(`${formHeader('Record membership payment',esc(hname(h))+' · '+year)}<form onsubmit="event.preventDefault();record('dues','',this,{householdId:'${h}',year})"><div class="formgrid"><label>Amount paid (₱)<input type="number" step=".01" min="0" required name="amount" value="${db.settings.annualDues-paid(h)}"></label><label>Date paid<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="full">Notes<input name="notes" placeholder="GCash, cash, bank transfer, etc."></label></div>${buttons('dues','')}</form>`)}function rsvpForm(i=''){let r=db.rsvps.find(x=>x.id===i)||{};openModal(`${formHeader(i?'Edit RSVP':'Record RSVP','Attendance for Torres Family Day '+year)}<form onsubmit="event.preventDefault();record('rsvps','${i}',this,{year})"><div class="formgrid"><label>Family member *<select name="personId" required>${peopleOptions(r.personId)}</select></label><label>Status<select name="status">${['Attending','Maybe','Not attending'].map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="full">Notes<input name="notes" value="${esc(r.notes||'')}" placeholder="Guest, special arrangements, etc."></label></div>${buttons('rsvps',i)}</form>`)}function budgetForm(i=''){let b=db.budgets.find(x=>x.id===i)||{};openModal(`${formHeader(i?'Edit budget item':'New budget item','Plan Family Day '+year+' expenses.')}<form onsubmit="event.preventDefault();budgetSave('${i}',this)"><div class="formgrid"><label class="full">Budget item *<input required name="name" value="${esc(b.name||'')}" placeholder="Venue, grocery packs, cash gifts, games..."></label><label>Quantity<input name="qty" min="0" type="number" value="${b.qty??1}"></label><label>Unit cost (₱)<input name="price" step=".01" type="number" min="0" value="${b.price??0}"></label><label class="full">Notes<input name="notes" value="${esc(b.notes||'')}"></label></div>${buttons('budgets',i)}</form>`)}function budgetSave(i,f){let o=Object.fromEntries(new FormData(f).entries());o.qty=Number(o.qty);o.price=Number(o.price);record('budgets',i,f,{year,total:o.qty*o.price})}function ledgerForm(i=''){let x=db.ledger.find(x=>x.id===i)||{};openModal(`${formHeader(i?'Edit transaction':'Record transaction','Keep a running balance of the family fund.')}<form onsubmit="event.preventDefault();record('ledger','${i}',this,{year})"><div class="formgrid"><label>Date<input type="date" required name="date" value="${esc(x.date||new Date().toISOString().slice(0,10))}"></label><label>Type<select name="kind"><option ${x.kind==='Income'?'selected':''}>Income</option><option ${x.kind==='Expense'?'selected':''}>Expense</option></select></label><label class="full">Description *<input required name="note" value="${esc(x.note||'')}"></label><label>Amount (₱)<input required name="amount" type="number" min="0" step=".01" value="${x.amount??''}"></label><label>Paid by / received from<input name="source" value="${esc(x.source||'')}"></label></div>${buttons('ledger',i)}</form>`)}function awardForm(i=''){let a=db.awards.find(x=>x.id===i)||{};openModal(`${formHeader(i?'Edit recognition':'Record student recognition','A student may have multiple award entries in the same year.')}<form onsubmit="event.preventDefault();awardSave('${i}',this)"><div class="formgrid"><label>Student *<select name="personId" required>${peopleOptions(a.personId)}</select></label><label>School year<input name="schoolYear" required value="${esc(a.schoolYear||awardYear)}"></label><label>Grade / level<input name="level" value="${esc(a.level||'')}"></label><label>Category<select name="type">${['Graduated','Completed / Moved up','Academic award','Non-academic award','Special award','Other'].map(x=>`<option ${a.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="full">Awards / details<textarea name="details" rows="3">${esc(a.details||'')}</textarea></label><label>Cash incentive (₱)<input required type="number" name="amount" min="0" step=".01" value="${a.amount??0}"></label><label class="check"><input name="transferred" type="checkbox" ${a.transferred?'checked':''}> Paid / transferred</label><label class="full">Remarks<input name="notes" value="${esc(a.notes||'')}"></label></div>${buttons('awards',i)}</form>`)}function awardSave(i,f){record('awards',i,f,{transferred:f.elements.transferred.checked})}function gameForm(i=''){let g=db.games.find(x=>x.id===i)||{};openModal(`${formHeader(i?'Edit game / prize':'Add game or prize','Track quantities, costs, props, and inspiration links.')}<form onsubmit="event.preventDefault();record('games','${i}',this,{year})"><div class="formgrid"><label>Type<select name="type">${['Game','Prize','Raffle','Supplies'].map(x=>`<option ${g.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Name *<input required name="name" value="${esc(g.name||'')}"></label><label>Quantity<input type="number" min="0" name="qty" value="${g.qty??1}"></label><label>Unit price (₱)<input type="number" min="0" step=".01" name="price" value="${g.price??0}"></label><label class="full">Details / props / mechanics<textarea name="details" rows="2">${esc(g.details||'')}</textarea></label><label class="full">Source URL<input name="link" type="text" value="${esc(g.link||'')}"></label></div>${buttons('games',i)}</form>`)}function addGiftEstimates(){let items=[{name:'Children / PWD cash gifts',qty:eligiblePeople().length,price:db.settings.childGift},{name:'Grocery family packages',qty:db.households.filter(h=>h.gift==='Grocery').length,price:db.settings.groceries},{name:'Ham family packages',qty:db.households.filter(h=>h.gift==='Grocery').length,price:db.settings.ham}];if(!confirm('Add or update three estimated gift budget lines for '+year+'?'))return;for(let x of items){let old=db.budgets.find(b=>b.year===year&&b.name===x.name);if(old)Object.assign(old,{qty:x.qty,price:x.price,total:x.qty*x.price});else db.budgets.push({...x,id:id(),year,total:x.qty*x.price})}save();notice('Gift estimates added to budget')}function settingsSave(f){let o=Object.fromEntries(new FormData(f).entries());for(let k in o)o[k]=Number(o[k]);Object.assign(db.settings,o);save();notice('Family rules updated')}function quickAdd(){({overview:personForm,people:personForm,tree:personForm,households:houseForm,event:rsvpForm,finance:budgetForm,awards:awardForm,games:gameForm,data:personForm})[page]()}function setSearch(v){search=v;const input=document.querySelector('.toolbar input');let start=input?.selectionStart;render();let next=document.querySelector('.toolbar input');if(next){next.focus();try{next.setSelectionRange(start,start)}catch(e){}}}function printReport(){window.print()}function download(name,text,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}function exportJSON(){download('torres-family-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'torres-family-hub',version:1,exportedAt:new Date().toISOString(),data:db},null,2),'application/json')}function exportCSV(){const h=['Name','First Names','Birth Middle Name','Birth Surname','Current Middle Name','Current Surname','Suffix','Nickname','Birthday','Location','Generation','Household','PWD','Deceased'],rows=db.people.map(p=>[displayName(p),p.firstNames,p.birthMiddleName,p.birthSurname,p.currentMiddleName,p.currentSurname,p.suffix,p.nickname,p.dob,p.location,p.generation,hname(p.household)==='Unassigned'?'':hname(p.household),p.pwd?'Yes':'No',p.deceased?'Yes':'No']);download('torres-family-directory.csv',String.fromCharCode(65279)+[h,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}async function importJSON(file){if(!file)return;try{let x=JSON.parse(await file.text()),d=x.data||x;if(!Array.isArray(d.people)||!Array.isArray(d.households)||!Array.isArray(d.ledger))throw Error('Invalid backup structure');if(!confirm('Replace all current browser records with this backup?'))return;db={...initial(),...d,settings:{...initial().settings,...d.settings}};save();notice('Backup restored')}catch(e){alert('Could not import backup: '+e.message)}}function parseCSV(t){let rows=[],row=[],v='',quotes=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quotes&&t[i+1]==='"'){v+='"';i++}else quotes=!quotes}else if(c===','&&!quotes){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quotes){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}async function importCSV(file){if(!file)return;try{let rows=parseCSV((await file.text()).replace(/^\ufeff/,''));if(rows.length<2)throw Error('CSV has no records');let head=rows.shift().map(x=>x.trim().toLowerCase()),idx=n=>head.indexOf(n.toLowerCase()),col=(r,...names)=>{for(let n of names){let j=idx(n);if(j>=0)return (r[j]||'').trim()}return ''};if(idx('Name')<0&&idx('First Names')<0)throw Error('Missing Name or First Names header');let count=0;for(let r of rows){let firstNames=col(r,'First Names','First Name'),birthMiddleName=col(r,'Birth Middle Name','Middle Name at Birth'),birthSurname=col(r,'Birth Surname'),currentMiddleName=col(r,'Current Middle Name'),currentSurname=col(r,'Current Surname'),suffix=col(r,'Suffix');let name=col(r,'Name')||[firstNames,currentMiddleName||birthMiddleName,currentSurname||birthSurname,suffix].filter(Boolean).join(' ');if(!name&&!firstNames)continue;let h=col(r,'Household'),house=db.households.find(x=>x.name.toLowerCase()===h.toLowerCase());if(h&&!house){house={id:id(),name:h,gift:'Grocery'};db.households.push(house)}let dob=col(r,'Birthday','Date of Birth');if(dob&&!/^\d{4}-\d\d-\d\d$/.test(dob)){const d=new Date(dob);dob=isNaN(d)?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}db.people.push({id:id(),name,firstNames,birthMiddleName,birthSurname,currentMiddleName,currentSurname,suffix,nickname:col(r,'Nickname'),dob,location:col(r,'Location'),generation:col(r,'Generation'),household:house?.id||'',pwd:/^(yes|true|1)$/i.test(col(r,'PWD')),deceased:/^(yes|true|1)$/i.test(col(r,'Deceased'))});count++}save();alert(`Imported ${count} people. Please check possible duplicate names and dates.`)}catch(e){alert('Could not import CSV: '+e.message)}}function clearData(){if(prompt('To clear every record in this browser, type DELETE:')!=='DELETE')return;db=initial();save();notice('Browser records cleared')}
/* Build 3: opt-in Firebase Authentication + Firestore sync, no database access until owner signs in. */
const FB_CONFIG_KEY='torres-family-firebase-public-config';
let fbApp=null,fbAuth=null,fbStore=null,fbUser=null,cloudReady=false,cloudState='Browser only',saveSeq=0,cloudWriteQueue=Promise.resolve(),cloudLoading=false;
function storedConfig(){try{return JSON.parse(localStorage.getItem(FB_CONFIG_KEY)||'null')}catch(e){return null}}
function cloudDoc(){if(!fbUser||!fbStore)throw Error('Sign in first');return fbStore.collection('users').doc(fbUser.uid).collection('private').doc('familyHub')}
function hasLocalRecords(){return ['people','households','dues','rsvps','budgets','ledger','awards','games'].some(k=>db[k]?.length)}
function setCloudState(v){cloudState=v;refreshCloudIndicator();let t=el('cloudStatusText');if(t)t.textContent=v}
function refreshCloudIndicator(){let e=el('syncChip');if(e){e.textContent=cloudState;e.classList.toggle('warning',cloudState.includes('failed')||cloudState.includes('error')||cloudState.includes('Offline'))}}
function cloudPanel(){let cfg=storedConfig(),signed=!!fbUser;return `<div class="card" style="margin-bottom:16px"><div class="cardheader"><h3>Firebase cloud storage</h3><span class="pill ${signed?'':'warn'}">${signed?'Connected':'Not connected'}</span></div><p class="muted">Sync your family records across devices with Firebase Authentication and Cloud Firestore. You keep local backups as well.</p><p><strong id="cloudStatusText">${esc(cloudState)}</strong>${signed?` · Signed in as ${esc(fbUser.email||fbUser.uid)}`:''}</p><div class="toolbar"><button class="btn" onclick="showFirebaseSetup()">${cfg?'Edit Firebase settings':'Connect Firebase project'}</button>${cfg&&!signed?'<button class="btn primary" onclick="showCloudSignIn()">Sign in</button>':''}${signed?'<button class="btn" onclick="cloudPullConfirm()">Load cloud records</button><button class="btn" onclick="cloudPushConfirm()">Upload browser records</button><button class="btn danger" onclick="cloudSignOut()">Sign out</button>':''}</div><div class="boxnote"><strong>Privacy:</strong> Your public GitHub Pages website contains no embedded family records. Firebase rules must allow only your signed-in account to read/write its records. Your Firebase web configuration is a public app identifier, not a secret password. Each account's data is private to that account; this build is not a multi-admin shared database.</div><p class="tips">Do not use the app on two devices at the same time: Build 3 saves a single snapshot, so the last saved device may overwrite changes from another device. Download JSON backups regularly.</p></div>`}
function showFirebaseSetup(){let c=storedConfig()||{};openModal(`<h2>Connect your Firebase project</h2><p>Firebase Console → Project settings → Your apps → Web app → SDK setup and configuration. Copy the values from <strong>firebaseConfig</strong>; do not enter any service account private key.</p><form onsubmit="event.preventDefault();saveFirebaseSetup(this)"><div class="formgrid">${['apiKey','authDomain','projectId','appId','messagingSenderId'].map(k=>`<label class="${k==='projectId'?'':'full'}">${k}<input name="${k}" ${['apiKey','authDomain','projectId','appId'].includes(k)?'required':''} value="${esc(c[k]||'')}"></label>`).join('')}</div><div class="foot"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save connection settings</button></div></form>`)}
function saveFirebaseSetup(form){let c=Object.fromEntries(new FormData(form).entries());if(!c.authDomain.includes('.'))return alert('Please enter the full Firebase authDomain');localStorage.setItem(FB_CONFIG_KEY,JSON.stringify(c));closeModal();if(fbAuth)fbAuth.signOut().catch(()=>{});fbApp=null;fbAuth=null;fbStore=null;fbUser=null;cloudReady=false;setCloudState('Connecting…');initCloud()}
function showCloudSignIn(){if(!fbAuth)return alert('Configure Firebase first, then ensure you have internet access.');openModal(`<h2>Sign in to Torres Family Hub</h2><p>Use an Email/Password account already created in Firebase Authentication. No public sign-up is offered.</p><form onsubmit="event.preventDefault();cloudSignIn(this)"><div class="formgrid"><label class="full">Email<input type="email" required name="email" autocomplete="username"></label><label class="full">Password<input type="password" required name="password" autocomplete="current-password"></label></div><div class="foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Sign in</button></div></form>`)}
async function cloudSignIn(form){try{let v=Object.fromEntries(new FormData(form).entries());await fbAuth.signInWithEmailAndPassword(v.email,v.password);closeModal()}catch(e){alert('Firebase sign-in failed: '+e.message)}}
async function cloudSignOut(){if(!fbAuth)return;await fbAuth.signOut();cloudReady=false;fbUser=null;setCloudState('Browser only · signed out');render()}
function mergeCloudDb(d){if(!d||!Array.isArray(d.people)||!Array.isArray(d.households))throw Error('Cloud document is missing expected records');db={...initial(),...d,settings:{...initial().settings,...d.settings}};localStorage.setItem(KEY,JSON.stringify(db));render()}
async function readCloud(){let snap=await cloudDoc().get({source:'server'});return snap.exists?snap.data():null}
async function cloudPullConfirm(){if(!fbUser)return;let sure=confirm('Download cloud records and REPLACE records in this browser? Please export a JSON backup first.');if(!sure)return;try{cloudReady=false;setCloudState('Loading cloud…');const d=await readCloud();if(!d){setCloudState('No cloud data yet');alert('No cloud records found. You can upload your browser records first.');return}mergeCloudDb(d.payload);cloudReady=true;setCloudState('Cloud loaded · synced');notice('Cloud records loaded')}catch(e){setCloudState('Cloud load failed');alert(e.message)}}
async function cloudPushConfirm(){if(!fbUser)return;const sure=confirm('REPLACE the current cloud copy with all records in this browser? Export a backup before continuing.');if(!sure)return;cloudReady=true;saveSeq++;queueCloudSave();notice('Cloud upload queued')}
function queueCloudSave(){if(!cloudReady||!fbUser)return;const current=fbUser.uid,payload=JSON.parse(JSON.stringify(db)),version=++saveSeq;setCloudState('Saving to cloud…');cloudWriteQueue=cloudWriteQueue.catch(()=>{}).then(async()=>{if(!cloudReady||!fbUser||fbUser.uid!==current)return;try{await cloudDoc().set({payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),schemaVersion:2});if(version===saveSeq)setCloudState('Cloud saved · synced')}catch(e){setCloudState('Cloud save failed');console.error('Firebase sync failed',e);alert('Cloud save failed: '+e.message+'\nYour changes are still saved in this browser.')}})}
function initCloud(){let c=storedConfig();if(!c){setCloudState('Browser only · connect Firebase');return}if(typeof firebase==='undefined'){setCloudState('Offline · Firebase scripts unavailable');return}try{fbApp=firebase.apps.find(a=>a.name==='torresFamily')||firebase.initializeApp(c,'torresFamily');fbAuth=fbApp.auth();fbStore=fbApp.firestore();fbAuth.onAuthStateChanged(async user=>{fbUser=user;cloudReady=false;if(!user){setCloudState('Firebase configured · sign in');render();return}setCloudState('Checking cloud records…');render();try{let d=await readCloud();if(fbUser?.uid!==user.uid)return;if(!d){setCloudState('Signed in · no cloud copy yet');render();if(hasLocalRecords()&&confirm('No cloud copy exists. Upload your current browser records to Firebase?'))cloudPushConfirm();return}if(hasLocalRecords()){if(confirm('Cloud records were found. Load the cloud copy into this browser?\n\nOK = replace browser data with cloud data. Cancel = keep browser data unchanged until you choose an action.')){mergeCloudDb(d.payload);cloudReady=true;setCloudState('Cloud loaded · synced')}else{setCloudState('Connected · choose Load or Upload in Data & exports')}}else{mergeCloudDb(d.payload);cloudReady=true;setCloudState('Cloud loaded · synced')}}catch(e){setCloudState('Cloud read failed');console.error(e);alert('Cloud read failed: '+e.message+'\nCheck Firestore rules and Firebase Authentication.')}render()});}catch(e){setCloudState('Firebase configuration error');console.error(e)}}
window.addEventListener('load',initCloud);

render();
</script></body></html>
