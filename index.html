/* Build 7: adaptive layout, accessible household overview */
html,body{max-width:100%;overflow-x:hidden}
.shell{width:100%;min-width:0}
main{min-width:0;max-width:none;overflow-wrap:anywhere}
#app{min-width:0;width:100%}
.headingline{align-items:flex-start}
.headingline .desc{max-width:65ch}
.directory-table{width:100%;overflow-x:auto;overscroll-behavior-x:contain}

.household-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px;margin:16px 0}

.household-card .house-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}
.household-detail{padding:0;overflow:hidden;margin-bottom:22px;border-color:#bd9c86}
.household-detail-head{background:linear-gradient(115deg,#710014,#4d0712);padding:24px;color:#fff;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.household-detail-head h2{font:28px Georgia,serif;margin:5px 0}
.household-detail-head p{color:#f4dfe0;margin:0;font-size:12px}
.household-detail-head .btn{background:#fff9}
.household-detail-body{padding:20px}
.household-member-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:11px;margin:14px 0}

.household-member strong{display:block;font-size:13px;overflow-wrap:anywhere}
.household-member .member-meta{font-size:11px;color:var(--muted);margin:5px 0 11px}
.household-member .btn{max-width:100%}

dialog.member-editor-dialog{width:min(1080px,calc(100vw - 32px));max-width:1080px;max-height:min(94vh,1000px);padding:0;border:1px solid #e1d2c4;border-radius:19px;box-shadow:0 32px 95px #311a1936;overflow:auto;background:#faf7f2}

.mp-inner{padding:0 18px 19px}
.member-editor .formgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 16px}

.member-editor .formgrid label:not(.member-switch) span{display:block}
.member-editor .formgrid input:not([type=checkbox]):not([type=file]),.member-editor .formgrid select,.member-editor .formgrid textarea{background:#fff;color:#272322;border:1px solid #d8cdc4;border-radius:7px;padding:11px 12px;min-height:41px;font:13px Arial,Helvetica,sans-serif;outline-offset:2px}

.member-switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch-track{display:block;width:37px;height:21px;border-radius:22px;background:#d7cbc4;position:relative;transition:background .15s}
.switch-track:after{content:'';display:block;width:15px;height:15px;border-radius:50%;background:white;position:absolute;top:3px;left:3px;box-shadow:0 1px 3px #0002;transition:left .15s}

.member-switch input:focus-visible+.switch-track{outline:3px solid #d8a6ac;outline-offset:2px}
.member-switch small{font-size:10px;color:#956c70}

function eventSortValue(p,key){
 const rec=eventRecord(p.id)||{};
 switch(key){
 case 'household':return p.household?hname(p.household):null;
 case 'name':return p.nickname||displayName(p);
 case 'rsvp':return eventEffectiveStatus(p);
 case 'attended':return Number(Boolean(rec.actualAttended));
 case 'gift':return Number(Boolean(eventGiftEligible(p)))*2+Number(Boolean(eventGiftEligible(p)&&rec.cashReceived));
 case 'raffle':return Number(Boolean(rec.raffleWon));
 case 'game':return Number(Boolean(rec.gameWon));
 case 'birthday':{if(!p.dob)return null;const x=p.dob.split('-');return x.length===3?Number(x[1])*100+Number(x[2]):null}

function sortEventMembers(members){let dir=eventSortDirection==='desc'?-1:1;return [...members].sort((a,b)=>{
 let av=eventSortValue(a,eventSortKey),bv=eventSortValue(b,eventSortKey);
 let missing=v=>v==null||v===''||(typeof v==='number'&&!Number.isFinite(v));
 if(missing(av)!==missing(bv))return missing(av)?1:-1;
 let primary=typeof av==='number'&&typeof bv==='number'?av-bv:String(av??'').localeCompare(String(bv??''),undefined,{sensitivity:'base',numeric:true});
 if(primary)return primary*dir;
 // Keep household groups readable even when names/nicknames are shared.
 let h=String(hname(a.household)).localeCompare(String(hname(b.household)),undefined,{sensitivity:'base',numeric:true});
 if(eventSortKey==='household'&&h)return h*dir;
 return String(a.nickname||displayName(a)).localeCompare(String(b.nickname||displayName(b)),undefined,{sensitivity:'base',numeric:true})||String(a.id).localeCompare(String(b.id));
 });}
function setEventSort(key,dir){if(!eventSortOptions.some(([k])=>k===key))return;eventSortKey=key;if(dir==='asc'||dir==='desc')eventSortDirection=dir;const top=window.scrollY;const scroll=document.querySelector('#eventRosterSection .event-scroll');const within=scroll?.scrollTop||0;render();window.scrollTo(0,top);const next=document.querySelector('#eventRosterSection .event-scroll');if(next)next.scrollTop=within;}

     (eventFilter==='responded'&&['Attending','Maybe','Not attending'].includes(eventRecord(p.id)?.status))||
     (eventFilter==='maybe'&&eventEffectiveStatus(p)==='Maybe')||
     (eventFilter==='notattending'&&eventEffectiveStatus(p)==='Not attending')||
     (eventFilter==='eligible'&&eventGiftEligible(p))||
     (eventFilter==='cash'&&eventGiftEligible(p)&&eventRecord(p.id)?.cashReceived)||
     (eventFilter==='raffle'&&eventRecord(p.id)?.raffleWon)||
     (eventFilter==='game'&&eventRecord(p.id)?.gameWon)||
     (eventFilter==='pending'&&eventEffectiveStatus(p)==='No response'))
   );
 const dataRows=people.map(p=>{
  const r=eventRecord(p.id)||{},canGift=eventGiftEligible(p),rstatus=eventEffectiveStatus(p),n=p.nickname||displayName(p);

 if(f.honors)components.push({label:'With Honors',amount:500});
 if(f.academic)components.push({label:'Academic award',amount:500});
 if(f.nonAcademic)components.push({label:'Non-academic award',amount:250});

 // All three special awards are separate recognitions; neurodiverse support is once per school year.

async function setPaymentQr(input){let file=input.files?.[0];if(!file)return;let row=input.closest('.payment-entry');try{if(file.size>4*1024*1024)throw Error('Please choose an image under 4 MB.');let im=new Image(),objectUrl=URL.createObjectURL(file);try{await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=objectUrl});let canvas=document.createElement('canvas');let scale=Math.min(1,360/Math.max(im.width,im.height));canvas.width=Math.max(1,Math.round(im.width*scale));canvas.height=Math.max(1,Math.round(im.height*scale));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);let output=canvas.toDataURL('image/png');if(output.length>65000)throw Error('QR is too detailed for the current small-image limit. Please use a simpler or smaller QR screenshot.');let current=[...document.querySelectorAll('[data-pm="qr"]')].filter(x=>x!==row.querySelector('[data-pm="qr"]')).reduce((n,x)=>n+x.value.length,0);if(current+output.length>450000)throw Error('QR attachment storage limit reached. Contact data can still be saved without another image.');row.querySelector('[data-pm="qr"]').value=output;row.querySelector('.qr-preview').innerHTML='<img alt="Uploaded payment QR preview" src="'+output+'">';}finally{URL.revokeObjectURL(objectUrl)}}catch(e){alert('QR image not attached: '+e.message);input.value=''}}
// Parent 1 represents the Torres ancestral line; Parent 2 is a different-gender co-parent.
// Older imported members with an explicit generation but incomplete links remain selectable
// for genealogy reconciliation. No unknown gender is inferred.
function torresLineCandidate(p){
 if(!p||!p.id)return false;
 if(p.foundingRole)return /patriarch/i.test(String(p.foundingRole));
 const seen=new Set(),queue=[p];
 while(queue.length){const cur=queue.shift();if(!cur||seen.has(cur.id))continue;seen.add(cur.id);
  for(const pid of [cur.parent1,cur.parent2]){const parent=db.people.find(x=>x.id===pid);if(!parent)continue;
   if(parent.foundingRole&&/patriarch/i.test(String(parent.foundingRole)))return true;
   queue.push(parent);
  }
 }
 // Imported Torres descendants can have missing links; allow their recorded generation as provisional.
 return Number(p.generation)>=2&&!p.foundingRole;
}

 return '<option value="">Not linked</option>'+people.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(displayName(x))}${kind==='first'&&!torresLineCandidate(x)?' (existing link)':''}</option>`).join('');
}

function validateParentPair(form,personId=''){
 // Read the visible parent dropdowns directly; Parent 2 is genuinely optional.
 const firstSelect=form.querySelector('select[name="parent1"]');
 const secondSelect=form.querySelector('select[name="parent2"]');
 const p1id=String(firstSelect?.value||'').trim();
 const p2id=String(secondSelect?.value||'').trim();
 const editedId=String(personId||'').trim();
 const label=id=>{const record=db.people.find(p=>p.id===id);return record?displayName(record):`record ${id}`};
 if(!p1id&&!p2id)return true;
 if(!p1id){alert('Choose Parent 1 before adding Parent 2. You can leave both blank.');return false;}
 if(editedId&&p1id===editedId){alert(`Cannot save: ${label(p1id)} is selected as their own Parent 1. Choose a different parent.`);return false;}
 if(editedId&&p2id===editedId){alert(`Cannot save: ${label(p2id)} is selected as their own Parent 2. Choose a different parent or leave Parent 2 unlinked.`);return false;}
 if(p2id&&p1id===p2id){alert(`Cannot save: ${label(p1id)} is selected as both parents. Choose a different Parent 2 or leave it unlinked.`);return false;}
 const p1=db.people.find(p=>p.id===p1id);
 if(!p1){alert('Parent 1 no longer exists in the directory. Please select them again.');return false;}
 if(!torresLineCandidate(p1)){alert(`${displayName(p1)} is not currently identified as a Torres descendant. Check Parent 1’s ancestry before saving.`);return false;}
 if(!p2id)return true; // One-parent families / unknown parent are supported.
 const p2=db.people.find(p=>p.id===p2id);
 if(!p2){alert('Parent 2 no longer exists in the directory. Choose another person or leave it unlinked.');return false;}
 if(!['Male','Female'].includes(p1.gender)||!['Male','Female'].includes(p2.gender)){
  alert('To link two parents under the current TorresFam parent-pair rule, set both parents’ genders in their profiles. Alternatively, leave Parent 2 unlinked.');return false;
 }
 if(p1.gender===p2.gender){alert(`The selected parents (${displayName(p1)} and ${displayName(p2)}) do not match the current TorresFam opposite-gender parent-pair rule.`);return false;}
 return true;
}
// Birth order is recorded on the child; each parent can have a different sibling sequence.
function siblingOrderFor(child,parentId){
 const specific=child?.birthOrderByParent?.[parentId];
 if(Number.isInteger(Number(specific))&&Number(specific)>0)return Number(specific);
 // Older records carried one overall value. Use it only when a specific order is absent.
 const legacy=Number(child?.birthOrder);
 return child?.parent1===parentId&&Number.isInteger(legacy)&&legacy>0?legacy:'';
}
function childBirthOrderSummary(p){
 return [p.parent1,p.parent2].filter(Boolean).map(pid=>{
  const parent=db.people.find(x=>x.id===pid);
  const n=p.birthOrderByParent?.[pid];
  return parent&&Number(n)>0?`${esc(parent.nickname||displayName(parent))}: ${esc(n)}`:'';
 }).filter(Boolean).join(' · ');
}

  if(cache.has(p.id))return cache.get(p.id);if(seen.has(p.id))return null;
  const parents=[p.parent1,p.parent2].map(id=>map.get(id)).filter(Boolean);
  if(!parents.length)return Number(p.generation)||null;
  let next=new Set(seen);next.add(p.id);
  let gg=parents.map(x=>gen(x,next)).filter(x=>Number.isFinite(x));
  if(!gg.length)return Number(p.generation)||null;
  if(new Set(gg).size>1){p.generationConflict=true;return Number(p.generation)||null}
  p.generationConflict=false;let v=gg[0]+1;cache.set(p.id,v);return v;

 for(const p of db.people){let v=gen(p);if((p.parent1||p.parent2||p.foundingRole)&&v!=null){if(v!=null)p.generation=v}}
}

function splitQuickName(line, commonSurname){
 let value=String(line||'').trim().replace(/\s+/g,' ');
 if(!value)return null;
 let surname=String(commonSurname||'').trim();
 if(value.includes('|')){let parts=value.split('|');value=(parts[0]||'').trim();surname=(parts.slice(1).join('|')||surname).trim();}
 else if(value.includes(',')){let parts=value.split(',');value=(parts.slice(1).join(',')||'').trim();surname=(parts[0]||surname).trim();}
 else if(!surname){let parts=value.split(' ');if(parts.length<2)return {error:'Enter a surname for '+value+' (or use First names | Surname)'};surname=parts.pop();value=parts.join(' ')}
 if(!value||!surname)return {error:'A first name and surname are required: '+line};
 return {firstNames:value,birthSurname:surname,name:value+' '+surname};

 m=value.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);

 [...parts].sort((x,y)=>y.fraction-x.fraction||x.index-y.index).slice(0,remaining).forEach(p=>p.base++);
 return Object.fromEntries(parts.map(p=>[p.key,p.base]));

 for(const l of lines){const c=procurementLineCosts(l),a=procurementAllocation(l),n=procurementSafe(l.paidQty)+procurementSafe(l.freeQty);for(const k of Object.keys(totals))totals[k]+=c[k];qty.major+=a.major;qty.regular+=a.regular;qty.game+=a.game;qty.unassigned+=n-a.major-a.regular-a.game;qty.distributed+=a.distributedMajor+a.distributedRegular+a.distributedGame;qty.acquired+=n}

function procurementLikelyPrize(x){return /\b(ace hardware|sm store|raffle prizes?|game prizes?|gift prizes?|shopping prizes?)\b/i.test(String(x.note||''));}
function procurementLedgerAudit(){
 const expenses=procurementLedgerRows(),purchaseMap=new Map(procurementTransactions().map(t=>[t.id,t]));
 let confirmed=0,linked=0,unreviewed=0,candidates=0,other=0;
 for(const x of expenses){const n=procurementCents(x.amount);if(x.procurementClass==='prize'){
   const purchase=purchaseMap.get(x.procurementMatchId||'');
   if(purchase){linked+=n;}else confirmed+=n;
 }else if(x.procurementClass==='other')other+=n;
 else {unreviewed+=n;if(procurementLikelyPrize(x))candidates+=n;}}
 const detailed=procurementSummary().spent;
 return {expenses,confirmed,linked,unreviewed,candidates,other,detailed,combined:detailed+confirmed,remaining:procurementSettings().total-detailed-confirmed};
}

/* Build 47 — prize units are assignments of existing line items, never second purchases.
   Each key is event/year + source ledger/procurement + product line + unit position.
   An award is a unit-level overlay so quantities can be reallocated without editing money. */
const prizePurposes=[['unassigned','Unassigned'],['major','Major raffle'],['regular','Regular raffle'],['game','Game prize']];
const prizeAudiences=[['all','All attendees'],['kids','Children only (under 18 on event date)'],['adults','Adults only (18+)']];
function prizeAwards(){db.prizeAwards ||= [];return db.prizeAwards;}
function prizeSourceLines(){
 const ledger=procurementLedgerItemRows().filter(({ledger,item})=>['major','regular','game','unassigned'].includes(item.purpose||'unassigned') && (ledger.procurementClass==='prize'||['major','regular','game'].includes(item.purpose))).map(({ledger,item})=>({source:'ledger',purchaseId:ledger.id,lineId:item.id,name:item.name,qty:Number(item.qty||0),defaultPurpose:item.purpose||'unassigned',legacyRecipient:item.recipient||'',legacyDistributed:Number(item.distributed||0),notes:item.notes||'',costCents:Number(item.totalCents||0),detail:ledger.note||'Family Day ledger expense',date:ledger.date||''}));
 const procure=procurementTransactions().flatMap(t=>(t.lines||[]).map(l=>({source:'procurement',purchaseId:t.id,lineId:l.id,name:l.name,qty:procurementSafe(l.paidQty)+procurementSafe(l.freeQty),defaultPurpose:'unassigned',notes:l.notes||'',costCents:Number(l.costCents||0),detail:t.store||'Procurement purchase',date:t.date||'',allocation:procurementAllocation(l)})));
 return [...ledger,...procure].filter(l=>l.lineId&&l.qty>0);
}
function prizeUnitKey(x,n){return [year,x.source,x.purchaseId,x.lineId,n].join(':');}
function prizeAwardFor(key){return prizeAwards().find(a=>a.key===key&&Number(a.year)===Number(year));}
function prizeDefaultPurpose(line,n){if(line.source==='ledger')return line.defaultPurpose;const a=line.allocation||{};return n<a.major?'major':n<a.major+a.regular?'regular':n<a.major+a.regular+a.game?'game':'unassigned';}
function prizeUnitEntries(){return prizeSourceLines().flatMap(line=>Array.from({length:Math.min(1000,line.qty)},(_,n)=>{const key=prizeUnitKey(line,n),award=prizeAwardFor(key);return {...line,unit:n+1,key,category:award?.category||prizeDefaultPurpose(line,n),audience:award?.audience||'all',recipient:award?.recipient||(line.qty===1&&line.legacyRecipient?.startsWith('person:')?line.legacyRecipient:''),handedOver:award?!!award.handedOver:!!(line.qty===1&&line.legacyDistributed&&line.legacyRecipient?.startsWith('person:')),award:award||null}}));}
function prizeRecipientName(value){if(!value)return 'Not awarded';if(value.startsWith('person:')){const p=db.people.find(p=>p.id===value.slice(7));return p?esc(p.nickname||displayName(p)):'Missing family member';}if(value.startsWith('guest:')){const g=(db.eventGuests||[]).find(g=>g.id===value.slice(6));return g?esc(g.name):'Missing guest';}return 'Unknown recipient';}
function prizeRecipientOpts(selected=''){const people=db.people.filter(eventLocalMember).sort((a,b)=>String(a.nickname||displayName(a)).localeCompare(String(b.nickname||displayName(b))));const guests=eventGuestList();return `<option value="">Not awarded yet</option><optgroup label="Family attendees">${people.map(p=>`<option value="person:${esc(p.id)}" ${selected==='person:'+p.id?'selected':''}>${esc(p.nickname||displayName(p))} — ${esc(displayName(p))}</option>`).join('')}</optgroup><optgroup label="Event guests">${guests.map(g=>`<option value="guest:${esc(g.id)}" ${selected==='guest:'+g.id?'selected':''}>${esc(g.name)} (guest)</option>`).join('')}</optgroup>`;}
function prizeEventDate(){const meta=eventMeta();return String(meta.date||meta.partyDate||year+'-12-01').slice(0,10);}
function prizeEligibleRecipient(value,audience){if(!value)return true;if(value.startsWith('guest:')){const g=eventGuestList().find(g=>'guest:'+g.id===value);return !!g&&audience==='all';}if(!value.startsWith('person:'))return false;const p=db.people.find(p=>'person:'+p.id===value);if(!p||!eventLocalMember(p))return false;if(audience==='all')return true;const y=Number(p.birthYear||String(p.birthday||p.birthDate||'').slice(0,4));if(!y||y<1850)return false;const asOf=prizeEventDate();const a=p.birthday?age(p.birthday,asOf):Number(asOf.slice(0,4))-y;if(!Number.isFinite(a))return false;return audience==='kids'?a<18:a>=18;}
function prizeUnitManager(){
 const lines=prizeSourceLines(),units=prizeUnitEntries();
 const counts=prizePurposes.map(([k,label])=>[label,units.filter(x=>x.category===k).length]);
 const awarded=units.filter(x=>x.recipient).length,handed=units.filter(x=>x.handedOver).length;
 return `<section class="prize-units" aria-label="Individual prize units and winners"><div class="cardheader"><div><h3>Raffle & game prize register</h3><p class="muted">Every purchased unit is one prize. Six dinnerware sets = six separate winners. Assign winners here without adding another purchase or creating a game.</p></div><span class="pill">${units.length} individual prizes</span></div><div class="proc-stats">${counts.map(([label,n])=>`<div><small>${label}</small><b>${n}</b></div>`).join('')}</div><p class="tips">${awarded} assigned to winners · ${handed} handed over. Choose a category, then assign each physical prize to a person or event guest.</p>
 <div class="prize-inventory-list">${lines.map(l=>{
  const related=units.filter(u=>u.source===l.source&&u.lineId===l.lineId&&u.purchaseId===l.purchaseId),give=related.filter(u=>u.recipient).length,done=related.filter(u=>u.handedOver).length;
  const args=`'${esc(l.source)}','${esc(l.purchaseId)}','${esc(l.lineId)}'`;
  return `<article class="proc-purchase prize-product"><div class="cardheader"><div><h3>${esc(l.name)}</h3><small>${esc(l.detail)} · ${esc(l.date)}</small></div><strong>${money(l.costCents/100)}</strong></div>
   <p class="prize-product-summary"><b>${l.qty} physical prize${l.qty===1?'':'s'}</b> · ${give} winner${give===1?'':'s'} · ${done} handed over</p>
   <div class="prize-unit-list">${related.map(u=>`<div class="prize-unit-list-row"><div class="prize-unit-label"><b>Unit ${u.unit} of ${l.qty}</b><small>${esc(prizePurposes.find(p=>p[0]===u.category)?.[1]||'Unassigned')} · ${esc(prizeAudiences.find(p=>p[0]===u.audience)?.[1]||'All attendees')}</small></div><div class="prize-unit-winner"><b>${u.recipient?prizeRecipientName(u.recipient):'No winner assigned'}</b><small>${u.handedOver?'✓ Handed over':u.recipient?'Not handed over':'Available'}</small></div><button class="btn tiny ${u.recipient?'':'primary'}" type="button" onclick="prizeManageLine(${args},${u.unit})">${u.recipient?'Edit assignment':'Assign winner'}</button></div>`).join('')}</div>
   <div class="proc-actions"><button class="btn tiny" type="button" onclick="prizeManageLine(${args})">Manage all ${l.qty} prizes / categories</button></div></article>`;
 }).join('')||'<p class="empty">No purchased prize units found yet. Itemize an existing Family Day expense and set the purpose to raffle or game prize, or record a procurement purchase. No extra payment is needed.</p>'}</div>
 ${units.some(u=>u.recipient)?`<details class="proc-history"><summary>All recorded winners · ${awarded}</summary><div class="prize-winner-list">${units.filter(u=>u.recipient).map(u=>`<div class="proc-line"><span><b>${esc(u.name)}</b> · unit ${u.unit}<small>${prizePurposes.find(p=>p[0]===u.category)?.[1]||'Unassigned'} · ${u.handedOver?'Handed over':'Awaiting handover'}</small></span><b>${prizeRecipientName(u.recipient)}</b></div>`).join('')}</div></details>`:''}</section>`;
}
function prizeManageLine(source,purchaseId,lineId,focusUnit=0){
 const line=prizeSourceLines().find(l=>l.source===source&&l.purchaseId===purchaseId&&l.lineId===lineId);
 if(!line)return alert('This purchase item is no longer available.');
 const units=prizeUnitEntries().filter(u=>u.source===source&&u.purchaseId===purchaseId&&u.lineId===lineId);
 const focus=Number(focusUnit)||0;
 openModal(`${formHeader('Assign individual prizes · '+esc(line.name),`${line.qty} separate prize${line.qty===1?'':'s'} · Original purchase ${money(line.costCents/100)}. Each unit can have a different winner.`)}
 <div class="prize-instructions"><b>How this works:</b> Choose a category for each physical item. When someone wins, select their name on that unit only. Mark handed over when they actually receive it. Other units remain available.</div>
 <div class="prize-bulk-tools"><label>Set category for all unsent units<select id="prizeBulkCategory">${prizePurposes.map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><button class="btn" type="button" onclick="prizeBulkCategory()">Apply to unawarded units</button></div>
 <div class="prize-edit-units">${units.map(u=>`<div class="prize-edit-unit ${focus===u.unit?'prize-edit-focus':''}" id="prize-row-${u.unit}" data-prize-key="${esc(u.key)}"><div class="prize-edit-heading"><strong>Prize ${u.unit} of ${line.qty}</strong><span>${u.recipient?prizeRecipientName(u.recipient):'Available — no winner'}</span></div><div class="formgrid"><label>Category<select data-prize="category">${prizePurposes.map(([k,v])=>`<option value="${k}" ${u.category===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Who can win?<select data-prize="audience">${prizeAudiences.map(([k,v])=>`<option value="${k}" ${u.audience===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="full">Winner of prize ${u.unit}<select data-prize="recipient">${prizeRecipientOpts(u.recipient)}</select></label><label class="event-check full"><input type="checkbox" data-prize="handed" ${u.handedOver?'checked':''}> This specific prize was handed over</label></div></div>`).join('')}</div>
 <p class="tips">Every unit has its own winner and handover status. Assigning a winner never records another expense. Clear the winner only if that unit is being reassigned.</p>
 <div class="foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="button" class="btn primary" onclick="prizeSaveLine('${esc(source)}','${esc(purchaseId)}','${esc(lineId)}')">Save all ${line.qty} individual prizes</button></div>`);
 if(focus)requestAnimationFrame(()=>{const item=document.getElementById('prize-row-'+focus);if(item)item.scrollIntoView({block:'nearest'});});
}
function prizeBulkCategory(){
 const type=el('prizeBulkCategory')?.value;
 if(!prizePurposes.some(x=>x[0]===type))return;
 let changed=0;
 document.querySelectorAll('.prize-edit-unit[data-prize-key]').forEach(row=>{
  const recipient=row.querySelector('[data-prize="recipient"]')?.value;
  const handed=row.querySelector('[data-prize="handed"]')?.checked;
  if(!recipient&&!handed){row.querySelector('[data-prize="category"]').value=type;changed++;}
 });

/* Build 40: Non-destructive relationship audit; partner links are symmetric, parent links live on child records. */
function relationshipAuditRows(){
 const rows=[];
 for(const child of db.people){
  const parentIds=[child.parent1,child.parent2].filter(Boolean);
  if(parentIds.some(pid=>!db.people.some(p=>p.id===pid)))rows.push({child,issue:'Parent record missing',suggestion:null});
  if(parentIds.length===1){
   const parent=db.people.find(p=>p.id===parentIds[0]);
   if(!parent)continue;
   // Only propose co-parent when there is a single partner AND a separate sibling has the confirmed pair.
   const partners=partnerIdsOf(parent);
   const confirmed=partners.filter(pid=>db.people.some(k=>k.id!==child.id&&[k.parent1,k.parent2].includes(parent.id)&&[k.parent1,k.parent2].includes(pid)));
   if(confirmed.length===1)rows.push({child,issue:'Only one parent linked',suggestion:confirmed[0]});
   else rows.push({child,issue:'Only one parent linked',suggestion:null});
  }
  if(child.parent1&&child.parent2&&child.parent1===child.parent2)rows.push({child,issue:'Duplicate parent links',suggestion:null});
 }
 return rows;
}
function relationshipAuditPanel(){
 const rows=relationshipAuditRows(),auto=rows.filter(r=>r.suggestion);
 return `<section class="card" style="margin-bottom:16px"><div class="cardheader"><div><h3>Relationship integrity check</h3><p class="muted">Find incomplete parent links before they affect the family tree. No records are changed automatically.</p></div><span class="pill">${rows.length} to review</span></div><div class="intake-actions"><button class="btn" type="button" onclick="relationshipAuditDetails()">Review links</button>${auto.length?`<button class="btn" type="button" onclick="proposeRelationshipRepair()">Review ${auto.length} suggested co-parent links</button>`:''}</div></section>`;
}
function relationshipAuditDetails(){
 const rows=relationshipAuditRows();
 openModal(`<div class="bulk-editor"><h2>Family relationship audit</h2><p>This is read-only. Review incomplete connections without inventing missing family relationships.</p><div style="max-height:55vh;overflow:auto">${rows.map(r=>`<div class="minirow"><button class="member-name-link" onclick="closeModal();personForm('${r.child.id}')">${esc(displayName(r.child))}</button><span>${esc(r.issue)}${r.suggestion?' · Suggested: '+esc(pname(r.suggestion)):''}</span></div>`).join('')||'<p>All recorded parent links are consistent with the current checks.</p>'}</div><button class="btn" onclick="closeModal()">Close</button></div>`);
}
function proposeRelationshipRepair(){
 const suggested=relationshipAuditRows().filter(r=>r.suggestion);
 if(!suggested.length){notice('No safe co-parent suggestions to review');return}
 const summary=suggested.map(r=>`${displayName(r.child)}: add ${pname(r.suggestion)} as second parent`).join('\n');
 if(!confirm('Review these proposed co-parent links. They are inferred from an existing sibling with the same confirmed parent pair.\n\n'+summary+'\n\nApply these changes? Export a backup first if you have not already.'))return;
 let updated=0;
 for(const r of suggested){const c=db.people.find(p=>p.id===r.child.id);if(!c||c.parent2||!c.parent1||c.parent1===r.suggestion)continue;
  const parents=[c.parent1,r.suggestion];parents.sort((a,b)=>Number(torresLineCandidate(db.people.find(p=>p.id===b)))-Number(torresLineCandidate(db.people.find(p=>p.id===a))));
  c.parent1=parents[0];c.parent2=parents[1];updated++;
 }
 if(updated){reconcileGenerations();save();notice(`${updated} family parent links updated`)}
}
